# Commit stage: the images built by images.yml run together with their data stores and the mock PSP.
# The image variables are full references by digest, written by tools/ci/compose/compose_env.py; keys are generated per run.
name: pay-ci

x-router-env: &router-env
  ROUTER__MASTER_DATABASE__HOST: postgres
  ROUTER__MASTER_DATABASE__USERNAME: postgres
  ROUTER__MASTER_DATABASE__PASSWORD: ci
  ROUTER__MASTER_DATABASE__DBNAME: hyperswitch_db
  ROUTER__REPLICA_DATABASE__HOST: postgres
  ROUTER__REPLICA_DATABASE__USERNAME: postgres
  ROUTER__REPLICA_DATABASE__PASSWORD: ci
  ROUTER__REPLICA_DATABASE__DBNAME: hyperswitch_db
  ROUTER__REDIS__HOST: redis
  ROUTER__LOCKER__MOCK_LOCKER: "true"
  ROUTER__SECRETS__ADMIN_API_KEY: ${ADMIN_API_KEY:?generate ADMIN_API_KEY per run}

services:
  postgres:
    # Aurora PostgreSQL 16.8; the same digest as the migrations job of ci.yml
    image: postgres:16.8@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  migrate:
    image: postgres:16.8@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGUSER: postgres
    volumes:
      - ./migrate.sh:/migrate.sh:ro
      - ../../vendor/hyperswitch/migrations:/migrations/hyperswitch:ro
      - ../../vendor/card-vault/migrations:/migrations/card-vault:ro
    entrypoint: ["bash", "/migrate.sh", "hyperswitch_db=/migrations/hyperswitch", "locker=/migrations/card-vault"]

  router:
    image: ${ROUTER_IMAGE:?set ROUTER_IMAGE to an image by digest}
    command: ["-f", "/app/config/development.toml"]
    depends_on: &after-migrate
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      <<: *router-env
      ROUTER__SERVER__HOST: 0.0.0.0
      ROUTER__SERVER__PORT: "8080"
    ports: ["127.0.0.1:8080:8080"]

  drainer:
    image: ${DRAINER_IMAGE:?set DRAINER_IMAGE to an image by digest}
    command: ["-f", "/app/config/development.toml"]
    depends_on: *after-migrate
    environment:
      DRAINER__MASTER_DATABASE__HOST: postgres
      DRAINER__MASTER_DATABASE__USERNAME: postgres
      DRAINER__MASTER_DATABASE__PASSWORD: ci
      DRAINER__MASTER_DATABASE__DBNAME: hyperswitch_db
      DRAINER__REDIS__HOST: redis
      DRAINER__SERVER__HOST: 0.0.0.0
      DRAINER__SERVER__PORT: "8081"
    ports: ["127.0.0.1:8081:8081"]

  scheduler:
    image: ${SCHEDULER_IMAGE:?set SCHEDULER_IMAGE to an image by digest}
    command: ["-f", "/app/config/development.toml"]
    depends_on: *after-migrate
    environment:
      <<: *router-env
      SCHEDULER_FLOW: consumer
      ROUTER__SCHEDULER__SERVER__HOST: 0.0.0.0
      ROUTER__SCHEDULER__SERVER__PORT: "3000"
    ports: ["127.0.0.1:3000:3000"]

  locker:
    image: ${LOCKER_IMAGE:?set LOCKER_IMAGE to an image by digest}
    depends_on: *after-migrate
    environment:
      LOCKER__SERVER__HOST: 0.0.0.0
      LOCKER__SERVER__PORT: "3001"
      LOCKER__DATABASE__HOST: postgres
      LOCKER__DATABASE__USERNAME: postgres
      LOCKER__DATABASE__PASSWORD: ci
      LOCKER__DATABASE__DBNAME: locker
      LOCKER__REDIS__HOST: redis
      LOCKER__TENANT_SECRETS__PUBLIC__MASTER_KEY: ${LOCKER_MASTER_KEY:?generate LOCKER_MASTER_KEY per run}
    ports: ["127.0.0.1:3001:3001"]

  mock-psp:
    image: node:22.12.0-alpine@sha256:51eff88af6dff26f59316b6e356188ffa2c422bd3c3b76f2556a2e7e89d080bd
    user: "10001:10001"
    working_dir: /psp
    command: ["node", "server.mjs"]
    environment:
      PORT: "8089"
      PSP_LATENCY_MIN_MS: "5"
      PSP_LATENCY_MAX_MS: "50"
    volumes:
      - ../../tests/load/mock-psp:/psp:ro
    ports: ["127.0.0.1:8089:8089"]
