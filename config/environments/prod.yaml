# Sizing of one environment. prod is the reference size (architecture sections 5 and 8); stage repeats it and dev lists what it lowers.
# infra/live/<env>/env.hcl merges <env>.yaml over this file one level deep: a section named in <env>.yaml replaces the keys it lists, the rest stays.
aurora:
  writer_class: db.r7g.12xlarge
  reader_class: db.r7g.4xlarge
  reader_count: 1
memorydb:
  node_type: db.r7g.xlarge
  shards: 2
# Hot standby in us-east-1, the only standby region: clusters, node pools, services, MemoryDB and one Aurora instance per cluster run
# all the time at the full production size and take the whole load at any moment; the switch only promotes Aurora and moves DNS.
# The Aurora instance has the writer class of its working cluster (units override it for the spare and the locker).
standby:
  enabled: true
  compute_enabled: true
  reader_count: 1
  reader_class: db.r7g.12xlarge
  node_pool_cpu_limits: {payments: 400, stateful: 100, cde: 200, workers: 400}
eks:
  log_retention_days: 365
  cpu_limits: {payments: 400, stateful: 100, cde: 200, workers: 400}
  # Pools that may use Spot nodes. The cde pool never does; production lists none (an interrupted pod in a PSP call leaves the payment unknown).
  spot_pools: []
protection:
  deletion_protection: true
  vault_lock_enabled: false
