version: 1
defaults:
  worktree_root: ../wt
  branch_prefix: agent/
  base: phase_start_commit
  max_parallel: 4
  on_failure: stop_phase
  on_violation: fail_task
  max_fix_iterations: 2

agents:
  architect:              { owns: ["specs/*/spec.md", "specs/*/plan.md",
                                   "specs/*/tasks.md", "specs/README.md", "specs/ROADMAP.md", "docs/adr/drafts/**"], phase: plan }
  terraform-engineer:     { owns: ["infra/**"] }
  k8s-engineer:           { owns: ["deploy/**"] }
  rust-engineer:          { owns: ["vendor/hyperswitch/**", "vendor/card-vault/**",
                                   "vendor/hyperswitch-e2e/**", "vendor/UPSTREAM.md"],
                            not: ["vendor/*/LICENSE*", "vendor/*/NOTICE*"] }
  policy-engineer:        { owns: ["policy/**"], not: ["policy/resilience/**", "policy/cde-paths.yaml"] }
  observability-engineer: { owns: ["observability/**", "policy/resilience/**",
                                   "docs/runbooks/**"] }
  ci-engineer:            { owns: [".github/**", "docker/**", "scripts/**",
                                   "tools/**", "Makefile", "mise.toml", "SECURITY.md", "renovate.json5",
                                   ".pre-commit-config.yaml", "commitlint.config.js"] }
  perf-engineer:          { owns: ["tests/load/**", "tests/chaos/**",
                                   "docs/capacity/**", "docs/chaos/**"] }
  test-engineer:          { owns: ["tests/smoke/**", "tests/e2e/**", "tests/nodes/**",
                                   "tests/alerts/**", "tests/contracts/**", "tests/README.md"] }
  docs-writer:            { owns: ["docs/architecture/**", "docs/adr/**",
                                   "docs/security/**", "docs/dr/**", "docs/postmortems/**",
                                   "docs/glossary.md", "docs/README.md", "docs/requirements/**"], not: ["docs/postmortems/drafts/**", "docs/adr/drafts/**"] }
  sre-oncall:             { owns: ["docs/postmortems/drafts/**"] }
  refactor-implementer:   { owns: from_task }

humans_only: [".claude/**", "CLAUDE.md", ".mcp.json", "specs/_templates/**", "README.md", "LICENSE*",
              ".gitignore", "vendor/README.md", "vendor/*/LICENSE*", "vendor/*/NOTICE*",
              "tools/scripts/claude-hooks/**", "tools/lint/**", "policy/cde-paths.yaml"]
handoffs: { path: "specs/*/handoffs/{agent}-*.md", writers: all }
ci_only: ["deploy/envs/*/images.yaml"]
integrator_only: ["observability/coverage/report/**"]

pipeline:
  - phase: plan
    tasks:
      - agent: architect
        input: specs/{spec}/spec.md
        output: [specs/{spec}/plan.md, specs/{spec}/tasks.md]
      - agent: spec-reviewer
        after: architect
        input: specs/{spec}
        worktree: readonly_detached
    checks: ["orchestration-lint", "spec-lint"]
    blocking_severity: high
    gate: human_approval

  - phase: build
    parallel: true
    tasks: from_tasks_md        # every tasks.md item has agent, paths, depends_on
    worktree: per_task
    isolation: { write: owns, env: per_worktree }
    checks: ["pre-commit run --all-files", "make test"]

  - phase: review
    parallel: true
    input: diff
    worktree: readonly_detached
    tasks:
      - { agent: terraform-reviewer, when: "changed('infra/**')" }
      - { agent: k8s-reviewer, when: "changed('deploy/**')" }
      - { agent: migration-checker, when: "changed('vendor/hyperswitch/migrations/**')" }
      - { agent: pci-auditor, when: "touches_cde()" }
      - { agent: security-auditor, when: always }
      - { agent: distributed-systems-reviewer, when: "changed('infra/**') or changed('deploy/**') or changed('vendor/hyperswitch/crates/**')" }
      - { agent: finops-analyst, when: "changed('infra/**')" }
    blocking_severity: high

  - phase: integrate
    tasks:
      - merge_worktrees: { strategy: rebase, order: tasks_md, on_conflict: return_to_owner }
      - run: ["/policy-check", "/plan-infra dev", "/pci-impact", "/glossary-check"]
      - agent: docs-writer

  - phase: deliver
    tasks:
      - open_pr: { labels: [ai-reviewed], reviewers: from_codeowners }
    gate: ci_green
