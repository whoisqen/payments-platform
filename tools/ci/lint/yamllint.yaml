# Relaxed preset: real YAML errors (syntax, duplicate keys) fail, layout is never checked.
extends: relaxed
ignore: |
  vendor/
  .worktrees/
  node_modules/
  # Helm templates are Go templates, not YAML
  templates/
rules:
  line-length: disable
  indentation: disable
  trailing-spaces: disable
  empty-lines: disable
  new-line-at-end-of-file: disable
  truthy: disable
  key-duplicates: enable
