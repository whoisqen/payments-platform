# Read by tools/ci/changed_images.py; prefixes end with / and match a directory, other entries match a file.
rebuild_all:
  - docker/_common/
  - tools/ci/image-paths.yaml
images:
  router:
    - docker/router/
    - vendor/hyperswitch/
  drainer:
    - docker/drainer/
    - vendor/hyperswitch/
  scheduler:
    - docker/scheduler/
    - vendor/hyperswitch/
  locker:
    - docker/locker/
    - vendor/card-vault/
  control-center:
    - docker/control-center/
  vault-snapshot:
    - docker/vault-snapshot/
areas:
  # one area per vendored workspace: a change of one must not run the checks of the other
  rust_hyperswitch:
    - vendor/hyperswitch/
  rust_card_vault:
    - vendor/card-vault/
  terraform:
    - infra/
  helm:
    - deploy/
  policy:
    - policy/
  python:
    - tools/
    - scripts/
  workflows:
    - .github/
  docker:
    - docker/
  migrations:
    - vendor/hyperswitch/migrations/
    - vendor/card-vault/migrations/
    - .squawk.toml
  shell:
    - scripts/
    - docker/
    - tools/
