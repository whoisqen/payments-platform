# Read by tools/ci/changed_images.py; prefixes end with / and match a directory, other entries match a file.
rebuild_all:
  - docker/_common/
  - tools/ci/image-paths.yaml
# under docker/ but never copied into an image: the commit-stage compose stack
not_image_inputs:
  - docker/compose/
images:
  router:
    - docker/router/
    - vendor/hyperswitch/
  drainer:
    - docker/drainer/
    - vendor/hyperswitch/
  scheduler:
    - docker/scheduler/
    - vendor/hyperswitch/
  locker:
    - docker/locker/
    - vendor/card-vault/
  control-center:
    - docker/control-center/
  vault-snapshot:
    - docker/vault-snapshot/
  smoke:
    - docker/smoke/
    - tests/smoke/
