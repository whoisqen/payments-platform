# Read by tools/ci/changed_images.py; prefixes end with / and match a directory, other entries match a file.
rebuild_all:
  - docker/_common/
  - tools/ci/image-paths.yaml
# under docker/ but never copied into an image: the commit-stage compose stack
not_image_inputs:
  - docker/compose/
images:
  router:
    - docker/router/
    - vendor/hyperswitch/
  drainer:
    - docker/drainer/
    - vendor/hyperswitch/
  scheduler:
    - docker/scheduler/
    - vendor/hyperswitch/
  locker:
    - docker/locker/
    - vendor/card-vault/
  control-center:
    - docker/control-center/
  vault-snapshot:
    - docker/vault-snapshot/
  smoke:
    - docker/smoke/
    - tests/smoke/
  # the migration Job image: diesel and the vendored up.sql files, plus the D3 snapshot script
  migrator:
    - docker/migrator/
    - vendor/hyperswitch/migrations/
    - scripts/schema/pre-migration-snapshot.sh
  # the Kafka CLI with the MSK IAM auth jar, for the kafka-topics Job
  kafka-admin:
    - docker/kafka-admin/
  # the cell-copy Lambda function of infra/modules/cell-migration
  cell-copy:
    - docker/cell-copy/
    - services/cell-copy/
