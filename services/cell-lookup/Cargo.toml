[package]
name = "cell-lookup"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
publish = false
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cell-lookup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1.9"
async-trait = "0.1"
aws-config = { version = "1.8", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-credential-types = "1.2"
aws-sigv4 = "1.4"
base64 = "0.22"
blake3 = "=1.8.2"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
prometheus = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["time"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
