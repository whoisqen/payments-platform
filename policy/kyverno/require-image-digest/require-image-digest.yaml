# Audit first: after 7 days with no unexplained violations replace validationActions [Audit] with [Deny].
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/title: Require image digest
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: high
spec:
  validationActions: [Audit]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: images
      expression: "(object.spec.containers + object.spec.?initContainers.orValue([])).map(c, c.image)"
  validations:
    - expression: "variables.images.all(i, i.matches('@sha256:[a-f0-9]{64}$'))"
      message: "Images must be pinned by sha256 digest."
