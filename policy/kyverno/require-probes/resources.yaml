apiVersion: v1
kind: Pod
metadata: {name: both-probes, namespace: payments}
spec:
  containers:
    - name: app
      image: "123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments/router:1.4.2"
      readinessProbe: {httpGet: {path: /health/ready, port: 8080}}
      livenessProbe: {httpGet: {path: /health/live, port: 8080}}
---
apiVersion: v1
kind: Pod
metadata: {name: no-probes, namespace: payments}
spec:
  containers:
    - {name: app, image: "123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments/router:1.4.2"}
---
apiVersion: v1
kind: Pod
metadata: {name: readiness-only, namespace: payments}
spec:
  containers:
    - name: app
      image: "123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments/router:1.4.2"
      readinessProbe: {httpGet: {path: /health/ready, port: 8080}}
---
apiVersion: v1
kind: Pod
metadata: {name: second-container-bare, namespace: payments}
spec:
  containers:
    - name: app
      image: "123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments/router:1.4.2"
      readinessProbe: {httpGet: {path: /health/ready, port: 8080}}
      livenessProbe: {httpGet: {path: /health/live, port: 8080}}
    - {name: sidecar, image: "123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments/proxy:1.0.0"}
