# Audit first: after 7 days with no unexplained violations replace validationActions [Audit] with [Deny].
# The offline test covers only the missing-digest rejection; a positive check needs registry and Sigstore access.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require signed images
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: critical
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "123456789012.dkr.ecr.*.amazonaws.com/*"
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/.+/payments-platform/\\.github/workflows/release\\.yml@refs/heads/main$"
  validations:
    - expression: "images.containers.map(i, verifyImageSignatures(i, [attestors.release])).all(e, e > 0)"
      message: "Images must carry a cosign signature from the release workflow on main."
