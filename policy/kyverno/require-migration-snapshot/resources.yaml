apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-with-snapshot
  namespace: payments
  labels: {app.kubernetes.io/component: migration}
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: pre-migration-snapshot
          image: "123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments/db-snapshot:1.0.0"
          env:
            - {name: SNAPSHOT_RETENTION_DAYS, value: "35"}
      containers:
        - {name: migrate, image: "123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments/migrations:1.4.2"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-no-snapshot
  namespace: payments
  labels: {app.kubernetes.io/component: migration}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - {name: migrate, image: "123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments/migrations:1.4.2"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-short-retention
  namespace: payments
  labels: {app.kubernetes.io/component: migration}
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: pre-migration-snapshot
          image: "123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments/db-snapshot:1.0.0"
          env:
            - {name: SNAPSHOT_RETENTION_DAYS, value: "7"}
      containers:
        - {name: migrate, image: "123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments/migrations:1.4.2"}
