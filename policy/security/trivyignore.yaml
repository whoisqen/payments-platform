# Trivy waivers; every entry needs a statement (the reason) and should carry expired_at (YYYY-MM-DD).
vulnerabilities: []
misconfigurations:
  - id: DS-0031
    paths:
      - docker/vault-snapshot/Dockerfile
    statement: AWS_SHARED_CREDENTIALS_FILE and AWS_CONFIG_FILE hold file paths under /tmp, not credentials; the pod gets IRSA tokens.
  - id: GIT-0003
    paths:
      - infra/github/modules/repository/main.tf
    statement: vulnerability alerts are enabled by the separate github_repository_vulnerability_alerts resource in the same file.
  - id: AWS-0132
    paths:
      - infra/modules/log-archive/main.tf
    statement: the access-log bucket receives S3 server access logs, and S3 does not support SSE-KMS on a server access logging destination; it uses SSE-S3 (AES256), as AWS and the rule text require. The log buckets themselves use the KMS key.
  - id: AWS-0104
    paths:
      - infra/modules/ci-runners/pools.tf
    statement: CI runner egress is tcp/443 only; untrusted pools exclude every private range and leave only through the transit gateway, where the Network Firewall CI allowlist filters by domain (security groups cannot match domains).
    # accepted risk, not a false positive: review again when it expires
    expired_at: 2027-05-25
  - id: AWS-0104
    paths:
      - infra/modules/eks/main.tf
    statement: node egress to 0.0.0.0/0 is tcp/443 only and leaves through the transit gateway, where Network Firewall allows PSP domains only.
    # accepted risk, not a false positive: review again when it expires
    expired_at: 2027-05-25
