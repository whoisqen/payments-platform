# Blocking gate of `trivy config`: high and critical misconfigurations fail the job; the report run widens severity and sets exit-code 0.
severity:
  - HIGH
  - CRITICAL
exit-code: 1
scan:
  scanners:
    - misconfig
  # .dockerignore files next to a Dockerfile match the dockerfile pattern but are not Dockerfiles
  skip-files:
    - "**/*.dockerignore"
misconfiguration:
  scanners:
    - terraform
    - kubernetes
    - dockerfile
