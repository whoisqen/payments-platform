# Layered on deploy/platform/external-secrets/values.yaml: one replica each, no PDB, no ServiceMonitor
replicaCount: 1
podDisruptionBudget:
  enabled: false
serviceMonitor:
  enabled: false
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 160Mi}
webhook:
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
  serviceMonitor:
    enabled: false
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}
certController:
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
  serviceMonitor:
    enabled: false
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {memory: 128Mi}
