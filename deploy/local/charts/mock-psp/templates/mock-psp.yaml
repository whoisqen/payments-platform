apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-psp
  labels:
    app.kubernetes.io/name: mock-psp
    app.kubernetes.io/part-of: payments-platform
data:
  {{- range $path, $_ := .Files.Glob "files/*.mjs" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-psp
  labels:
    app.kubernetes.io/name: mock-psp
    app.kubernetes.io/part-of: payments-platform
spec:
  selector:
    app.kubernetes.io/name: mock-psp
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-psp
  labels:
    app.kubernetes.io/name: mock-psp
    app.kubernetes.io/part-of: payments-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-psp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-psp
        app.kubernetes.io/part-of: payments-platform
      annotations:
        checksum/code: {{ .Files.Glob "files/*.mjs" | toString | sha256sum | trunc 16 | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-psp
          image: {{ .Values.image | quote }}
          workingDir: /psp
          command: ["node", "server.mjs"]
          env:
            - {name: PORT, value: {{ .Values.port | quote }}}
            {{- range $k, $v := .Values.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet: {path: /admin/stats, port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: code, mountPath: /psp, readOnly: true}
      volumes:
        - name: code
          configMap:
            name: mock-psp
