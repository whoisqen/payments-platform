apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  labels:
    {{- include "vault-dev.labels" . | nindent 4 }}
---
# Vault reviews the tokens External Secrets presents at login
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-auth-delegator
  labels:
    {{- include "vault-dev.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-seed
  labels:
    {{- include "vault-dev.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.materialSecret }}]
    verbs: [get]
  # create cannot be narrowed by name; the seed creates only the material Secret
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-seed
  labels:
    {{- include "vault-dev.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-seed
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: {{ .Release.Namespace }}
