{{- $env := .Values.environment }}
{{- $cell := first .Values.cells }}
{{- $pg := list
  (dict "secretKey" "POSTGRES_PASSWORD" "key" (printf "%s/local/postgres" $env) "property" "admin")
  (dict "secretKey" "HS_MIGRATOR_PASSWORD" "key" (printf "%s/local/postgres" $env) "property" "hs_migrator")
  (dict "secretKey" "LOCKER_MIGRATOR_PASSWORD" "key" (printf "%s/local/postgres" $env) "property" "locker_migrator")
  (dict "secretKey" "HS_APP_PASSWORD" "key" (printf "%s/%s/router/database" $env $cell) "property" "password")
  (dict "secretKey" "LOCKER_APP_PASSWORD" "key" (printf "%s/locker/database" $env) "property" "password") }}
{{- /* One ACL user per cell service, named <cell>-<service> as the charts send it, plus the ratelimit user */}}
{{- $redis := list (dict "secretKey" "ratelimit" "key" (printf "%s/local/redis" $env) "property" "ratelimit") }}
{{- $acl := list "user default off" (printf "user ratelimit on >%s ~* &* +@all" "{{ .ratelimit }}") }}
{{- range $c := .Values.cells }}
{{- range $svc := list "router" "drainer" "scheduler" }}
{{- $k := printf "%s_%s" (replace "-" "_" $c) $svc }}
{{- $redis = append $redis (dict "secretKey" $k "key" (printf "%s/%s/%s/redis" $env $c $svc) "property" "password") }}
{{- $acl = append $acl (printf "user %s-%s on >{{ .%s }} ~* &* +@all" $c $svc $k) }}
{{- end }}
{{- end }}
{{ include "local-data.externalSecret" (dict "root" . "name" "postgres-credentials" "data" $pg) }}
---
{{ include "local-data.externalSecret" (dict "root" . "name" "redis-acl" "data" $redis "template" (dict "users.acl" (printf "%s\n" (join "\n" $acl)))) }}
{{- if .Values.chartMigrations.enabled }}
---
{{ include "local-data.externalSecret" (dict "root" . "name" .Values.chartMigrations.secretName "namespace" .Values.chartMigrations.namespace "data" (list (dict "secretKey" "password" "key" (printf "%s/local/postgres" $env) "property" "hs_migrator"))) }}
{{- end }}
