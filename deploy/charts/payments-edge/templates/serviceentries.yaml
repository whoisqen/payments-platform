{{- /* The Hostname backends of the HTTPRoutes must be in the mesh registry (outboundTrafficPolicy REGISTRY_ONLY): one entry per cell router */ -}}
{{- with .Values.routing.cells }}
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: cell-routers
  labels:
    {{- include "payments-edge.labels" $ | nindent 4 }}
spec:
  hosts:
    {{- range . }}
    - {{ include "payments-edge.cellHost" (dict "cell" . "root" $) }}
    {{- end }}
  exportTo: ["."]
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    {{- $ports := list }}
    {{- range . }}{{ $ports = append $ports (.port | default $.Values.routing.cellPort | int) }}{{ end }}
    {{- range ($ports | uniq) }}
    # HTTP from the gateway proxy; the DestinationRule below originates mutual TLS to the router gateway of the cell
    - {number: {{ . }}, name: http-router-{{ . }}, protocol: HTTP}
    {{- end }}
{{- end }}
