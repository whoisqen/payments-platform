apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: payments-edge
  labels:
    app.kubernetes.io/name: payments-edge
    app.kubernetes.io/part-of: payments-platform
spec:
  hosts:
    {{- toYaml .Values.gateway.hosts | nindent 4 }}
  gateways:
    - payments-edge
  http:
    {{- range .Values.routing.cells }}
    - name: {{ .name }}
      match:
        - headers:
            {{ $.Values.routing.cellHeader }}:
              exact: {{ .name }}
      route:
        - destination:
            host: {{ .host }}
            port:
              number: {{ .port | default 8080 }}
      # Longer than the 15 s PSP call, and never retried: a charge is not repeated automatically
      timeout: {{ $.Values.routing.timeout }}
      retries:
        attempts: 0
    {{- end }}
    # A merchant without a resolved cell gets a clear error instead of a guess
    - name: unresolved
      directResponse:
        status: 503
