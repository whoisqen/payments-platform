apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: payments-edge
  labels:
    app.kubernetes.io/name: payments-edge
    app.kubernetes.io/part-of: payments-platform
spec:
  secretName: {{ .Values.gateway.tlsCredentialName }}
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  dnsNames:
    {{- toYaml .Values.gateway.hosts | nindent 4 }}
  issuerRef:
    name: {{ .Values.certificate.issuerName }}
    kind: {{ .Values.certificate.issuerKind }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
