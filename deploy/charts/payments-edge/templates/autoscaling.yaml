apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payments-edge
  labels:
    {{- include "payments-edge.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "payments-edge.proxyName" . }}
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.autoscaling.targetCPUUtilizationPercentage }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payments-edge
  labels:
    {{- include "payments-edge.labels" . | nindent 4 }}
spec:
  minAvailable: {{ sub (int .Values.gateway.autoscaling.minReplicas) 1 }}
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: payments-edge
