apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: payments-edge
  labels:
    {{- include "payments-edge.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  {{- with .Values.gateway.serviceAnnotations }}
  infrastructure:
    annotations:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  listeners:
    {{- range $i, $host := .Values.gateway.hosts }}
    - name: https-{{ $i }}
      port: 443
      protocol: HTTPS
      hostname: {{ $host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $.Values.gateway.tlsCredentialName }}
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: Same
    {{- end }}
