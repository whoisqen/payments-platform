{{- range .Values.routing.cells }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-edge-{{ .name }}
  labels:
    {{- include "payments-edge.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: payments-edge
  hostnames:
    {{- toYaml $.Values.gateway.hosts | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - type: Exact
              name: {{ $.Values.routing.cellHeader }}
              value: {{ .name }}
      backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: {{ include "payments-edge.cellHost" (dict "cell" . "root" $) }}
          port: {{ .port | default $.Values.routing.cellPort }}
      # Longer than the 15 s PSP call; no retry stanza, a charge is not repeated automatically
      timeouts:
        request: {{ $.Values.routing.timeout }}
{{- end }}
