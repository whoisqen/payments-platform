apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: payments-edge-load-shedding
  labels:
    app.kubernetes.io/name: payments-edge
    app.kubernetes.io/part-of: payments-platform
spec:
  workloadSelector:
    labels:
      {{- toYaml .Values.gateway.selector | nindent 6 }}
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/udpa.type.v1.TypedStruct
            type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            value:
              stat_prefix: payments_edge_local_rate_limit
              status:
                code: TooManyRequests
              token_bucket:
                max_tokens: {{ .Values.rateLimit.maxTokens }}
                tokens_per_fill: {{ .Values.rateLimit.tokensPerFill }}
                fill_interval: {{ .Values.rateLimit.fillInterval }}
              filter_enabled:
                runtime_key: local_rate_limit_enabled
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                runtime_key: local_rate_limit_enforced
                default_value:
                  numerator: 100
                  denominator: HUNDRED
