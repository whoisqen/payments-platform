suite: payments-edge
templates:
  - gateway.yaml
  - httproute.yaml
  - envoyfilter.yaml
  - certificate.yaml
  - autoscaling.yaml
set:
  global.environment: dev
  global.region: eu-central-1
  gateway.hosts: ["api.dev.payments.example.com"]
  routing.cells:
    - name: cell-0
      host: router.cell-0.example
    - name: spare
      host: router.spare.example
tests:
  - it: uses the Gateway API Gateway with TLS termination from the certificate secret
    template: gateway.yaml
    asserts:
      - isKind:
          of: Gateway
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1
      - equal:
          path: spec.listeners[0].port
          value: 443
      - equal:
          path: spec.listeners[0].tls.mode
          value: Terminate
      - equal:
          path: spec.listeners[0].tls.certificateRefs[0].name
          value: payments-edge-tls
  - it: renders no Istio Gateway or VirtualService
    template: httproute.yaml
    asserts:
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1
        documentIndex: 0
  - it: renders one HTTPRoute per cell that matches the cell header
    template: httproute.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.rules[0].matches[0].headers[0].name
          value: x-payments-cell
        documentIndex: 0
      - equal:
          path: spec.rules[0].matches[0].headers[0].value
          value: cell-0
        documentIndex: 0
      - equal:
          path: spec.rules[0].matches[0].headers[0].value
          value: spare
        documentIndex: 1
  - it: times out after 20s and has no retry stanza
    template: httproute.yaml
    asserts:
      - equal:
          path: spec.rules[0].timeouts.request
          value: 20s
      - notExists:
          path: spec.rules[0].retry
      - notExists:
          path: spec.rules[0].retries
  - it: targets the Gateway and disables retries at the route
    template: envoyfilter.yaml
    asserts:
      - equal:
          path: spec.targetRefs[0].kind
          value: Gateway
      - equal:
          path: spec.targetRefs[0].name
          value: payments-edge
      - notExists:
          path: spec.workloadSelector
      - equal:
          path: spec.configPatches[1].applyTo
          value: HTTP_ROUTE
      - equal:
          path: spec.configPatches[1].patch.value.route.retry_policy.num_retries
          value: 0
  - it: sets the TLS floor to 1.2
    template: envoyfilter.yaml
    asserts:
      - equal:
          path: spec.configPatches[0].patch.value.transport_socket.typed_config.common_tls_context.tls_params.tls_minimum_protocol_version
          value: TLSv1_2
  - it: answers 503 for an unresolved cell and assigns the class in the Lua filter
    template: envoyfilter.yaml
    asserts:
      - equal:
          path: spec.configPatches[2].patch.value.name
          value: envoy.filters.http.lua
      - matchRegex:
          path: spec.configPatches[2].patch.value.typed_config.default_source_code.inline_string
          pattern: '\[":status"\] = "503"'
      - matchRegex:
          path: spec.configPatches[2].patch.value.typed_config.default_source_code.inline_string
          pattern: 'class = "list"'
  - it: sheds with 429 and Retry-After, lists before reads before payments
    template: envoyfilter.yaml
    asserts:
      - equal:
          path: spec.configPatches[3].patch.value.name
          value: envoy.filters.http.local_ratelimit
      - equal:
          path: spec.configPatches[3].patch.value.typed_config.status.code
          value: TooManyRequests
      - equal:
          path: spec.configPatches[3].patch.value.typed_config.response_headers_to_add[0].header.key
          value: retry-after
      - equal:
          path: spec.configPatches[3].patch.value.typed_config.descriptors[0].entries[0].value
          value: list
      - equal:
          path: spec.configPatches[3].patch.value.typed_config.descriptors[0].token_bucket.max_tokens
          value: 200
      - equal:
          path: spec.configPatches[3].patch.value.typed_config.descriptors[1].entries[0].value
          value: read
      - equal:
          path: spec.configPatches[3].patch.value.typed_config.descriptors[2].entries[0].value
          value: payments
  - it: calls the global rate limit service and fails open
    template: envoyfilter.yaml
    asserts:
      - equal:
          path: spec.configPatches[5].patch.value.name
          value: envoy.filters.http.ratelimit
      - equal:
          path: spec.configPatches[5].patch.value.typed_config.domain
          value: payments-edge
      - equal:
          path: spec.configPatches[5].patch.value.typed_config.failure_mode_deny
          value: false
      - equal:
          path: spec.configPatches[5].patch.value.typed_config.rate_limit_service.grpc_service.envoy_grpc.cluster_name
          value: ratelimit.ratelimit.svc:8081
      - equal:
          path: spec.configPatches[6].patch.value.rate_limits[0].actions[0].request_headers.descriptor_key
          value: merchant
      - equal:
          path: spec.configPatches[6].patch.value.rate_limits[0].actions[1].request_headers.descriptor_key
          value: request_class
  - it: adds overload manager actions on heap and connections
    template: envoyfilter.yaml
    asserts:
      - equal:
          path: spec.configPatches[7].applyTo
          value: BOOTSTRAP
      - equal:
          path: spec.configPatches[7].patch.value.overload_manager.actions[1].name
          value: envoy.overload_actions.stop_accepting_requests
      - lengthEqual:
          path: spec.configPatches[7].patch.value.overload_manager.actions[1].triggers
          count: 2
  - it: drops the global limiter and overload patches when disabled
    template: envoyfilter.yaml
    set:
      rateLimit.global.enabled: false
      overload.enabled: false
    asserts:
      - lengthEqual:
          path: spec.configPatches
          count: 4
  - it: scales the generated proxy Deployment
    template: autoscaling.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.scaleTargetRef.name
          value: payments-edge-istio
  - it: issues the gateway certificate from the issuer
    template: certificate.yaml
    asserts:
      - equal:
          path: spec.issuerRef.name
          value: payments-ca
  - it: rejects a limiter that fails closed
    template: envoyfilter.yaml
    set:
      rateLimit.global.failureModeDeny: true
    asserts:
      - failedTemplate: {}
  - it: rejects a cell name outside the five cells
    template: httproute.yaml
    set:
      routing.cells:
        - name: cell-9
          host: x
    asserts:
      - failedTemplate: {}
  - it: rejects an empty host list
    template: gateway.yaml
    set:
      gateway.hosts: []
    asserts:
      - failedTemplate: {}
