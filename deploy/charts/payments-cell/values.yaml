# Layers on top of these defaults: envs/<env>, envs/<env>/<region>, envs/<env>/<region>/<cell>, images.yaml
global:
  cell: ""
  environment: ""
  region: ""
  # Data subnets of the cell (MemoryDB, Aurora); the NetworkPolicy opens the data ports only to them
  dataCidrs: []
  # VPC interface endpoints reached by the snapshot step of the migrations Job
  endpointCidrs: []
  # The external dependencies of the cell as ServiceEntries (Istio outboundTrafficPolicy REGISTRY_ONLY)
  egress:
    serviceEntries: true
    # <service>.<region>.amazonaws.com: KMS (data keys), STS, Secrets Manager, DynamoDB (cell routing map), S3, CloudWatch Logs
    awsServices: [kms, sts, secretsmanager, dynamodb, s3, logs]
    podIdentityAgent: 169.254.170.23
    # PSP API hosts the egress firewall allows (dns.psp_domains of config/platform.yaml); wildcards allowed
    pspHosts: []
    # Host of central.sentry_url and the address range it is reached at (shared-services VPC through the transit gateway)
    sentryHosts: []
    sentryCidrs: []
  # Hyperswitch settings shared by router, drainer and scheduler; defaults live in platform-common (hyperswitch/_defaults.tpl).
  # Secrets are not here: each chart maps them to Vault paths <kvMount>/<env>/<cell>/{router,drainer,scheduler,shared}/...
  hyperswitch:
    requireEndpoints: true
    # File of vendor/hyperswitch/config/deployments baked into the images: sandbox.toml points connectors at PSP test endpoints
    configFile: production.toml
    logLevel: INFO
    database:
      # RDS Proxy endpoint of the cell (infra aurora-global output proxy_endpoint); readerHost empty means the same endpoint
      host: ""
      readerHost: ""
      port: 5432
      name: hyperswitch
      user: hs_app
      sslMode: verify-full
    redis:
      # MemoryDB cluster configuration endpoint; ACL users per service, TLS always on
      host: ""
      port: 6379
      clusterEnabled: true
      tls: true
    kms:
      # Empty derives alias/pay-<env>-<region short>-<cell>
      keyAlias: ""
    tenant:
      # Public API host of the environment and the panel URL used in user e-mails and redirects
      baseUrl: ""
      controlCenterUrl: ""
    drainer:
      streamName: DRAINER_STREAM
      numPartitions: 64
    events:
      kafka: false
      brokers: []

# Cross-cluster entry of the cell from the edge (infra/modules/cell-endpoint): mutual-TLS Gateway behind an internal NLB
routerGateway:
  enabled: true
  # deploy.<env>.cluster_domain of config/platform.yaml; the host is router.payments.svc.<cell>.<clusterDomain>
  clusterDomain: ""
  port: 8443
  routerPort: 8080
  secretName: router-gateway-tls
  # Terraform output target_group_arn of infra/live/<env>/<region>/<cell>/endpoint
  targetGroupArn: REPLACE_ROUTER_TARGET_GROUP_ARN
  # URI SANs of the edge client certificates (Vault role edge-client), as Istio principals
  clientPrincipals:
    - payments-platform/ns/payments-edge/sa/edge
  pki:
    mount: pki-mesh
    # the central Vault (vault.host of config/platform.yaml)
    vaultServer: ""
    caBundle: ""
    # empty: k8s-<prefix>-<env>-<region short>-<cell>, the jwt mount of the cell cluster
    authMount: ""
    serviceAccount: router-gateway-pki
    ttl: 72h
    refreshInterval: 24h
