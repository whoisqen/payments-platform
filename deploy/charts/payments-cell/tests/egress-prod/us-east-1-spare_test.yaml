# Generated by tests/generate_egress_tests.py from deploy/envs; edit the layers, not this file.
suite: 'prod/us-east-1/spare: every external host has a ServiceEntry (generated by
  generate_egress_tests.py)'
templates:
- serviceentries.yaml
values:
- ../../ci/lint-values.yaml
- ../../../../envs/prod/values.yaml
- ../../../../envs/prod/us-east-1/values.yaml
- ../../../../envs/prod/us-east-1/spare/values.yaml
tests:
- it: registers the Aurora proxy
  documentSelector:
    path: metadata.name
    value: egress-aurora
  asserts:
