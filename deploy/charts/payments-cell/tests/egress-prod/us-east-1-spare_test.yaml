      path: spec.hosts
      content: pay-prod-use1-aurora-spare.proxy-example.us-east-1.rds.amazonaws.com
- it: registers the MemoryDB endpoint
  documentSelector:
    path: metadata.name
    value: egress-memorydb
  asserts:
  - contains:
      path: spec.hosts
      content: clustercfg.pay-prod-use1-memorydb-spare.example.memorydb.us-east-1.amazonaws.com
- it: registers pspHosts
  documentSelector:
    path: metadata.name
    value: egress-psp
  asserts:
  - contains:
      path: spec.hosts
      content: '*.psp-sandbox.example.com'
- it: registers sentryHosts
  documentSelector:
    path: metadata.name
    value: egress-sentry
  asserts:
  - contains:
      path: spec.hosts
      content: sentry.payments.internal
