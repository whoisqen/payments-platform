suite: migrations job
templates:
  - job.yaml
  - serviceaccount.yaml
  - networkpolicy.yaml
  - backfill-job.yaml
set:
  global.registry: registry.example.test/acme
  global.region: eu-central-1
  global.environment: dev
  global.cell: cell-0
  global.accountId: "111111111111"
  image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  global.dataCidrs: ["10.0.0.0/16"]
  global.endpointCidrs: ["10.0.8.0/24"]
tests:
  - it: never retries DDL and runs as a pre-upgrade hook
    template: job.yaml
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 86400
  - it: takes the snapshot before the migration starts
    template: job.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: pre-migration-snapshot
      - equal:
          path: spec.template.spec.initContainers[0].command[0]
          value: /opt/migrator/snapshot.sh
      - equal:
          path: spec.template.spec.containers[0].name
          value: migrate
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MIGRATION_MODE
            value: expand-only
  - it: stays out of the mesh and runs as migrator with the migrations label
    template: job.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "false"
      - equal:
          path: spec.template.spec.serviceAccountName
          value: migrator
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: migrations
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
  - it: labels the Job as a migration for the Kyverno snapshot policy
    template: job.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migration
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: migrations
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: {name: SNAPSHOT_RETENTION_DAYS, value: "35"}
  - it: skips the snapshot only when it is switched off
    template: job.yaml
    set:
      snapshot.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
  - it: allows egress only to the database, DNS and the VPC endpoints
    template: networkpolicy.yaml
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5432
      - equal:
          path: spec.egress[2].ports[0].port
          value: 443
      - lengthEqual:
          path: spec.egress
          count: 3
  - it: creates the ServiceAccount before the Job
    template: serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-15"
  - it: renders the backfill Job only when enabled and without a hook
    template: backfill-job.yaml
    set:
      backfill.enabled: true
    asserts:
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: BACKFILL_BATCH_SIZE, value: "10000"}
  - it: renders no backfill by default
    template: backfill-job.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: rejects a RDS Proxy endpoint
    template: job.yaml
    set:
      database.host: cell-0-proxy.proxy-abc.eu-central-1.rds.amazonaws.com
    asserts:
      - failedTemplate: {}
  - it: rejects a tag instead of a digest
    template: job.yaml
    set:
      image.digest: v1.0.0
    asserts:
      - failedTemplate: {}
