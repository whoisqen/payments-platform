apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "migrations.labels" . | nindent 4 }}
  annotations:
    {{- include "migrations.hook" (dict "weight" (sub (int .Values.job.hookWeight) 5)) | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
