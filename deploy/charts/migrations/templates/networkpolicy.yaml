{{- $g := .Values.global | default dict }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-migrations
  labels:
    {{- include "migrations.labels" . | nindent 4 }}
  annotations:
    {{- include "migrations.hook" (dict "weight" (sub (int .Values.job.hookWeight) 4)) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform-common.selectorLabels" (dict "root" . "component" "migrations") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with $g.dataCidrs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ $.Values.database.port }}
          protocol: TCP
    {{- end }}
    {{- if and .Values.snapshot.enabled $g.endpointCidrs }}
    # The snapshot call reaches the AWS APIs through VPC endpoints only
    - to:
        {{- range $g.endpointCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
