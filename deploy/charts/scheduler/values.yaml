# image.digest is supplied by deploy/envs/<env>/images.yaml (CI only); one image serves both flows
image:
  repository: scheduler
  pullPolicy: IfNotPresent

# Router settings (the scheduler binary reads the router configuration); cell-wide values come from global.hyperswitch
hyperswitch:
  prefix: ROUTER
  redisUser: scheduler
  poolSize: 5
  replicaPoolSize: 2

# Variable -> {key, property} under <kvMount>/<env>/<cell>/ in Vault; shared/* must equal what the router reads
secrets:
  ROUTER__MASTER_DATABASE__PASSWORD: {key: scheduler/database, property: password}
  ROUTER__REPLICA_DATABASE__PASSWORD: {key: scheduler/database, property: password}
  ROUTER__ANALYTICS__SQLX__PASSWORD: {key: scheduler/database, property: password}
  ROUTER__REDIS__PRIMARY_PASSWORD: {key: scheduler/redis, property: password}
  ROUTER__SECRETS__MASTER_ENC_KEY: {key: shared/app, property: master_enc_key}
  ROUTER__SECRETS__ADMIN_API_KEY: {key: shared/app, property: admin_api_key}
  ROUTER__SECRETS__JWT_SECRET: {key: shared/app, property: jwt_secret}
  ROUTER__API_KEYS__HASH_KEY: {key: shared/app, property: api_keys_hash_key}
  ROUTER__USER_AUTH_METHODS__ENCRYPTION_KEY: {key: shared/app, property: user_auth_encryption_key}
  ROUTER__JWEKEY__VAULT_ENCRYPTION_KEY: {key: shared/locker, property: vault_encryption_key}
  ROUTER__JWEKEY__VAULT_PRIVATE_KEY: {key: shared/locker, property: vault_private_key}
  ROUTER__JWEKEY__TUNNEL_PRIVATE_KEY: {key: shared/locker, property: tunnel_private_key}

# Two producers at once are forbidden: Recreate plus the Lease and fencing inside the application
producer:
  workload:
    kind: Deployment
    replicas: 2
    minReadySeconds: 10
    strategy:
      type: Recreate
  container:
    port: 3000
    env:
      SCHEDULER_FLOW: producer
      RUN_ENV: production
      # The scheduler web server binds to 127.0.0.1 by default and the kubelet probe cannot reach it
      ROUTER__SCHEDULER__SERVER__HOST: 0.0.0.0
      ROUTER__SCHEDULER__SERVER__PORT: "3000"
      ROUTER__SCHEDULER__SERVER__WORKERS: "1"
      # Stream and group must match the consumer
      ROUTER__SCHEDULER__STREAM: SCHEDULER_STREAM
      ROUTER__SCHEDULER__CONSUMER_GROUP: SCHEDULER_GROUP
      ROUTER__SCHEDULER__GRACEFUL_SHUTDOWN_INTERVAL: "60000"
      ROUTER__SCHEDULER__LOOP_INTERVAL: "30000"
      ROUTER__SCHEDULER__PRODUCER__BATCH_SIZE: "50"
      # The Redis lock is the in-application fencing of the single producer; its TTL outlives one loop
      ROUTER__SCHEDULER__PRODUCER__LOCK_KEY: producer_locking_key
      ROUTER__SCHEDULER__PRODUCER__LOCK_TTL: "160"
      ROUTER__SCHEDULER__PRODUCER__LOWER_FETCH_LIMIT: "900"
      ROUTER__SCHEDULER__PRODUCER__UPPER_FETCH_LIMIT: "0"
      # Traces and metrics go to the collector of the same node; it masks, samples and forwards them to the central stack
      ROUTER__LOG__TELEMETRY__TRACES_ENABLED: "true"
      ROUTER__LOG__TELEMETRY__METRICS_ENABLED: "true"
      ROUTER__LOG__TELEMETRY__OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4317
    # Error tracking: the DSN comes from an ExternalSecret when remoteKey is set (<prefix>/<env>/sentry/<service>-dsn in the environment layer)
    sentryDsn:
      envName: ROUTER__LOG__SENTRY__DSN
      remoteKey: ""
    envFromSecrets: []
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 512Mi
  probes:
    startup:
      path: /health
      periodSeconds: 5
      failureThreshold: 36
    liveness:
      path: /health
      periodSeconds: 10
    readiness:
      path: /health
      periodSeconds: 5
  lifecycle:
    preStopSeconds: 15
    terminationGracePeriodSeconds: 60
  # A producer must not be interrupted, so it stays off Spot
  scheduling:
    nodePool: payments
  service:
    enabled: true
    port: 3000
  autoscaling:
    enabled: false
  pdb:
    enabled: true
    maxUnavailable: 10%
  networkPolicy:
    enabled: true
    # KMS and STS through the interface endpoints (global.endpointCidrs) and the Pod Identity agent
    awsEndpoints: true
    dataPorts: [5432, 6379]
    extraEgress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            podSelector:
              matchLabels:
                app.kubernetes.io/name: opentelemetry-collector
        ports:
          - {protocol: TCP, port: 4317}
  serviceMonitor:
    enabled: true
    path: /metrics
  serviceAccount:
    create: true
  istio:
    inject: true

consumer:
  workload:
    kind: Deployment
    minReadySeconds: 10
    strategy:
      type: RollingUpdate
      maxSurge: 25%
      maxUnavailable: 0
  container:
    port: 3000
    env:
      SCHEDULER_FLOW: consumer
      RUN_ENV: production
      ROUTER__SCHEDULER__SERVER__HOST: 0.0.0.0
      ROUTER__SCHEDULER__SERVER__PORT: "3000"
      ROUTER__SCHEDULER__SERVER__WORKERS: "1"
      ROUTER__SCHEDULER__STREAM: SCHEDULER_STREAM
      ROUTER__SCHEDULER__CONSUMER_GROUP: SCHEDULER_GROUP
      ROUTER__SCHEDULER__GRACEFUL_SHUTDOWN_INTERVAL: "60000"
      ROUTER__SCHEDULER__LOOP_INTERVAL: "3000"
      ROUTER__SCHEDULER__CONSUMER__CONSUMER_GROUP: SCHEDULER_GROUP
      ROUTER__SCHEDULER__CONSUMER__DISABLED: "false"
      # Traces and metrics go to the collector of the same node; it masks, samples and forwards them to the central stack
      ROUTER__LOG__TELEMETRY__TRACES_ENABLED: "true"
      ROUTER__LOG__TELEMETRY__METRICS_ENABLED: "true"
      ROUTER__LOG__TELEMETRY__OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4317
      # Read by the KEDA trigger below, which runs outside the pod
      REDIS_ADDRESS: memorydb.invalid:6379
      # Merchant webhooks go to arbitrary hosts: HTTP CONNECT through the egress gateway (deploy/platform/istio/egress), the only
      # path to an unregistered host; PSPs (dns.psp_domains), AWS and the cluster names stay direct
      ROUTER__PROXY__HTTPS_URL: http://istio-egressgateway.istio-egress.svc.cluster.local:8080
      ROUTER__PROXY__HTTP_URL: http://istio-egressgateway.istio-egress.svc.cluster.local:8080
      ROUTER__PROXY__BYPASS_PROXY_HOSTS: "localhost, cluster.local, internal, amazonaws.com, psp-sandbox.example.com"
    # Error tracking: the DSN comes from an ExternalSecret when remoteKey is set (<prefix>/<env>/sentry/<service>-dsn in the environment layer)
    sentryDsn:
      envName: ROUTER__LOG__SENTRY__DSN
      remoteKey: ""
    envFromSecrets: []
    # Sized below the 200 tasks/s per pod of section 8 with room for retries
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 512Mi
  probes:
    startup:
      path: /health
      periodSeconds: 5
      failureThreshold: 36
    liveness:
      path: /health
      periodSeconds: 10
    readiness:
      path: /health
      periodSeconds: 5
  lifecycle:
    preStopSeconds: 15
    terminationGracePeriodSeconds: 60
  # Safe to restart, so Spot is acceptable on the workers pool
  scheduling:
    nodePool: workers
  service:
    enabled: true
    port: 3000
  autoscaling:
    enabled: true
    kind: keda
    minReplicas: 3
    maxReplicas: 12
    triggers:
      - type: redis-streams
        metadata:
          addressFromEnv: REDIS_ADDRESS
          passwordFromEnv: REDIS_PASSWORD
          enableTLS: "true"
          stream: SCHEDULER_STREAM
          consumerGroup: SCHEDULER_GROUP
          # 200 tasks/s per pod, about 70% target over a 15 s poll
          pendingEntriesCount: "2000"
  pdb:
    enabled: true
    maxUnavailable: 10%
  networkPolicy:
    enabled: true
    # KMS and STS through the interface endpoints (global.endpointCidrs) and the Pod Identity agent
    awsEndpoints: true
    # PSP sync and the outgoing calls of the workflows, through the egress firewall
    pspEgress: true
    # Merchant webhooks through the egress gateway
    webhookEgress: true
    dataPorts: [5432, 6379]
    extraEgress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            podSelector:
              matchLabels:
                app.kubernetes.io/name: opentelemetry-collector
        ports:
          - {protocol: TCP, port: 4317}
  serviceMonitor:
    enabled: true
    path: /metrics
  serviceAccount:
    create: true
  istio:
    inject: true
