suite: router workload
templates:
  - workload.yaml
set:
  global.registry: registry.example.test/acme
  global.environment: dev
  global.region: eu-central-1
  global.cell: cell-0
  image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
tests:
  - it: renders a canary Rollout pinned by digest
    documentIndex: 0
    asserts:
      - isKind:
          of: Rollout
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.test/acme/router@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - equal:
          path: spec.strategy.canary.steps[0].setWeight
          value: 1
      - equal:
          path: spec.strategy.canary.steps[6].setWeight
          value: 50
  - it: has no Spot toleration and runs on the payments pool
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.template.spec.tolerations
      - equal:
          path: spec.template.spec.nodeSelector["karpenter.sh/nodepool"]
          value: payments
  - it: spreads pods over three AZs
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: DoNotSchedule
  - it: drains for 15 s inside a 60 s grace period
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 15
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
  - it: runs non-root with a read-only root file system
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]
  - it: passes the cache warm-up gate to the readiness endpoint
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CACHE_WARM_MIN_RATIO
            value: "0.75"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CACHE_WARM_MAX_WAIT_SECONDS
            value: "300"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health/ready
  - it: renders a Deployment when the kind is switched
    documentIndex: 0
    set:
      workload.kind: Deployment
      workload.strategy.type: RollingUpdate
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
  - it: refuses a maxReplicas below minReplicas
    set:
      autoscaling.minReplicas: 10
      autoscaling.maxReplicas: 5
    asserts:
      - failedTemplate:
          errorPattern: maxReplicas must not be lower than minReplicas
