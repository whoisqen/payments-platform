# image.digest is supplied by deploy/envs/<env>/images.yaml (CI only); a tag is rejected by the schema
image:
  repository: router
  pullPolicy: IfNotPresent

workload:
  kind: Rollout
  # After drainer (wave 0): a new router may write stream fields only a new drainer reads
  syncWave: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 900
  strategy:
    type: Canary
    # 1 -> 5 -> 25 -> 50 -> 100 with 10 minutes of analysis between steps (section 4)
    weights: [1, 5, 25, 50]
    pauseDuration: 10m
  analysis:
    prometheusAddress: http://prometheus-operated.monitoring.svc:9090
    maxErrorRate: 0.0005
    maxP99DeltaMs: 150
    authorizationRate: true

# Cell-wide settings (database, MemoryDB, KMS, tenant, locker, events) come from global.hyperswitch through platform-common
hyperswitch:
  prefix: ROUTER
  # MemoryDB ACL user of the service (infra memorydb_users)
  redisUser: router
  poolSize: 10
  replicaPoolSize: 5

# Variable -> {key, property} under <kvMount>/<env>/<cell>/ in Vault; the values never appear in git
secrets:
  ROUTER__MASTER_DATABASE__PASSWORD: {key: router/database, property: password}
  ROUTER__REPLICA_DATABASE__PASSWORD: {key: router/database, property: password}
  ROUTER__ANALYTICS__SQLX__PASSWORD: {key: router/database, property: password}
  ROUTER__REDIS__PRIMARY_PASSWORD: {key: router/redis, property: password}
  ROUTER__SECRETS__MASTER_ENC_KEY: {key: shared/app, property: master_enc_key}
  ROUTER__SECRETS__ADMIN_API_KEY: {key: shared/app, property: admin_api_key}
  ROUTER__SECRETS__JWT_SECRET: {key: shared/app, property: jwt_secret}
  ROUTER__API_KEYS__HASH_KEY: {key: shared/app, property: api_keys_hash_key}
  ROUTER__USER_AUTH_METHODS__ENCRYPTION_KEY: {key: shared/app, property: user_auth_encryption_key}
  ROUTER__JWEKEY__VAULT_ENCRYPTION_KEY: {key: shared/locker, property: vault_encryption_key}
  ROUTER__JWEKEY__VAULT_PRIVATE_KEY: {key: shared/locker, property: vault_private_key}
  ROUTER__JWEKEY__TUNNEL_PRIVATE_KEY: {key: shared/locker, property: tunnel_private_key}

container:
  port: 8080
  env:
    RUN_ENV: production
    ROUTER__SERVER__HOST: 0.0.0.0
    ROUTER__SERVER__PORT: "8080"
    # Two actix workers per requested vCPU; the request body limit and timeouts stay at the upstream defaults
    ROUTER__SERVER__WORKERS: "2"
    # Below the 60 s grace period so in-flight PSP calls finish before SIGKILL
    ROUTER__SERVER__SHUTDOWN_TIMEOUT: "30"
    # Origins are the panel of the environment (environment layer); never a wildcard
    ROUTER__CORS__ORIGINS: https://panel.invalid
    ROUTER__CORS__ALLOWED_METHODS: GET,POST,PUT,DELETE
    ROUTER__CORS__MAX_AGE: "30"
    ROUTER__CORS__WILDCARD_ORIGIN: "false"
    # Traces and metrics go to the collector of the same node; it masks, samples and forwards them to the central stack
    ROUTER__LOG__TELEMETRY__TRACES_ENABLED: "true"
    ROUTER__LOG__TELEMETRY__METRICS_ENABLED: "true"
    ROUTER__LOG__TELEMETRY__OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4317
  # Error tracking: the DSN comes from an ExternalSecret when remoteKey is set (<prefix>/<env>/sentry/<service>-dsn in the environment layer)
  sentryDsn:
    envName: ROUTER__LOG__SENTRY__DSN
    remoteKey: ""
  envFromSecrets: []
  # 1 vCPU and 3 GiB per pod is the base capacity of section 8; CPU has no limit to avoid throttling during a PSP call
  resources:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      memory: 3Gi

probes:
  # Boot is allowed 5 minutes before the kubelet restarts the pod
  startup:
    path: /health
    periodSeconds: 5
    failureThreshold: 60
  liveness:
    path: /health
    periodSeconds: 10
    failureThreshold: 3
  # The deep check reaches MemoryDB and PostgreSQL; the cache warm-up gate of D8 sits behind it
  readiness:
    path: /health/ready
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

lifecycle:
  preStopSeconds: 15
  terminationGracePeriodSeconds: 60

# On-Demand pool without a Spot toleration: a pod killed mid-call to a PSP creates an unknown state
scheduling:
  nodePool: payments
  tolerations: []

warmup:
  enabled: true
  minRatio: 0.75
  maxWaitSeconds: 300

service:
  enabled: true
  port: 8080

autoscaling:
  enabled: true
  kind: hpa
  minReplicas: 20
  maxReplicas: 90
  targetCPU: 70
  # 15 RPS base capacity at 70% target until the breakpoint test confirms 60
  rpsPerPod: 10

pdb:
  enabled: true
  maxUnavailable: 10%

networkPolicy:
  enabled: true
  dataPorts: [5432, 6379]
  extraIngress: []
  extraEgress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - {protocol: TCP, port: 4317}

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

serviceAccount:
  create: true
  annotations: {}

istio:
  inject: true
  authorizationPolicy:
    enabled: true
    principals:
      - cluster.local/ns/istio-system/sa/istio-ingressgateway
      # PostSync smoke Job of the cell (deploy/platform/smoke)
      - cluster.local/ns/payments/sa/smoke
