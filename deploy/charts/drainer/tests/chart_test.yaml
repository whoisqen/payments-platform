suite: drainer
templates:
  - workload.yaml
  - autoscaling.yaml
  - pdb.yaml
set:
  global.registry: registry.example.test/acme
  global.environment: dev
  global.region: eu-central-1
  global.cell: cell-0
  image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
tests:
  - it: rolls with maxSurge 25 percent and no unavailable pod
    documentIndex: 0
    template: workload.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 25%
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.template.spec.nodeSelector["karpenter.sh/nodepool"]
          value: workers
  - it: scales on the Redis stream between 3 and 6
    documentIndex: 1
    template: autoscaling.yaml
    asserts:
      - isKind:
          of: ScaledObject
      - equal:
          path: spec.triggers[0].type
          value: redis-cluster-streams
      - equal:
          path: spec.maxReplicaCount
          value: 6
  - it: has a PodDisruptionBudget
    documentIndex: 0
    template: pdb.yaml
    asserts:
      - isKind:
          of: PodDisruptionBudget
  - it: rejects a missing digest
    template: workload.yaml
    set:
      image.digest: null
    asserts:
      - failedTemplate: {}
  - it: scales on the length of every shard stream, which XREAD reads without a consumer group
    template: autoscaling.yaml
    documentIndex: 1
    set:
      global.hyperswitch.drainer.numPartitions: 4
    asserts:
      - lengthEqual:
          path: spec.triggers
          count: 4
      - equal:
          path: spec.triggers[3].metadata.stream
          value: "{shard_3}_DRAINER_STREAM"
      - notExists:
          path: spec.triggers[0].metadata.consumerGroup
      - equal:
          path: spec.triggers[0].metadata.streamLength
          value: "1000"
      - equal:
          path: spec.triggers[0].metadata.usernameFromEnv
          value: DRAINER__REDIS__USERNAME
      - equal:
          path: spec.triggers[0].authenticationRef.name
          value: drainer-redis
  - it: reads the MemoryDB password from the Vault Secret through a TriggerAuthentication
    template: autoscaling.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: TriggerAuthentication
      - equal:
          path: spec.secretTargetRef[0]
          value: {parameter: password, name: drainer-vault, key: DRAINER__REDIS__PRIMARY_PASSWORD}
