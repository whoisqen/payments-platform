# image.digest is supplied by deploy/envs/<env>/images.yaml (CI only)
image:
  repository: drainer
  pullPolicy: IfNotPresent

# The old pod finishes its current batch, so a rolling update never drops below the current pods
workload:
  kind: Deployment
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    maxSurge: 25%
    maxUnavailable: 0

# Cell-wide settings (database, MemoryDB, KMS, tenant, stream name) come from global.hyperswitch through platform-common
hyperswitch:
  prefix: DRAINER
  redisUser: drainer
  # bb8 pool of 4 per pod (section 5)
  poolSize: 4
  # Defaults of the drainer only; the router file would bring connector settings the drainer never reads
  configFile: drainer.toml

# Variable -> {key, property} under <kvMount>/<env>/<cell>/ in Vault; the values never appear in git
secrets:
  DRAINER__MASTER_DATABASE__PASSWORD: {key: drainer/database, property: password}
  DRAINER__REDIS__PRIMARY_PASSWORD: {key: drainer/redis, property: password}

container:
  port: 8080
  env:
    RUN_ENV: production
    DRAINER__SERVER__HOST: 0.0.0.0
    DRAINER__SERVER__PORT: "8080"
    DRAINER__SERVER__WORKERS: "1"
    # 100 entries per read every 500 ms; the stream name and partition count are cell-wide (global.hyperswitch.drainer)
    DRAINER__DRAINER__MAX_READ_COUNT: "100"
    DRAINER__DRAINER__LOOP_INTERVAL: "500"
    DRAINER__DRAINER__SHUTDOWN_INTERVAL: "1000"
    # Traces and metrics go to the collector of the same node; it masks, samples and forwards them to the central stack
    DRAINER__LOG__TELEMETRY__TRACES_ENABLED: "true"
    DRAINER__LOG__TELEMETRY__METRICS_ENABLED: "true"
    DRAINER__LOG__TELEMETRY__OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4317
    # Read by the KEDA trigger below, which runs outside the pod
    REDIS_ADDRESS: memorydb.invalid:6379
  # Error tracking: the DSN comes from an ExternalSecret when remoteKey is set (<prefix>/<env>/sentry/<service>-dsn in the environment layer)
  sentryDsn:
    envName: DRAINER__LOG__SENTRY__DSN
    remoteKey: ""
  envFromSecrets: []
  # 1500 rows/s per pod (section 8); batches are small, so memory stays low
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 512Mi

probes:
  startup:
    path: /health
    periodSeconds: 5
    failureThreshold: 36
  liveness:
    path: /health
    periodSeconds: 10
  readiness:
    path: /health/ready
    periodSeconds: 5
    timeoutSeconds: 3

# Finishing a batch needs more than the router drain, so the grace period is the full 60 s
lifecycle:
  preStopSeconds: 15
  terminationGracePeriodSeconds: 60

scheduling:
  nodePool: workers

service:
  enabled: true
  port: 8080

autoscaling:
  enabled: true
  kind: keda
  minReplicas: 3
  maxReplicas: 6
  triggers:
    # The region file lists one trigger per shard stream; the first one is the default
    - type: redis-streams
      metadata:
        addressFromEnv: REDIS_ADDRESS
        passwordFromEnv: REDIS_PASSWORD
        enableTLS: "true"
        stream: "{shard_0}_drainer_stream"
        consumerGroup: drainer_group
        pendingEntriesCount: "10000"

pdb:
  enabled: true
  maxUnavailable: 10%

networkPolicy:
  enabled: true
  dataPorts: [5432, 6379]
  extraEgress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - {protocol: TCP, port: 4317}

serviceMonitor:
  enabled: true
  path: /metrics

serviceAccount:
  create: true

istio:
  inject: true
  authorizationPolicy:
    enabled: false
