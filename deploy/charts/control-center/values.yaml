# image.digest is supplied by deploy/envs/<env>/images.yaml (CI only)
image:
  repository: control-center
  pullPolicy: IfNotPresent

workload:
  kind: Deployment
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    maxSurge: 25%
    maxUnavailable: 0

container:
  port: 9000
  # Overrides of the upstream dashboard config.toml; the browser calls the router API directly and logs in with the router user JWT, so the panel holds no secret
  env:
    default__endpoints__api_url: https://api.invalid
    default__endpoints__sdk_url: ""
    default__features__email: "false"
    default__features__totp: "true"
    default__features__is_live_mode: "false"
    default__features__test_live_toggle: "false"
  envFromSecrets: []
  # Not sized in the architecture; the panel is a thin web server in front of the router API
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 256Mi

probes:
  startup:
    path: /
    periodSeconds: 5
    failureThreshold: 36
  liveness:
    path: /
    periodSeconds: 10
  readiness:
    path: /
    periodSeconds: 5

lifecycle:
  preStopSeconds: 15
  terminationGracePeriodSeconds: 60

scheduling:
  nodePool: workers

service:
  enabled: true
  port: 9000

autoscaling:
  enabled: true
  kind: hpa
  minReplicas: 3
  maxReplicas: 6
  targetCPU: 70

pdb:
  enabled: true
  maxUnavailable: 10%

networkPolicy:
  enabled: true
  dataPorts: []

serviceMonitor:
  enabled: false

serviceAccount:
  create: true

istio:
  inject: true

# Entry of the panel: CloudFront VPC origin (Terraform) -> internal NLB of the Gateway panel -> HTTPRoute panel -> this Service
panel:
  enabled: true
  hostname: panel.invalid
  gatewayClassName: istio
  certificate:
    # Public ACME issuer with DNS-01, so CloudFront can verify the origin certificate
    issuerKind: ClusterIssuer
    issuerName: acme-dns01
