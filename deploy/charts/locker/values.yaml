# image.digest is supplied by deploy/envs/<env>/images.yaml (CI only)
image:
  repository: locker
  pullPolicy: IfNotPresent

workload:
  kind: Rollout
  minReadySeconds: 10
  progressDeadlineSeconds: 900
  strategy:
    type: Canary
    # 1 -> 10 -> 50 -> 100 of the requests from router (section 4)
    weights: [1, 10, 50]
    pauseDuration: 10m
  analysis:
    prometheusAddress: http://prometheus-operated.monitoring.svc:9090
    maxErrorRate: 0.0005
    maxP99DeltaMs: 150
    authorizationRate: false

container:
  port: 3001
  # LOCKER__* keys are rendered from config and tenants; the schema rejects them here
  env:
    RUN_ENV: production
  envFromSecrets: []
  # card-vault serves /metrics on its own listener (config.metrics); the NetworkPolicy admits only monitoring to it
  extraPorts:
    - name: metrics
      port: 9091
  # 300 RPS per pod (section 8); no sizing is given, so 1 vCPU and 1 GiB is a starting point for the load test
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 1Gi

probes:
  startup:
    path: /health
    periodSeconds: 5
    failureThreshold: 36
  liveness:
    path: /health
    periodSeconds: 10
  readiness:
    path: /health
    periodSeconds: 5

lifecycle:
  preStopSeconds: 15
  terminationGracePeriodSeconds: 60

# On-Demand only: an interrupted pod mid-call leaves the payment in the unknown state
scheduling:
  nodePool: payments
  tolerations: []

service:
  enabled: true
  port: 3001
  extraPorts:
    - name: metrics
      port: 9091

autoscaling:
  enabled: true
  kind: hpa
  minReplicas: 5
  maxReplicas: 24
  targetCPU: 70

pdb:
  enabled: true
  maxUnavailable: 10%

networkPolicy:
  enabled: true
  dataPorts: [5432]
  # Rendered rules add 443 to global.endpointCidrs (KMS, STS), 80 to the Pod Identity agent and 9091 from monitoring
  # Only router may call the locker
  extraIngress: []
  extraEgress: []

serviceMonitor:
  enabled: true
  port: metrics
  path: /metrics

serviceAccount:
  create: true

istio:
  inject: true
  authorizationPolicy:
    enabled: true
    principals:
      - cluster.local/ns/payments/sa/router

# Per-cluster locker_pod security group (Terraform output locker_pod_security_group_id), attached to the pod ENI
securityGroupPolicy:
  # false only with global.localCluster: kind has no VPC CNI
  enabled: true
  securityGroupIds:
    - REPLACE_LOCKER_POD_SG_ID

# Non-secret card-vault settings, rendered as LOCKER__<SECTION>__<KEY> env; server.port follows container.port
config:
  log:
    console:
      enabled: true
      level: INFO
      log_format: json
  server:
    host: 0.0.0.0
  # Rate limit of the delete API
  limit:
    request_count: 1
    duration: 60
  cache:
    tti: 7200
    max_capacity: 5000
  # RDS Proxy endpoint of the locker Aurora; the password comes from the ExternalSecret
  database:
    username: locker_app
    host: REPLACE_LOCKER_DB_PROXY_HOST
    port: 5432
    dbname: locker
    pool_size: 10
    min_idle: 2
    max_lifetime: 120
    idle_timeout: 300
    connection_timeout: 10
  # Every secret value is KMS ciphertext under the locker key; only the locker role may call kms:Decrypt
  secrets_management:
    secrets_manager: aws_kms
    aws_kms:
      key_id: REPLACE_LOCKER_KMS_KEY_ALIAS
      region: REPLACE_AWS_REGION
  # Separate HTTP listener for /metrics; the port follows container.extraPorts "metrics"
  metrics:
    mode: prometheus
    host: 0.0.0.0
    background_metrics_collection_interval_secs: 15
  api_client:
    client_idle_timeout: 90
    pool_max_idle_per_host: 10
  # An HTTP key-manager service; none is deployed, the master keys stay KMS-wrapped in config
  external_key_manager:
    mode: disabled

# EKS Pod Identity agent, the credential source of the AWS SDK for the KMS calls at start
podIdentityAgentCidr: 169.254.170.23/32

# PostgreSQL TLS through libpq environment; the RDS Proxy certificate chains to Amazon Root CA in the system bundle
postgresTls:
  mode: verify-full
  rootCert: /etc/ssl/certs/ca-certificates.crt

# Tenants of the router (x-tenant-id); master and public keys come from Vault per tenant
tenants:
  - id: public
    schema: public
    redisKeyPrefix: public

# Secrets only from the Vault store, KV v2 key <environment>/<pathPrefix>/<path> under the store mount
externalSecret:
  name: locker-secrets
  storeName: vault
  pathPrefix: locker
  refreshInterval: 1h
