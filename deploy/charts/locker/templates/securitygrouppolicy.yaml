{{- $cfg := .Values.securityGroupPolicy -}}
{{- if ne $cfg.enabled false }}
{{- $ctx := dict "root" . "cfg" .Values "name" "locker" "component" "locker" -}}
apiVersion: vpcresources.k8s.aws/v1beta1
kind: SecurityGroupPolicy
metadata:
  name: locker
  labels:
    {{- include "platform-common.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform-common.selectorLabels" $ctx | nindent 6 }}
  securityGroups:
    groupIds:
      {{- toYaml $cfg.securityGroupIds | nindent 6 }}
{{- else }}
{{- include "platform-common.requireLocal" (dict "root" . "what" "securityGroupPolicy.enabled false") }}
{{- end }}
