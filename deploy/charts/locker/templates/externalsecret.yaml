{{- $ctx := dict "root" . "cfg" .Values "name" "locker" "component" "locker" -}}
{{- $es := .Values.externalSecret -}}
{{- $mode := .Values.config.external_key_manager.mode -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "locker.secretName" . }}
  labels:
    {{- include "platform-common.labels" $ctx | nindent 4 }}
  annotations:
    # The Secret must exist before the Rollout creates pods that read it through envFrom
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.storeName }}
  target:
    name: {{ include "locker.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  # Every value is AWS KMS ciphertext (base64) that the locker decrypts at start with the key of config.secrets_management
  data:
    - secretKey: LOCKER__DATABASE__PASSWORD
      remoteRef:
        key: {{ include "locker.vaultKey" (dict "root" . "path" "database") }}
        property: password
    - secretKey: LOCKER__SECRETS__LOCKER_PRIVATE_KEY
      remoteRef:
        key: {{ include "locker.vaultKey" (dict "root" . "path" "jwe") }}
        property: locker-private-key
    {{- range .Values.tenants }}
    - secretKey: LOCKER__TENANT_SECRETS__{{ upper .id }}__MASTER_KEY
      remoteRef:
        key: {{ include "locker.vaultKey" (dict "root" $ "path" (printf "tenants/%s" .id)) }}
        property: master-key
    - secretKey: LOCKER__TENANT_SECRETS__{{ upper .id }}__PUBLIC_KEY
      remoteRef:
        key: {{ include "locker.vaultKey" (dict "root" $ "path" (printf "tenants/%s" .id)) }}
        property: public-key
    {{- end }}
    {{- if eq $mode "enabled_with_mtls" }}
    - secretKey: LOCKER__EXTERNAL_KEY_MANAGER__CA_CERT
      remoteRef:
        key: {{ include "locker.vaultKey" (dict "root" . "path" "external-key-manager") }}
        property: ca-cert
    - secretKey: LOCKER__API_CLIENT__IDENTITY
      remoteRef:
        key: {{ include "locker.vaultKey" (dict "root" . "path" "external-key-manager") }}
        property: client-identity
    {{- end }}
