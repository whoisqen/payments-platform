suite: payments-locker
templates:
  - charts/locker/templates/workload.yaml
  - charts/locker/templates/externalsecret.yaml
  - charts/locker-migrations/templates/job.yaml
set:
  global.registry: registry.example.test/acme
  global.environment: dev
  global.region: eu-central-1
  global.accountId: "111111111111"
  global.dataCidrs: ["10.120.0.0/16"]
  global.endpointCidrs: ["10.120.255.0/24"]
  locker.image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  locker-migrations.image.digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
tests:
  - it: renders the locker canary
    template: charts/locker/templates/workload.yaml
    asserts:
      - isKind:
          of: Rollout
  - it: runs its own migrations Job before the locker
    template: charts/locker-migrations/templates/job.yaml
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "@sha256:b{64}$"
  - it: takes the locker secrets from Vault under the environment of the layer
    template: charts/locker/templates/externalsecret.yaml
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: vault
      - equal:
          path: spec.data[0].remoteRef.key
          value: dev/locker/database
  - it: points the locker at the KMS alias of the environment layer
    template: charts/locker/templates/workload.yaml
    values:
      - ../../../envs/dev/eu-central-1/locker/values.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOCKER__SECRETS_MANAGEMENT__AWS_KMS__KEY_ID
            value: alias/pay-dev-euc1-locker
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOCKER__DATABASE__HOST
            value: pay-dev-euc1-aurora-locker.proxy-example.eu-central-1.rds.amazonaws.com
  - it: snapshots the locker database before its migrations
    template: charts/locker-migrations/templates/job.yaml
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: {name: SNAPSHOT_RESOURCE_ARN, value: "arn:aws:rds:eu-central-1:111111111111:cluster:pay-dev-euc1-aurora-locker"}
