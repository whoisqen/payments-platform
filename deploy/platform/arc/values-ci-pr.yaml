# ci-pr: all jobs of pull request code; untrusted, no roles, own nodes
# Created by the ExternalSecret in config/, never inline
githubConfigSecret: github-app
runnerScaleSetName: ci-pr
# Idle runners kept warm so a job starts without waiting for a node; the rest scale with the queue
minRunners: 1
maxRunners: 20
template:
  spec:
    serviceAccountName: ci-pr
    automountServiceAccountToken: false
    nodeSelector:
      karpenter.sh/nodepool: ci-pr
    tolerations:
      - {key: workload, operator: Equal, value: ci-pr, effect: NoSchedule}
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 123
      fsGroup: 123
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        # REPLACE_DIGEST: pin by digest before sync
        image: ghcr.io/actions/actions-runner@sha256:REPLACE_DIGEST_RUNNER
        command: ["/home/runner/run.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: "3"
            memory: 12Gi
            ephemeral-storage: 30Gi
          limits:
            memory: 12Gi
            ephemeral-storage: 60Gi
