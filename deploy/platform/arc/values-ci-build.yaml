# ci-build: cargo and image builds of trusted code on arm64 with local NVMe
# Created by the ExternalSecret in config/, never inline
githubConfigSecret: github-app
runnerScaleSetName: ci-build
# Idle runners kept warm so a job starts without waiting for a node; the rest scale with the queue
minRunners: 1
maxRunners: 8
containerMode:
  type: dind
template:
  spec:
    serviceAccountName: ci-build
    automountServiceAccountToken: false
    nodeSelector:
      karpenter.sh/nodepool: ci-build
    tolerations:
      - {key: workload, operator: Equal, value: ci-build, effect: NoSchedule}
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 123
      fsGroup: 123
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        # REPLACE_DIGEST: pin by digest before sync
        image: ghcr.io/actions/actions-runner@sha256:REPLACE_DIGEST_RUNNER
        command: ["/home/runner/run.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: "14"
            memory: 26Gi
            ephemeral-storage: 200Gi
          limits:
            memory: 26Gi
            ephemeral-storage: 400Gi
