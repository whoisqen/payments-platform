# ci-build-amd64: amd64 image build of trusted code on x86 with local NVMe
# Created by the ExternalSecret in config/, never inline
githubConfigSecret: github-app
runnerScaleSetName: ci-build-amd64
# Idle runners kept warm so a job starts without waiting for a node; the rest scale with the queue
minRunners: 0
maxRunners: 2
containerMode:
  type: dind
template:
  spec:
    serviceAccountName: ci-build-amd64
    automountServiceAccountToken: false
    nodeSelector:
      karpenter.sh/nodepool: ci-build-amd64
    tolerations:
      - {key: workload, operator: Equal, value: ci-build-amd64, effect: NoSchedule}
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 123
      fsGroup: 123
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        # REPLACE_DIGEST: pin by digest before sync
        image: ghcr.io/actions/actions-runner@sha256:REPLACE_DIGEST_RUNNER
        command: ["/home/runner/run.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: "7"
            memory: 13Gi
            ephemeral-storage: 100Gi
          limits:
            memory: 13Gi
            ephemeral-storage: 200Gi
