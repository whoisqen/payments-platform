apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-arc-controller
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/ci-runners: enabled
  template:
    metadata:
      name: 'arc-controller-{{ .name }}'
      labels:
        payments-platform/addon: arc
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform
      destination:
        server: '{{ .server }}'
        namespace: arc-systems
      sources:
        # Upstream chart version is pinned here and bumped by Renovate
        - repoURL: ghcr.io/actions/actions-runner-controller-charts
          chart: gha-runner-scale-set-controller
          targetRevision: 0.13.0
          helm:
            valueFiles:
              - $values/deploy/platform/arc/values-controller.yaml
        - repoURL: https://github.com/whoisqen/payments-platform
          targetRevision: main
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-arc-config
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/ci-runners: enabled
  template:
    metadata:
      name: 'arc-config-{{ .name }}'
      labels:
        payments-platform/addon: arc
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      project: platform
      destination:
        server: '{{ .server }}'
        namespace: arc-systems
      source:
        repoURL: https://github.com/whoisqen/payments-platform
        targetRevision: main
        path: deploy/platform/arc/config
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-arc-scale-sets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  payments-platform/ci-runners: enabled
          - list:
              elements:
                - scaleSet: ci-prod
                - scaleSet: ci-stage
                - scaleSet: ci-pr
  template:
    metadata:
      name: 'arc-{{ .scaleSet }}-{{ .name }}'
      labels:
        payments-platform/addon: arc
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: platform
      destination:
        server: '{{ .server }}'
        namespace: 'arc-{{ .scaleSet }}'
      sources:
        - repoURL: ghcr.io/actions/actions-runner-controller-charts
          chart: gha-runner-scale-set
          targetRevision: 0.13.0
          helm:
            releaseName: '{{ .scaleSet }}'
            valueFiles:
              - $values/deploy/platform/arc/values-{{ .scaleSet }}.yaml
        - repoURL: https://github.com/whoisqen/payments-platform
          targetRevision: main
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
