{{- range $name, $set := .Values.scaleSets }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-{{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: restricted
    app.kubernetes.io/part-of: ci-runners
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: arc-{{ $name }}
  {{- if $set.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $set.roleArn | quote }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $set.priorityClass.name }}
value: {{ $set.priorityClass.value }}
preemptionPolicy: {{ $set.priorityClass.preemptionPolicy }}
globalDefault: false
description: Runner pods of the {{ $name }} scale set
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
  namespace: arc-{{ $name }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.secretStore.name }}
  target:
    name: github-app
  dataFrom:
    - extract:
        key: {{ $set.githubAppKey }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: runners
  namespace: arc-{{ $name }}
spec:
  hard:
    pods: {{ $set.quota.pods | quote }}
    requests.cpu: {{ $set.quota.cpu | quote }}
    requests.memory: {{ $set.quota.memory }}
    requests.ephemeral-storage: {{ $set.quota.ephemeralStorage }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-isolation
  namespace: arc-{{ $name }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- $denied := concat $.Values.networkPolicy.cdeCidrs $.Values.networkPolicy.cellCidrs }}
              {{- if eq $name "ci-pr" }}{{ $denied = concat $denied $.Values.networkPolicy.prDeniedCidrs }}{{ end }}
              {{- range $denied }}
              - {{ . }}
              {{- end }}
      ports:
        - {protocol: TCP, port: 443}
    {{- if eq $name "ci-pr" }}
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              {{- range $.Values.networkPolicy.prDeniedCidrsV6 }}
              - {{ . }}
              {{- end }}
      ports:
        - {protocol: TCP, port: 443}
    {{- end }}
{{- end }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: controller
  namespace: arc-systems
spec:
  hard:
    pods: {{ .Values.systemsQuotaPods | quote }}
