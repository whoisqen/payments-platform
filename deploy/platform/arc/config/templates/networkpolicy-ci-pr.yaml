apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ci-pr-isolation
  namespace: arc-ci-pr
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  # Allow-list only: no namespace of a cell or the CDE is selected and private ranges are excluded
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicy.deniedCidrs }}
              - {{ . }}
              {{- end }}
      ports:
        - {protocol: TCP, port: 443}
