suite: arc-config
templates:
  - templates/runner-sets.yaml
# Documents per scale set in key order (ci-pr, ci-prod, ci-stage): Namespace, ServiceAccount, PriorityClass, ExternalSecret, ResourceQuota, NetworkPolicy; then the arc-systems quota
tests:
  - it: ci-prod priority class
    asserts:
      - equal: {path: metadata.name, value: ci-prod}
        documentIndex: 8
      - equal: {path: preemptionPolicy, value: PreemptLowerPriority}
        documentIndex: 8
      - equal: {path: value, value: 1000}
        documentIndex: 14
      - equal: {path: preemptionPolicy, value: Never}
        documentIndex: 14
      - equal: {path: value, value: 500}
        documentIndex: 2
      - equal: {path: preemptionPolicy, value: Never}
        documentIndex: 2
  - it: ci-prod and ci-stage use distinct roles, ci-pr has none
    asserts:
      - notExists: {path: metadata.annotations}
        documentIndex: 1
      - matchRegex: {path: 'metadata.annotations["eks.amazonaws.com/role-arn"]', pattern: CI_PROD_ROLE}
        documentIndex: 7
      - matchRegex: {path: 'metadata.annotations["eks.amazonaws.com/role-arn"]', pattern: CI_STAGE_ROLE}
        documentIndex: 13
  - it: each scale set reads its own GitHub App key through external-secrets.io/v1
    asserts:
      - equal: {path: apiVersion, value: external-secrets.io/v1}
        documentIndex: 3
      - equal: {path: spec.secretStoreRef.kind, value: ClusterSecretStore}
        documentIndex: 3
      - matchRegex: {path: 'spec.dataFrom[0].extract.key', pattern: 'CI_PR$'}
        documentIndex: 3
      - matchRegex: {path: 'spec.dataFrom[0].extract.key', pattern: 'CI_PROD$'}
        documentIndex: 9
      - matchRegex: {path: 'spec.dataFrom[0].extract.key', pattern: 'CI_STAGE$'}
        documentIndex: 15
  - it: every scale set namespace has a default-deny policy with DNS and 443 only
    asserts:
      - equal: {path: spec.policyTypes, value: [Ingress, Egress]}
        documentIndex: 11
      - equal: {path: spec.ingress, value: []}
        documentIndex: 11
      - lengthEqual: {path: spec.egress, count: 2}
        documentIndex: 11
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels.k8s-app
          value: kube-dns
        documentIndex: 11
      - equal: {path: metadata.name, value: ci-prod-isolation}
        documentIndex: 11
      - contains: {path: 'spec.egress[1].to[0].ipBlock.except', content: REPLACE_CDE_VPC_CIDR}
        documentIndex: 11
      - contains: {path: 'spec.egress[1].to[0].ipBlock.except', content: REPLACE_CELL_VPC_CIDR}
        documentIndex: 17
      - notContains: {path: 'spec.egress[1].to[0].ipBlock.except', content: 10.0.0.0/8}
        documentIndex: 17
      - equal: {path: metadata.namespace, value: arc-ci-stage}
        documentIndex: 17
  - it: ci-pr also denies private, CGNAT and IPv6 local ranges
    asserts:
      - lengthEqual: {path: spec.egress, count: 3}
        documentIndex: 5
      - contains: {path: 'spec.egress[1].to[0].ipBlock.except', content: 100.64.0.0/10}
        documentIndex: 5
      - contains: {path: 'spec.egress[1].to[0].ipBlock.except', content: 10.0.0.0/8}
        documentIndex: 5
      - contains: {path: 'spec.egress[2].to[0].ipBlock.except', content: fd00::/8}
        documentIndex: 5
      - contains: {path: 'spec.egress[2].to[0].ipBlock.except', content: fe80::/10}
        documentIndex: 5
  - it: every scale set namespace has a quota, and arc-systems a pod cap
    asserts:
      - exists: {path: 'spec.hard["requests.ephemeral-storage"]'}
        documentIndex: 4
      - exists: {path: 'spec.hard["requests.ephemeral-storage"]'}
        documentIndex: 16
      - equal: {path: metadata.namespace, value: arc-systems}
        documentIndex: 18
  - it: schema rejects a role on ci-pr
    set:
      scaleSets:
        ci-pr:
          roleArn: arn:aws:iam::1:role/x
    asserts:
      - failedTemplate: {}
  - it: schema rejects a scale set without its own key
    set:
      scaleSets:
        ci-pr:
          githubAppKey: null
    asserts:
      - failedTemplate: {}
