suite: arc-config
templates:
  - templates/runner-sets.yaml
  - templates/networkpolicy-ci-pr.yaml
# Documents render per scale set in key order (ci-pr, ci-prod, ci-stage): Namespace, ServiceAccount, PriorityClass, ExternalSecret
tests:
  - it: ci-prod preempts lower priorities
    template: templates/runner-sets.yaml
    asserts:
      - equal: {path: metadata.name, value: ci-prod}
        documentIndex: 6
      - equal: {path: value, value: 100000}
        documentIndex: 6
      - equal: {path: preemptionPolicy, value: PreemptLowerPriority}
        documentIndex: 6
  - it: ci-stage and ci-pr rank lower and never preempt
    template: templates/runner-sets.yaml
    asserts:
      - equal: {path: value, value: 1000}
        documentIndex: 10
      - equal: {path: preemptionPolicy, value: Never}
        documentIndex: 10
      - equal: {path: value, value: 500}
        documentIndex: 2
      - equal: {path: preemptionPolicy, value: Never}
        documentIndex: 2
  - it: ci-prod and ci-stage use separate service accounts with distinct roles
    template: templates/runner-sets.yaml
    asserts:
      - equal: {path: metadata.name, value: ci-prod}
        documentIndex: 5
      - matchRegex: {path: 'metadata.annotations["eks.amazonaws.com/role-arn"]', pattern: CI_PROD_ROLE}
        documentIndex: 5
      - equal: {path: metadata.name, value: ci-stage}
        documentIndex: 9
      - matchRegex: {path: 'metadata.annotations["eks.amazonaws.com/role-arn"]', pattern: CI_STAGE_ROLE}
        documentIndex: 9
  - it: ci-pr service account has no cloud role annotation
    template: templates/runner-sets.yaml
    asserts:
      - equal: {path: metadata.name, value: ci-pr}
        documentIndex: 1
      - notExists: {path: metadata.annotations}
        documentIndex: 1
  - it: credentials come from an ExternalSecret reference
    template: templates/runner-sets.yaml
    asserts:
      - isKind: {of: ExternalSecret}
        documentIndex: 3
      - equal: {path: spec.secretStoreRef.kind, value: ClusterSecretStore}
        documentIndex: 3
  - it: ci-pr is default-deny and selects only DNS and public 443
    template: templates/networkpolicy-ci-pr.yaml
    asserts:
      - equal: {path: spec.policyTypes, value: [Ingress, Egress]}
      - equal: {path: spec.ingress, value: []}
      - lengthEqual: {path: spec.egress, count: 2}
      - contains:
          path: spec.egress[1].to[0].ipBlock.except
          content: 10.0.0.0/8
      - equal:
          path: 'spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]'
          value: kube-system
  - it: schema rejects a role on ci-pr
    template: templates/runner-sets.yaml
    set:
      scaleSets:
        ci-pr:
          roleArn: arn:aws:iam::1:role/x
    asserts:
      - failedTemplate: {}
