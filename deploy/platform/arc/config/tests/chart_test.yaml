suite: arc-config
templates:
  - templates/runner-sets.yaml
tests:
  - it: renders no PriorityClass, so no scale set outranks another
    asserts:
      - hasDocuments: {count: 25}
      - containsDocument: {kind: Namespace, apiVersion: v1, name: arc-ci-build}
        documentSelector: {path: metadata.name, value: arc-ci-build}
      - containsDocument: {kind: PriorityClass, apiVersion: scheduling.k8s.io/v1}
        not: true
  - it: trusted scale sets get distinct roles and the untrusted one has none
    asserts:
      - matchRegex: {path: 'metadata.annotations["eks.amazonaws.com/role-arn"]', pattern: CI_BUILD_ROLE}
        documentSelector: {path: metadata.name, value: ci-build}
        documentIndex: 1
      - matchRegex: {path: 'metadata.annotations["eks.amazonaws.com/role-arn"]', pattern: CI_LIGHT_ROLE}
        documentSelector: {path: metadata.name, value: ci-light}
        documentIndex: 7
      - notExists: {path: metadata.annotations}
        documentSelector: {path: metadata.name, value: ci-pr}
        documentIndex: 13
  - it: only the build namespace allows the privileged dind sidecar
    asserts:
      - equal: {path: 'metadata.labels["pod-security.kubernetes.io/enforce"]', value: privileged}
        documentSelector: {path: metadata.name, value: arc-ci-build}
      - equal: {path: 'metadata.labels["pod-security.kubernetes.io/enforce"]', value: restricted}
        documentSelector: {path: metadata.name, value: arc-ci-test}
      - equal: {path: 'metadata.labels["pod-security.kubernetes.io/enforce"]', value: restricted}
        documentSelector: {path: metadata.name, value: arc-ci-pr}
  - it: each scale set reads its own GitHub App key through external-secrets.io/v1
    asserts:
      - equal: {path: apiVersion, value: external-secrets.io/v1}
        documentIndex: 2
      - equal: {path: spec.secretStoreRef.kind, value: ClusterSecretStore}
        documentIndex: 2
      - matchRegex: {path: 'spec.dataFrom[0].extract.key', pattern: 'CI_BUILD$'}
        documentIndex: 2
      - matchRegex: {path: 'spec.dataFrom[0].extract.key', pattern: 'CI_PR$'}
        documentIndex: 14
      - matchRegex: {path: 'spec.dataFrom[0].extract.key', pattern: 'CI_TEST$'}
        documentIndex: 20
  - it: every scale set namespace has a default-deny policy with DNS and 443 only
    documentSelector: {path: metadata.name, value: ci-test-isolation}
    asserts:
      - equal: {path: spec.policyTypes, value: [Ingress, Egress]}
      - equal: {path: spec.ingress, value: []}
      - lengthEqual: {path: spec.egress, count: 2}
      - equal: {path: 'spec.egress[0].to[0].podSelector.matchLabels.k8s-app', value: kube-dns}
      - contains: {path: 'spec.egress[1].to[0].ipBlock.except', content: REPLACE_CDE_VPC_CIDR}
      - contains: {path: 'spec.egress[1].to[0].ipBlock.except', content: REPLACE_CELL_VPC_CIDR}
      - notContains: {path: 'spec.egress[1].to[0].ipBlock.except', content: 10.0.0.0/8}
  - it: the untrusted scale set also denies private, CGNAT and IPv6 local ranges
    documentSelector: {path: metadata.name, value: ci-pr-isolation}
    asserts:
      - lengthEqual: {path: spec.egress, count: 3}
      - contains: {path: 'spec.egress[1].to[0].ipBlock.except', content: 100.64.0.0/10}
      - contains: {path: 'spec.egress[1].to[0].ipBlock.except', content: 10.0.0.0/8}
      - contains: {path: 'spec.egress[2].to[0].ipBlock.except', content: 'fd00::/8'}
      - contains: {path: 'spec.egress[2].to[0].ipBlock.except', content: 'fe80::/10'}
  - it: every scale set namespace has a quota and a limit range, and arc-systems a pod cap
    asserts:
      - exists: {path: 'spec.hard["requests.ephemeral-storage"]'}
        documentIndex: 3
      - equal: {path: 'spec.limits[0].defaultRequest.cpu', value: 100m}
        documentIndex: 4
      - equal: {path: metadata.namespace, value: arc-systems}
        documentIndex: 24
  - it: schema rejects a role on the untrusted scale set
    set:
      scaleSets:
        ci-pr:
          roleArn: arn:aws:iam::1:role/x
    asserts:
      - failedTemplate: {}
  - it: schema rejects a trusted scale set without a role
    set:
      scaleSets:
        ci-test:
          roleArn: null
    asserts:
      - failedTemplate: {}
  - it: schema rejects a scale set without its own key
    set:
      scaleSets:
        ci-pr:
          githubAppKey: null
    asserts:
      - failedTemplate: {}
