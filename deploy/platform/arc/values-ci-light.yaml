# ci-light: lint, commit checks, plan and promotion jobs of trusted code
# Created by the ExternalSecret in config/, never inline
githubConfigSecret: github-app
runnerScaleSetName: ci-light
# Idle runners kept warm so a job starts without waiting for a node; the rest scale with the queue
minRunners: 1
maxRunners: 20
template:
  spec:
    serviceAccountName: ci-light
    automountServiceAccountToken: false
    nodeSelector:
      karpenter.sh/nodepool: ci-light
    tolerations:
      - {key: workload, operator: Equal, value: ci-light, effect: NoSchedule}
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 123
      fsGroup: 123
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        # REPLACE_DIGEST: pin by digest before sync
        image: ghcr.io/actions/actions-runner@sha256:REPLACE_DIGEST_RUNNER
        command: ["/home/runner/run.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: "1500m"
            memory: 5Gi
            ephemeral-storage: 10Gi
          limits:
            memory: 5Gi
            ephemeral-storage: 20Gi
