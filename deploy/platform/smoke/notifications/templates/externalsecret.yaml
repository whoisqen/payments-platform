apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.secret.name }}
    app.kubernetes.io/part-of: argocd
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secret.secretStore }}
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
  data:
    {{- range list "github-dispatch-url" "github-dispatch-token" "alertmanager-url" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.secret.remoteKey }}
        property: {{ . }}
    {{- end }}
