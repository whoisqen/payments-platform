url: $github-dispatch-url
headers:
  - name: Authorization
    value: Bearer $github-dispatch-token
  - name: Accept
    value: application/vnd.github+json
  - name: X-GitHub-Api-Version
    value: "2022-11-28"
  - name: User-Agent
    value: argocd-notifications
  - name: Content-Type
    value: application/json
