{{- if include "smoke.enabled" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.secretName }}
  labels:
    {{- include "smoke.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.credentials.secretStore }}
  target:
    name: {{ .Values.credentials.secretName }}
    creationPolicy: Owner
  data:
    {{- range .Values.credentials.properties }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf $.Values.credentials.remoteKeyPattern (required "global.namePrefix is required" $.Values.global.namePrefix) (required "global.environment is required" $.Values.global.environment) }}
        property: {{ . }}
    {{- end }}
{{- end }}
