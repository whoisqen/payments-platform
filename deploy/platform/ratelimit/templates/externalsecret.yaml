{{- $s := .Values.redis.secret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  labels:
    {{- include "platform-common.labels" (dict "root" . "cfg" .Values "name" "ratelimit" "component" "ratelimit") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $s.store }}
  target:
    name: {{ $s.name }}
    creationPolicy: Owner
  data:
    # JSON key auth holds the Redis password, or user:password when an ACL user is used
    - secretKey: auth
      remoteRef:
        key: {{ required "global.namePrefix is required" .Values.global.namePrefix }}/{{ required "global.environment is required" .Values.global.environment }}/ratelimit/redis
        property: {{ $s.property }}
