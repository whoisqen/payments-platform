{{- include "ratelimit.guard" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ratelimit-config
  labels:
    {{- include "platform-common.labels" (dict "root" . "cfg" .Values "name" "ratelimit" "component" "ratelimit") | nindent 4 }}
data:
  {{ .Values.rateLimit.domain }}.yaml: |
    {{- include "ratelimit.config" . | nindent 4 }}
