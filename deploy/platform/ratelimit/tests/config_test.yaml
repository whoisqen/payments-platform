suite: ratelimit limit config
templates:
  - configmap.yaml
set:
  global.registry: registry.example.test/acme
  global.environment: dev
tests:
  - it: renders a limit for every request class under the wildcard merchant
    asserts:
      - matchRegex:
          path: data["payments-edge.yaml"]
          pattern: "domain: payments-edge"
      - matchRegex:
          path: data["payments-edge.yaml"]
          pattern: "(?s)- descriptors:.*value: payments.*value: read.*value: list.*key: merchant"
      - matchRegex:
          path: data["payments-edge.yaml"]
          pattern: "requests_per_unit: 100\\n\\s+unit: second\\n\\s+value: payments"
  - it: renders every rate key of an override with its tier and a class override
    set:
      rateLimit.overrides:
        - name: m_ent_1
          rateKeys: ["0123456789abcdef", "fedcba9876543210"]
          tier: enterprise
          limits:
            list: {unit: minute, requestsPerUnit: 600}
    asserts:
      - matchRegex:
          path: data["payments-edge.yaml"]
          pattern: "requests_per_unit: 400\\n\\s+unit: second\\n\\s+value: payments"
      - matchRegex:
          path: data["payments-edge.yaml"]
          pattern: "requests_per_unit: 600\\n\\s+unit: minute\\n\\s+value: list"
      - matchRegex:
          path: data["payments-edge.yaml"]
          pattern: "key: merchant\\n\\s+value: 0123456789abcdef"
      - matchRegex:
          path: data["payments-edge.yaml"]
          pattern: "key: merchant\\n\\s+value: fedcba9876543210"
      - notMatchRegex:
          path: data["payments-edge.yaml"]
          pattern: "m_ent_1"
  - it: sets shadow mode on every limit
    set:
      rateLimit.shadowMode: true
    asserts:
      - matchRegex:
          path: data["payments-edge.yaml"]
          pattern: "shadow_mode: true"
  - it: fails when a default class is missing
    set:
      rateLimit.requestClasses: [payments, read, list, export]
    asserts:
      - failedTemplate: {}
  - it: fails on a unit that is not valid
    set:
      rateLimit.defaults.read.unit: week
    asserts:
      - failedTemplate:
          errorPattern: unit of read must be
  - it: fails on a tier that lacks a class
    set:
      rateLimit.tiers.thin: {payments: {unit: second, requestsPerUnit: 5}}
    asserts:
      - failedTemplate:
          errorPattern: "tier thin: no limit for request class read"
  - it: fails on an unknown tier
    set:
      rateLimit.overrides: [{name: m1, rateKeys: ["0123456789abcdef"], tier: gold}]
    asserts:
      - failedTemplate:
          errorPattern: unknown tier gold
  - it: fails on a duplicate override name
    set:
      rateLimit.overrides: [{name: m1, rateKeys: ["0123456789abcdef"]}, {name: m1, rateKeys: ["fedcba9876543210"], tier: hot}]
    asserts:
      - failedTemplate:
          errorPattern: duplicate name m1
  - it: fails on a rate key in two overrides
    set:
      rateLimit.overrides: [{name: m1, rateKeys: ["0123456789abcdef"]}, {name: m2, rateKeys: ["0123456789abcdef"]}]
    asserts:
      - failedTemplate:
          errorPattern: rate key 0123456789abcdef is already in another override
  - it: fails on a malformed override name
    set:
      rateLimit.overrides: [{name: "bad id!", rateKeys: ["0123456789abcdef"]}]
    asserts:
      - failedTemplate:
          errorPattern: name must match
  - it: fails on a rate key that is not a 16-digit hex hash
    set:
      rateLimit.overrides: [{name: m1, rateKeys: ["m_ent_1"]}]
    asserts:
      - failedTemplate: {}
  - it: fails on an override without rate keys
    set:
      rateLimit.overrides: [{name: m1, rateKeys: []}]
    asserts:
      - failedTemplate: {}
  - it: fails on an override of an unknown class
    set:
      rateLimit.overrides: [{name: m1, rateKeys: ["0123456789abcdef"], limits: {export: {unit: second, requestsPerUnit: 1}}}]
    asserts:
      - failedTemplate:
          errorPattern: unknown request class export
  - it: fails on a placeholder once the environment layer requires resolution
    set:
      requireResolved: true
    asserts:
      - failedTemplate:
          errorPattern: unresolved REPLACE_
