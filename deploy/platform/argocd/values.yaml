# Generated by tools/config/render/render_admin_sso.py from config/platform.yaml; edit the source, not this file.
configs:
  cm:
    application.resourceTrackingMethod: annotation
    url: https://argocd.payments.internal
    admin.enabled: 'false'
    oidc.config: |
      name: Okta
      issuer: https://example.okta.com
      clientID: $argocd-oidc:client_id
      clientSecret: $argocd-oidc:client_secret
      enablePKCEAuthentication: true
      requestedScopes:
      - openid
      - profile
      - email
      - groups
  rbac:
    policy.default: ''
    policy.csv: |
      g, pay-grafana-admins, role:admin
      g, pay-sre, role:readonly
      g, pay-security, role:readonly
      g, pay-engineering, role:readonly
      g, pay-audit, role:readonly
    scopes: '[groups]'
  params:
    server.insecure: true
controller:
  metrics:
    enabled: true
server:
  metrics:
    enabled: true
applicationSet:
  metrics:
    enabled: true
redis-ha:
  enabled: true
extraObjects:
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
    name: argocd-oidc
    namespace: argocd
  spec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: aws-secrets-manager
    target:
      name: argocd-oidc
      creationPolicy: Owner
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: argocd
    data:
    - secretKey: client_id
      remoteRef:
        key: pay/shared-services/argocd/oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: pay/shared-services/argocd/oidc
        property: client_secret
