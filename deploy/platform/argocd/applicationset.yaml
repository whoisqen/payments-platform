apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-argocd
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/argocd: enabled
  template:
    metadata:
      name: 'argocd-{{ .name }}'
      labels:
        payments-platform/addon: argocd
    spec:
      project: platform
      destination:
        server: '{{ .server }}'
        namespace: argocd
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://argoproj.github.io/argo-helm
          chart: argo-cd
          targetRevision: 10.18.2
          helm:
            valueFiles:
              - $values/deploy/platform/argocd/values.yaml
        - repoURL: https://github.com/whoisqen/payments-platform
          targetRevision: main
          ref: values
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
