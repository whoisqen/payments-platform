suite: central mutual TLS client secret
templates:
  - externalsecret.yaml
set:
  secretName: prometheus-central-tls
tests:
  - it: reads the CA, certificate and key from one shared-services secret
    asserts:
      - equal:
          path: metadata.name
          value: prometheus-central-tls
      - equal:
          path: spec.target.name
          value: prometheus-central-tls
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: spec.data
          value:
            - {secretKey: ca.crt, remoteRef: {key: pay/shared-services/otel-collector/tls, property: ca.crt}}
            - {secretKey: tls.crt, remoteRef: {key: pay/shared-services/otel-collector/tls, property: tls.crt}}
            - {secretKey: tls.key, remoteRef: {key: pay/shared-services/otel-collector/tls, property: tls.key}}
  - it: takes the first segment of the secret name from the name prefix
    set:
      namePrefix: acme
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: acme/shared-services/otel-collector/tls
  - it: fails without a secret name
    set:
      secretName: ""
    asserts:
      - failedTemplate:
          errorMessage: secretName is required
