{{- $name := required "secretName is required" .Values.secretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
    {{- range list "ca.crt" "tls.crt" "tls.key" }}
    - {secretKey: {{ . }}, remoteRef: {key: {{ printf "%s/%s" $.Values.namePrefix $.Values.remoteKey }}, property: {{ . }}}}
    {{- end }}
