# Overlay of observability/exporters/kafka.yaml: TLS with IAM auth, no client certificate (so no mounted secret); the chart labels pods by app,
# the monitor selects by app.kubernetes.io/name.
tls:
  enabled: true
service:
  labels: {app.kubernetes.io/name: prometheus-kafka-exporter}
podLabels: {app.kubernetes.io/name: prometheus-kafka-exporter}
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
