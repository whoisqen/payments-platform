# Overlay of observability/exporters/redis.yaml: the address comes from the secret, the pod is restricted.
redisAddressConfig:
  enabled: true
  isSecret: true
  source: {name: memorydb-exporter-auth, key: address}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
