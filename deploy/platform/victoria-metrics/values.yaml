# Central metrics store (runs in the central cluster, outside the CDE). Every component is replicated; the sizes are the reference
# and are raised by the volume size of each environment layer when the volume fills up.
# Deduplication of the two Prometheus replicas is switched on by the add-on parameter dedup.minScrapeInterval (value: central.dedup_interval).
vmselect:
  replicaCount: 3
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: vmselect
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: vmselect

vminsert:
  replicaCount: 3
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  extraArgs:
    # Every sample is written to two vmstorage nodes: one node may be lost without losing data
    replicationFactor: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: vminsert
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: vminsert

vmstorage:
  replicaCount: 3
  # Months (architecture section 7: 13 months, downsampled)
  retentionPeriod: 13
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  persistentVolume:
    enabled: true
    size: 500Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: vmstorage
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: vmstorage
