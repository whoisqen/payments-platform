# Generated by tools/config/render_central.py from observability/alertmanager; edit the sources, not this file.
replicaCount: 3
podAntiAffinity: hard
podAntiAffinityTopologyKey: kubernetes.io/hostname
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
podDisruptionBudget:
  minAvailable: 2
persistence:
  enabled: true
  size: 2Gi
extraSecretMounts:
- name: secrets
  mountPath: /etc/alertmanager/secrets
  secretName: alertmanager-secrets
  readOnly: true
config:
  enabled: true
  global:
    resolve_timeout: 5m
  templates:
  - /etc/alertmanager/*.tmpl
  route:
    receiver: slack-payments-alerts
    group_by:
    - alertname
    - region
    - psp
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 8760h
    routes:
    - receiver: deadmans-switch
      matchers:
      - alertname="Watchdog"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - receiver: fallback-webhook
      matchers:
      - alertname="AlertmanagerNotificationsFailing"
      continue: true
      group_wait: 0s
      repeat_interval: 8760h
    - receiver: slack-security
      matchers:
      - team="security"
      group_by:
      - alertname
      - region
      repeat_interval: 8760h
    - receiver: slack-security
      matchers:
      - severity="security"
      group_by:
      - alertname
      - region
      repeat_interval: 8760h
    - receiver: slack-payments-critical
      matchers:
      - severity="critical"
      group_by:
      - alertname
      - region
      - psp
      repeat_interval: 8760h
    - receiver: slack-payments-alerts
      matchers:
      - severity="warning"
  receivers:
  - name: slack-payments-critical
    slack_configs:
    - api_url_file: /etc/alertmanager/secrets/slack-payments-critical
      channel: '#payments-critical'
      send_resolved: true
      title: '{{ template "slack.title" . }}'
      text: '{{ template "slack.text" . }}'
  - name: slack-security
    slack_configs:
    - api_url_file: /etc/alertmanager/secrets/slack-security
      channel: '#security-alerts'
      send_resolved: true
      title: '{{ template "slack.title" . }}'
      text: '{{ template "slack.text" . }}'
  - name: slack-payments-alerts
    slack_configs:
    - api_url_file: /etc/alertmanager/secrets/slack-payments-alerts
      channel: '#payments-alerts'
      send_resolved: true
      title: '{{ template "slack.title" . }}'
      text: '{{ template "slack.text" . }}'
  - name: fallback-webhook
    webhook_configs:
    - url_file: /etc/alertmanager/secrets/fallback-webhook-url
      send_resolved: true
  - name: deadmans-switch
    webhook_configs:
    - url_file: /etc/alertmanager/secrets/deadmans-switch-url
      send_resolved: false
  inhibit_rules:
  - source_matchers:
    - alertname="RegionDown"
    target_matchers:
    - severity=~"critical|warning"
    - alertname!="RegionDown"
    equal:
    - region
  - source_matchers:
    - alertname="PSPDegraded"
    target_matchers:
    - alertname=~"AuthorizationRateDrop|PspLatencyP99High|PspCircuitBreakerOpen"
    equal:
    - psp
  - source_matchers:
    - alertname="NodeNotReady"
    target_matchers:
    - alertname=~"CrashLoopBackOff"
    equal:
    - node
  - source_matchers:
    - alertname=~".*BurnFastest"
    target_matchers:
    - alertname=~".*BurnFast"
    equal:
    - slo
  - source_matchers:
    - alertname=~".*BurnFast|.*BurnFastest"
    target_matchers:
    - alertname=~".*BurnSlow|.*BurnTicket"
    equal:
    - slo
  - source_matchers:
    - alertname="AuroraGlobalLagRpoBudgetExceeded"
    target_matchers:
    - alertname="AuroraGlobalLagHigh"
    equal:
    - global_cluster
    - region
  - source_matchers:
    - alertname="RestoreTooSlow"
    target_matchers:
    - alertname="RestoreDurationNearTarget"
    equal:
    - store
  - source_matchers:
    - alertname="DrainLagHigh"
    target_matchers:
    - alertname="RedisStreamBacklog"
    equal:
    - cell
templates:
  notifications.tmpl: |
    {{ define "pd.description" -}}
    [{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}
    {{- end }}

    {{ define "slack.title" -}}
    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
    {{- end }}

    {{ define "slack.text" -}}
    {{ range .Alerts -}}
    *{{ .Annotations.summary }}*
    Runbook: {{ .Annotations.runbook_url }}
    Dashboard: {{ .Annotations.dashboard_url }}
    Owner: {{ .Labels.owner }}, failure mode {{ .Labels.failure_mode }}
    {{ end }}
    {{- end }}
