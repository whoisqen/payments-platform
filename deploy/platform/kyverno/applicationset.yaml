apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-kyverno
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/addons: enabled
  template:
    metadata:
      name: 'kyverno-{{ .name }}'
      labels:
        payments-platform/addon: kyverno
    spec:
      project: platform
      destination:
        server: '{{ .server }}'
        namespace: kyverno
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://kyverno.github.io/kyverno/
          chart: kyverno
          targetRevision: 3.10.0
          helm:
            valueFiles:
              - $values/deploy/platform/kyverno/values.yaml
        - repoURL: https://github.com/whoisqen/payments-platform
          targetRevision: main
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
