# Test merchants on the dummy connector from Vault; the runners read it with envFrom, so the keys are the script variables
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.secretName }}
  labels:
    {{- include "k6.labels" (dict "root" . "component" "credentials") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.credentials.secretStore }}
  target:
    name: {{ .Values.credentials.secretName }}
    creationPolicy: Owner
  data:
    {{- range $env, $prop := .Values.credentials.properties }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ $.Values.credentials.remoteKey }}
        property: {{ $prop }}
    {{- end }}
