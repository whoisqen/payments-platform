{{- if .Values.networkPolicy.enabled }}
# Runners accept only the k6 REST API from the starter and the operator; egress stays open because the target is a public entry
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k6-runners
  labels:
    {{- include "k6.labels" (dict "root" . "component" "runner") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: payments-platform/scenario
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.operatorNamespace }}
      ports:
        - port: 6565
          protocol: TCP
{{- end }}
