# OTLP/HTTP JSON (the node collectors, encoding json) -> one event per log record -> data stream logs-app-<env>
input {
  http {
    id => "otlp_http"
    port => {{ .Values.input.port }}
    ssl_enabled => true
    ssl_certificate => "/etc/logstash/tls/tls.crt"
    ssl_key => "/etc/logstash/tls/tls.key"
    ssl_certificate_authorities => ["/etc/logstash/tls/ca.crt"]
    ssl_client_authentication => "required"
    ssl_supported_protocols => ["TLSv1.2", "TLSv1.3"]
    threads => {{ .Values.input.threads }}
    max_pending_requests => {{ .Values.input.maxPendingRequests }}
    max_content_length => {{ .Values.input.maxContentLength | int }}
    additional_codecs => { "application/json" => "json" }
    # text/plain: the exporter parses a JSON or protobuf answer as an export response, a plain "ok" it ignores
    response_headers => { "Content-Type" => "text/plain" }
  }
}

filter {
  # Only the logs signal; any other path or a body that is not JSON goes to the dead letter queue below
  if [headers][request_path] == "/v1/logs" and "_jsonparsefailure" not in [tags] {
    ruby {
      id => "otlp_flatten"
      path => "/usr/share/logstash/pipeline/otlp_logs.rb"
      script_params => {
        "data_stream_prefix" => "{{ .Values.pipeline.dataStreamPrefix }}"
        "fallback_environment" => "{{ .Values.pipeline.fallbackEnvironment }}"
        "drop_debug_environments" => [{{ range $i, $e := .Values.pipeline.dropDebugEnvironments }}{{ if $i }}, {{ end }}"{{ $e }}"{{ end }}]
      }
    }
  }
  # Every indexed record names its service; the rest is kept for inspection, not indexed
  if ![resource][service.name] {
    ruby {
      id => "dlq_without_service"
      code => 'execution_context.dlq_writer.write(event, "no resource.service.name"); event.cancel'
    }
  }
}

output {
  opensearch {
    id => "opensearch"
    hosts => ["https://{{ .Values.opensearch.endpoint }}:443"]
    auth_type => {
      type => "aws_iam"
      region => "{{ .Values.opensearch.region }}"
      service_name => "es"
    }
    index => "%{[@metadata][target]}"
    action => "create"
    manage_template => false
    ecs_compatibility => disabled
    # Mapping and other 400 or 404 rejections go to the dead letter queue (dead_letter_queue.enable in logstash.yml)
  }
}
