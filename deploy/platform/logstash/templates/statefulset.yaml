{{- include "logstash.required" . }}
{{- $ctx := dict "root" . "cfg" .Values -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash
  labels:
    {{- include "logstash.labels" . | nindent 4 }}
spec:
  serviceName: logstash-headless
  replicas: {{ .Values.replicas }}
  # The pods are independent; a parallel start brings the whole input up at once
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "logstash.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "logstash.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Logstash terminates the mutual TLS itself and reaches OpenSearch outside the mesh registry
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # The projected IRSA token is mounted by the EKS webhook; the API token is not needed
      automountServiceAccountToken: false
      # Drains the persistent queue of the in-flight batches before the pod goes
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "logstash.selectorLabels" . | nindent 18 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "logstash.selectorLabels" . | nindent 14 }}
      containers:
        - name: logstash
          image: {{ include "platform-common.image" $ctx }}
          # No settings from the environment: the entrypoint would rewrite logstash.yml, which is read-only
          env:
            - name: AWS_REGION
              value: {{ .Values.opensearch.region | quote }}
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
          ports:
            - name: otlp-https
              containerPort: {{ .Values.input.port }}
            - name: api
              containerPort: 9600
          readinessProbe:
            httpGet: {path: /, port: api}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: api}
            # JRuby compiles the pipeline at start; a short delay restarts a healthy pod
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config
              readOnly: true
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
              readOnly: true
            - name: tls
              mountPath: /etc/logstash/tls
              readOnly: true
            - name: data
              mountPath: /usr/share/logstash/data
            - name: tmp
              mountPath: /tmp
        - name: exporter
          image: {{ include "platform-common.image" (dict "root" . "cfg" .Values.exporter) }}
          env:
            - name: LOGSTASH_URL
              value: http://localhost:9600
          ports:
            - name: metrics
              containerPort: 9198
          readinessProbe:
            httpGet: {path: /healthcheck, port: metrics}
            periodSeconds: 15
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap:
            name: logstash-config
        - name: pipeline
          configMap:
            name: logstash-pipeline
        - name: tls
          secret:
            secretName: {{ .Values.input.tlsSecretName }}
        # JRuby and JNA scratch files; capped so nothing grows on the node disk
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
  # Persistent queue and dead letter queue survive a restart and a reschedule in the same zone
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
