# Upstream hashicorp/vault chart 0.34.1 (pinned in deploy/argocd/templates/addons/vault.yaml)
global:
  tlsDisable: true

# Secrets reach pods through External Secrets, so the sidecar injector stays off
injector:
  enabled: false

csi:
  enabled: false

server:
  image:
    repository: hashicorp/vault
    # Pinned by version and digest (the appVersion of chart 0.34.1); Renovate bumps both
    tag: "2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2"
  logLevel: info
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 2
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"
    initialDelaySeconds: 60
    periodSeconds: 5
    failureThreshold: 2
  # The EKS Pod Identity association on vault/vault gives the pod the role that may use the unseal key; no static AWS credentials and no annotation
  serviceAccount:
    create: true
    name: vault
  extraLabels:
    payments-platform/part-of: payments-platform
  statefulSet:
    securityContext:
      pod:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  # Needed because the root filesystem is read-only and the config is rendered at start
  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /tmp
  dataStorage:
    enabled: true
    size: 20Gi
    storageClass: null
  auditStorage:
    enabled: true
    size: 10Gi
  # TLS ends at the mesh: Istio STRICT mTLS between pods, so the listener is plain inside the pod network
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }
        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }
        # Key and region come from VAULT_AWSKMS_SEAL_KEY_ID and AWS_REGION (server.extraEnvironmentVars of the environment layer)
        seal "awskms" {}
        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
        service_registration "kubernetes" {}
    disruptionBudget:
      enabled: true
      maxUnavailable: 1
  # One Vault pod per AZ
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              component: server
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: vault
          component: server

serverTelemetry:
  serviceMonitor:
    enabled: true
