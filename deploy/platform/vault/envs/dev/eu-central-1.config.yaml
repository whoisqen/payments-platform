# dev eu-central-1: names Terraform creates; pod roles come from Pod Identity associations vault/vault-snapshot and vault/vault-bootstrap
requireResolved: true

snapshot:
  image:
    repository: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments/vault-snapshot
  bucket: pay-dev-euc1-vault-snapshots
  region: eu-central-1

bootstrap:
  region: eu-central-1
  initSecretId: pay/dev/vault/init

networkPolicy:
  # Other clusters of the VPC call Vault through its load balancer
  clientCidrs:
    - 10.120.0.0/16
  awsEndpointCidrs:
    - 10.120.255.0/24
