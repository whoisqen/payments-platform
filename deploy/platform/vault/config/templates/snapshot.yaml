{{- include "vault-config.guard" . -}}
{{- if .Values.snapshot.enabled }}
{{- $s := .Values.snapshot }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $s.serviceAccountName }}
  labels:
    {{- include "vault-config.labels" . | nindent 4 }}
  {{- with $s.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-snapshot
  labels:
    {{- include "vault-config.labels" . | nindent 4 }}
spec:
  schedule: {{ $s.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ $s.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-snapshot
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/part-of: payments-platform
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $s.serviceAccountName }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: {{ include "vault-config.image" . | quote }}
              command: ["/bin/sh", "-eu", "-c"]
              args:
                - |
                  export VAULT_TOKEN
                  VAULT_TOKEN=$(vault write -field=token "auth/${AUTH_MOUNT}/login" role="${AUTH_ROLE}" jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  vault operator raft snapshot save /scratch/vault.snap
                  key="${PREFIX}/$(date -u +%Y/%m/%d)/vault-$(date -u +%H%M%S).snap"
                  if [ -n "${KMS_KEY_ID}" ]; then
                    aws s3 cp /scratch/vault.snap "s3://${BUCKET}/${key}" --sse aws:kms --sse-kms-key-id "${KMS_KEY_ID}" --only-show-errors
                  else
                    aws s3 cp /scratch/vault.snap "s3://${BUCKET}/${key}" --only-show-errors
                  fi
                  rm -f /scratch/vault.snap
              env:
                - name: VAULT_ADDR
                  value: {{ printf "http://%s.%s.svc:%v" .Values.vault.serviceName .Release.Namespace .Values.vault.port | quote }}
                - name: AUTH_MOUNT
                  value: {{ $s.authMount | quote }}
                - name: AUTH_ROLE
                  value: {{ $s.authRole | quote }}
                - name: BUCKET
                  value: {{ $s.bucket | quote }}
                - name: PREFIX
                  value: {{ $s.prefix | quote }}
                - name: KMS_KEY_ID
                  value: {{ $s.kmsKeyId | quote }}
                - name: AWS_REGION
                  value: {{ $s.region | quote }}
                - name: HOME
                  value: /scratch
              resources:
                {{- toYaml $s.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
          volumes:
            - name: scratch
              emptyDir:
                sizeLimit: {{ $s.scratchSizeLimit }}
{{- end }}
