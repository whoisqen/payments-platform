# Central log store (runs in the central cluster, outside the CDE). Bucket and region are in storage.yaml (generated by tools/config/render_grafana.py).
# Release name is loki (set by the add-on): clients push OTLP to the Service loki-gateway, path /otlp/v1/logs.
deploymentMode: SimpleScalable

loki:
  # The collector sends no X-Scope-OrgID header; the mutual TLS front door is the access control
  auth_enabled: false
  commonConfig:
    replication_factor: 3
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  # Fewer, fuller chunks: about a quarter of the S3 requests and faster range reads. Snappy decodes several times faster than
  # zstd for a ~20% larger object; at 30 days of S3 Standard the bytes cost less than the query time
  ingester:
    chunk_encoding: snappy
    chunk_target_size: 1572864
    chunk_block_size: 262144
    max_chunk_age: 2h
    chunk_idle_period: 30m
  limits_config:
    retention_period: 720h
    # Debug and trace lines (marked by the collector, transform/containers) are kept 3 days
    retention_stream:
      - selector: '{log_retention="debug"}'
        priority: 1
        period: 72h
    allow_structured_metadata: true
    # The index holds only low-cardinality resource labels; the per-pod ones go to structured metadata (still filterable)
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes: [log.retention]
          - action: structured_metadata
            attributes: [k8s.pod.name, k8s.pod.uid, k8s.replicaset.name, service.instance.id, k8s.node.name]
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40
    per_stream_rate_limit: 5MB
    per_stream_rate_limit_burst: 15MB
    max_global_streams_per_user: 20000
    max_query_series: 5000
    max_query_parallelism: 32
    split_queries_by_interval: 1h
    query_timeout: 2m
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    delete_request_store: s3
  storage:
    type: s3
    s3:
      # No keys: the AWS SDK takes the EKS Pod Identity credentials of the service account
      s3ForcePathStyle: false
      insecure: false

serviceAccount:
  create: true
  name: loki

test:
  enabled: false
lokiCanary:
  enabled: false
minio:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
# Memcached in front of S3: repeated dashboard and alert queries read memory, not S3 (GETs cost and add ~50 ms each).
# Sized well under the chart default of 8 GiB per pod; two replicas so a restart does not empty the cache
chunksCache:
  enabled: true
  replicas: 2
  allocatedMemory: 2048
  defaultValidity: 24h
resultsCache:
  enabled: true
  replicas: 2
  allocatedMemory: 512
  defaultValidity: 12h

gateway:
  enabled: true
  replicas: 2
  verboseLogging: false
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
              app.kubernetes.io/name: '{{ include "loki.name" . }}'
              app.kubernetes.io/instance: '{{ .Release.Name }}'
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: gateway
          app.kubernetes.io/name: '{{ include "loki.name" . }}'
          app.kubernetes.io/instance: '{{ .Release.Name }}'
  podDisruptionBudget:
    maxUnavailable: 1

# The chart gives write, read and backend a hard anti-affinity by host and a PDB of one; the spread across zones is added here
write:
  replicas: 3
  # WAL and the open chunks: 2 h of the busiest ingester stream fits several times over
  persistence:
    size: 20Gi
    storageClass: gp3-encrypted
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 3Gi}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: write
          app.kubernetes.io/name: '{{ include "loki.name" . }}'
          app.kubernetes.io/instance: '{{ .Release.Name }}'
read:
  replicas: 3
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 3Gi}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: read
          app.kubernetes.io/name: '{{ include "loki.name" . }}'
          app.kubernetes.io/instance: '{{ .Release.Name }}'
backend:
  replicas: 3
  # Compactor working directory and the ruler; the index lives in S3
  persistence:
    size: 10Gi
    storageClass: gp3-encrypted
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: backend
          app.kubernetes.io/name: '{{ include "loki.name" . }}'
          app.kubernetes.io/instance: '{{ .Release.Name }}'
