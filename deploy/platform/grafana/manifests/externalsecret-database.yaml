# Generated by tools/config/render_grafana.py: the PostgreSQL that the Grafana replicas share, from AWS Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-database
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-database
    creationPolicy: Owner
  data:
  - secretKey: GF_DATABASE_HOST
    remoteRef:
      key: pay/shared-services/grafana/database
      property: host
  - secretKey: GF_DATABASE_NAME
    remoteRef:
      key: pay/shared-services/grafana/database
      property: name
  - secretKey: GF_DATABASE_USER
    remoteRef:
      key: pay/shared-services/grafana/database
      property: user
  - secretKey: GF_DATABASE_PASSWORD
    remoteRef:
      key: pay/shared-services/grafana/database
      property: password
