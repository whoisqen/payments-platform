# Central Grafana (runs in the central cluster, outside the CDE). Release name is grafana (set by the add-on).
# The URLs that hold the name of the cluster (VM_URL, ALERTMANAGER_URL), the host and root_url are parameters of the add-on.
# Dashboards are the ConfigMaps of manifests/, generated by tools/config/render_grafana.py from observability/dashboards.
replicas: 2

# The two replicas share one PostgreSQL (ExternalSecret grafana-database), so no volume holds state
persistence:
  enabled: false

podDisruptionBudget:
  minAvailable: 1
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
            app.kubernetes.io/instance: grafana
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: grafana

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# The OIDC client id, secret and endpoints, as GF_AUTH_GENERIC_OAUTH_* variables (ExternalSecret grafana-oidc)
envFromSecrets:
  - name: grafana-oidc
  - name: grafana-database

# Data source plugin of the central OpenSearch, pinned; installed at start from grafana.com (the egress allow list must admit it)
plugins:
  - grafana-opensearch-datasource 2.34.7

grafana.ini:
  # SigV4 for the OpenSearch data source with the default AWS chain (the Pod Identity credentials of the grafana service account)
  aws:
    allowed_auth_providers: default
  auth:
    sigv4_auth_enabled: true
  database:
    type: postgres
    ssl_mode: require
  analytics:
    reporting_enabled: false
    check_for_updates: false
  auth.generic_oauth:
    enabled: true
    name: SSO
    allow_sign_up: true
    scopes: openid profile email groups
    use_pkce: true
  users:
    allow_sign_up: false

ingress:
  enabled: false  # the entry is the Gateway API (deploy/platform/admin-gateway); no Ingress objects

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    resource: configmap
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
      allowUiUpdates: false
  datasources:
    enabled: false

# The uids are fixed: the links between traces, logs and metrics refer to them
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # Type prometheus and default: the dashboards pick the data source by that type
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: ${VM_URL}
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: 30s
      # The central OpenSearch (data streams logs-app-<env>), signed with SigV4 by the Grafana Pod Identity role
      - name: OpenSearch
        uid: opensearch
        type: grafana-opensearch-datasource
        access: proxy
        url: ${OPENSEARCH_URL}
        jsonData:
          flavor: opensearch
          version: 2.17.0
          database: logs-app-*
          timeField: "@timestamp"
          logMessageField: body
          logLevelField: severity.text
          maxConcurrentShardRequests: 5
          pplEnabled: true
          serverless: false
          sigV4Auth: true
          sigV4AuthType: default
          sigV4Region: ${AWS_REGION}
          dataLinks:
            # traceId of a record opens the trace in Tempo
            - field: traceId
              datasourceUid: tempo
              url: $${__value.raw}
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo-query-frontend.monitoring.svc:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: opensearch
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            customQuery: true
            query: 'traceId:"$${__span.traceId}"'
          tracesToMetrics:
            datasourceUid: victoriametrics
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            tags:
              - {key: service.name, value: service}
            queries:
              - name: Request rate
                query: sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))
              - name: Error rate
                query: sum(rate(traces_spanmetrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[5m]))
              - name: Duration p95
                query: histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])) by (le))
          serviceMap:
            datasourceUid: victoriametrics
          nodeGraph:
            enabled: true
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        access: proxy
        url: ${ALERTMANAGER_URL}
        jsonData:
          implementation: prometheus
