# Generated by tools/config/render_grafana.py from config/platform.yaml; edit the source, not this file.
grafana.ini:
  auth:
    disable_login_form: true
    oauth_allow_insecure_email_lookup: false
    login_maximum_lifetime_duration: 24h
    login_maximum_inactive_lifetime_duration: 8h
    token_rotation_interval_minutes: 10
  auth.generic_oauth:
    groups_attribute_path: groups
    org_attribute_path: groups
    org_mapping: pay-grafana-admins:1:Admin,pay-sre:1:Editor,pay-security:1:Editor
    allowed_groups: pay-grafana-admins,pay-sre,pay-security
    role_attribute_path: contains(groups[*], 'pay-grafana-admins') && 'GrafanaAdmin' || contains(groups[*], 'pay-sre') && 'Editor' || contains(groups[*], 'pay-security') && 'Editor'
    role_attribute_strict: true
    allow_assign_grafana_admin: true
    skip_org_role_sync: false
    allow_sign_up: true
  users:
    allow_sign_up: false
    auto_assign_org: false
    auto_assign_org_role: Viewer
    viewers_can_edit: false
    editors_can_admin: false
  security:
    disable_gravatar: true
    cookie_secure: true
    cookie_samesite: lax
    strict_transport_security: true
    allow_embedding: false
  snapshots:
    external_enabled: false
  explore:
    enabled: true
