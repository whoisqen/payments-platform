# Generated by tools/config/render/render_vmalert.py from observability/alerts and observability/slo; edit the rules, not this file.
server:
  replicaCount: 2
  datasource:
    url: http://vm-victoria-metrics-cluster-vmselect.victoria-metrics.svc:8481/select/0/prometheus
  remoteWrite:
    url: http://vm-victoria-metrics-cluster-vminsert.victoria-metrics.svc:8480/insert/0/prometheus/api/v1/write
  extraArgs:
    rule:
    - /config/alert-rules.yaml
    envflag.enable: true
    envflag.prefix: VM_
    loggerFormat: json
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app: server
  config:
    alerts:
      groups:
      - name: central-application-components
        interval: 1m
        rules:
        - alert: ReconciliationMismatch
          expr: sum by (psp) (increase(reconciliation_amount_mismatch_total[1d])) > 0
          for: 10m
          keep_firing_for: 10m
          labels:
            severity: warning
            team: payments-core
            service: scheduler
            owner: payments-core-oncall
            layer: application
            failure_mode: application-reconciliation-mismatch
          annotations:
            summary: Daily PSP reconciliation found amount mismatches
            runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/application/warnings.md#reconciliation-mismatch'
            dashboard_url: '{{ $externalLabels.grafana_url }}/d/payments'
      - name: central-application-psp
        interval: 1m
        rules:
        - alert: AuthorizationRateDrop
          expr: sum by (psp) (rate(payment_attempts_total{outcome="authorized"}[15m])) / sum by (psp) (rate(payment_attempts_total[15m])) < (sum by (psp) (rate(payment_attempts_total{outcome="authorized"}[15m] offset 1w)) / sum by (psp) (rate(payment_attempts_total[15m] offset 1w))) - 0.05
          for: 15m
          keep_firing_for: 10m
          labels:
            severity: warning
            team: payments-core
            service: router
            owner: payments-core-oncall
            layer: application
            failure_mode: application-authorization-rate-drop
          annotations:
            summary: Authorization rate is 5 points lower than the same time a week ago
            runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/application/warnings.md#authorization-rate-drop'
            dashboard_url: '{{ $externalLabels.grafana_url }}/d/payments'
      - name: central-data-aurora
        interval: 1m
        rules:
        - alert: AuroraTableGrowthFast
          expr: max by (cell, relname) (pg_table_size_bytes) / max by (cell, relname) (pg_table_size_bytes offset 1d) > 1.2
          for: 1h
          keep_firing_for: 10m
          labels:
            severity: warning
            team: data-platform
            service: aurora
            owner: data-platform-oncall
            layer: data
            failure_mode: data-aurora-table-growth-fast
          annotations:
            summary: A table grew more than 20% in a day
            runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/warnings.md#aurora-table-growth-fast'
            dashboard_url: '{{ $externalLabels.grafana_url }}/d/data-stores'
      - name: central-security-pci-detection
        interval: 1m
        rules:
        - alert: PanDetectedInLogs
          expr: sum by (source) (increase(pan_detected_total[15m])) > 0
          labels:
            severity: security
            team: security
            service: otel-collector
            owner: security-oncall
            layer: security-pci
            failure_mode: security-pci-pan-detected-in-logs
          annotations:
            summary: A PAN pattern was detected in telemetry or logs
            runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/security-pci/pan-detected-in-logs.md'
            dashboard_url: '{{ $externalLabels.grafana_url }}/d/edge'
      - name: central-slo-sli-recordings-payments-authorization-availability
        interval: 1m
        rules:
        - record: slo:sli_error:ratio_rate3d
          expr: (sum(rate(http_server_requests_total{service="router",route="payments_confirm",code=~"5..",fault="platform"}[3d]))) / (sum(rate(http_server_requests_total{service="router",route="payments_confirm"}[3d])))
          labels:
            sloth_id: payments-authorization-availability
            sloth_service: payments-authorization
            sloth_slo: availability
            team: payments-core
            owner: payments-core-oncall
            layer: application
        - record: slo:sli_error:ratio_rate30d
          expr: sum_over_time(slo:sli_error:ratio_rate5m{sloth_id="payments-authorization-availability",sloth_service="payments-authorization",sloth_slo="availability"}[30d]) / count_over_time(slo:sli_error:ratio_rate5m{sloth_id="payments-authorization-availability",sloth_service="payments-authorization",sloth_slo="availability"}[30d])
          labels:
            sloth_id: payments-authorization-availability
            sloth_service: payments-authorization
            sloth_slo: availability
            team: payments-core
            owner: payments-core-oncall
            layer: application
      - name: central-slo-meta-recordings-payments-authorization-availability
        interval: 1m
        rules:
        - record: slo:period_burn_rate:ratio
          expr: slo:sli_error:ratio_rate30d{sloth_id="payments-authorization-availability",sloth_service="payments-authorization",sloth_slo="availability"} / on(sloth_id, sloth_slo, sloth_service) group_left() slo:error_budget:ratio{sloth_id="payments-authorization-availability",sloth_service="payments-authorization",sloth_slo="availability"}
          labels:
            sloth_id: payments-authorization-availability
            sloth_service: payments-authorization
            sloth_slo: availability
            team: payments-core
            owner: payments-core-oncall
            layer: application
        - record: slo:period_error_budget_remaining:ratio
          expr: 1 - slo:period_burn_rate:ratio{sloth_id="payments-authorization-availability",sloth_service="payments-authorization",sloth_slo="availability"}
          labels:
            sloth_id: payments-authorization-availability
            sloth_service: payments-authorization
            sloth_slo: availability
            team: payments-core
            owner: payments-core-oncall
            layer: application
      - name: central-slo-alerts-payments-authorization-availability
        interval: 1m
        rules:
        - alert: PaymentsAuthorizationAvailabilityBurnTicket
          keep_firing_for: 30m
          expr: slo:sli_error:ratio_rate3d{sloth_id="payments-authorization-availability",sloth_service="payments-authorization",sloth_slo="availability"} > (1 * 0.0001) and slo:sli_error:ratio_rate6h{sloth_id="payments-authorization-availability",sloth_service="payments-authorization",sloth_slo="availability"} > (1 * 0.0001)
          labels:
            team: payments-core
            owner: payments-core-oncall
            layer: application
            service: router
            severity: warning
            failure_mode: application-slo-authorization-availability
            slo: payments-authorization-availability
          annotations:
            summary: Authorization availability is burning the 99.99% error budget (1x over 3d/6h)
            runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/slo/authorization-availability.md'
            dashboard_url: '{{ $externalLabels.grafana_url }}/d/slo-overview'
      - name: central-slo-sli-recordings-payments-platform-overhead-latency
        interval: 1m
        rules:
        - record: slo:sli_error:ratio_rate3d
          expr: (sum(rate(platform_overhead_seconds_count{service="router"}[3d])) - sum(rate(platform_overhead_seconds_bucket{service="router",le="0.15"}[3d]))) / (sum(rate(platform_overhead_seconds_count{service="router"}[3d])))
          labels:
            sloth_id: payments-platform-overhead-latency
            sloth_service: payments-platform-overhead
            sloth_slo: latency
            team: payments-core
            owner: payments-core-oncall
            layer: application
        - record: slo:sli_error:ratio_rate30d
          expr: sum_over_time(slo:sli_error:ratio_rate5m{sloth_id="payments-platform-overhead-latency",sloth_service="payments-platform-overhead",sloth_slo="latency"}[30d]) / count_over_time(slo:sli_error:ratio_rate5m{sloth_id="payments-platform-overhead-latency",sloth_service="payments-platform-overhead",sloth_slo="latency"}[30d])
          labels:
            sloth_id: payments-platform-overhead-latency
            sloth_service: payments-platform-overhead
            sloth_slo: latency
            team: payments-core
            owner: payments-core-oncall
            layer: application
      - name: central-slo-meta-recordings-payments-platform-overhead-latency
        interval: 1m
        rules:
        - record: slo:period_burn_rate:ratio
          expr: slo:sli_error:ratio_rate30d{sloth_id="payments-platform-overhead-latency",sloth_service="payments-platform-overhead",sloth_slo="latency"} / on(sloth_id, sloth_slo, sloth_service) group_left() slo:error_budget:ratio{sloth_id="payments-platform-overhead-latency",sloth_service="payments-platform-overhead",sloth_slo="latency"}
          labels:
            sloth_id: payments-platform-overhead-latency
            sloth_service: payments-platform-overhead
            sloth_slo: latency
            team: payments-core
            owner: payments-core-oncall
            layer: application
        - record: slo:period_error_budget_remaining:ratio
          expr: 1 - slo:period_burn_rate:ratio{sloth_id="payments-platform-overhead-latency",sloth_service="payments-platform-overhead",sloth_slo="latency"}
          labels:
            sloth_id: payments-platform-overhead-latency
            sloth_service: payments-platform-overhead
            sloth_slo: latency
            team: payments-core
            owner: payments-core-oncall
            layer: application
      - name: central-slo-alerts-payments-platform-overhead-latency
        interval: 1m
        rules:
        - alert: PaymentsPlatformOverheadLatencyBurnTicket
          keep_firing_for: 30m
          expr: slo:sli_error:ratio_rate3d{sloth_id="payments-platform-overhead-latency",sloth_service="payments-platform-overhead",sloth_slo="latency"} > (1 * 0.001) and slo:sli_error:ratio_rate6h{sloth_id="payments-platform-overhead-latency",sloth_service="payments-platform-overhead",sloth_slo="latency"} > (1 * 0.001)
          labels:
            team: payments-core
            owner: payments-core-oncall
            layer: application
            service: router
            severity: warning
            failure_mode: application-slo-platform-overhead-latency
            slo: payments-platform-overhead-latency
          annotations:
            summary: Platform overhead above 150 ms is burning the 99.9% error budget (1x over 3d/6h)
            runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/slo/platform-overhead-latency.md'
            dashboard_url: '{{ $externalLabels.grafana_url }}/d/slo-overview'
      - name: central-slo-sli-recordings-payments-status-read
        interval: 1m
        rules:
        - record: slo:sli_error:ratio_rate3d
          expr: (sum(rate(http_server_requests_total{service="router",route="payments_retrieve"}[3d])) - sum(rate(http_server_request_duration_seconds_bucket{service="router",route="payments_retrieve",code!~"5..",le="0.05"}[3d]))) / (sum(rate(http_server_requests_total{service="router",route="payments_retrieve"}[3d])))
          labels:
            sloth_id: payments-status-read
            sloth_service: payments-status
            sloth_slo: read
            team: payments-core
            owner: payments-core-oncall
            layer: application
        - record: slo:sli_error:ratio_rate30d
          expr: sum_over_time(slo:sli_error:ratio_rate5m{sloth_id="payments-status-read",sloth_service="payments-status",sloth_slo="read"}[30d]) / count_over_time(slo:sli_error:ratio_rate5m{sloth_id="payments-status-read",sloth_service="payments-status",sloth_slo="read"}[30d])
          labels:
            sloth_id: payments-status-read
            sloth_service: payments-status
            sloth_slo: read
            team: payments-core
            owner: payments-core-oncall
            layer: application
      - name: central-slo-meta-recordings-payments-status-read
        interval: 1m
        rules:
        - record: slo:period_burn_rate:ratio
          expr: slo:sli_error:ratio_rate30d{sloth_id="payments-status-read",sloth_service="payments-status",sloth_slo="read"} / on(sloth_id, sloth_slo, sloth_service) group_left() slo:error_budget:ratio{sloth_id="payments-status-read",sloth_service="payments-status",sloth_slo="read"}
          labels:
            sloth_id: payments-status-read
            sloth_service: payments-status
            sloth_slo: read
            team: payments-core
            owner: payments-core-oncall
            layer: application
        - record: slo:period_error_budget_remaining:ratio
          expr: 1 - slo:period_burn_rate:ratio{sloth_id="payments-status-read",sloth_service="payments-status",sloth_slo="read"}
          labels:
            sloth_id: payments-status-read
            sloth_service: payments-status
            sloth_slo: read
            team: payments-core
            owner: payments-core-oncall
            layer: application
      - name: central-slo-alerts-payments-status-read
        interval: 1m
        rules:
        - alert: PaymentsStatusReadBurnTicket
          keep_firing_for: 30m
          expr: slo:sli_error:ratio_rate3d{sloth_id="payments-status-read",sloth_service="payments-status",sloth_slo="read"} > (1 * 0.0005) and slo:sli_error:ratio_rate6h{sloth_id="payments-status-read",sloth_service="payments-status",sloth_slo="read"} > (1 * 0.0005)
          labels:
            team: payments-core
            owner: payments-core-oncall
            layer: application
            service: router
            severity: warning
            failure_mode: application-slo-payment-status-read
            slo: payments-status-read
          annotations:
            summary: Payment status reads slower than 50 ms or failing are burning the 99.95% error budget (1x over 3d/6h)
            runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/slo/payment-status-read.md'
            dashboard_url: '{{ $externalLabels.grafana_url }}/d/slo-overview'
      - name: central-slo-sli-recordings-payments-webhooks-delivery
        interval: 1m
        rules:
        - record: slo:sli_error:ratio_rate3d
          expr: (sum(rate(webhook_events_total{service="scheduler"}[3d])) - sum(rate(webhook_delivery_seconds_bucket{service="scheduler",le="60"}[3d]))) / (sum(rate(webhook_events_total{service="scheduler"}[3d])))
          labels:
            sloth_id: payments-webhooks-delivery
            sloth_service: payments-webhooks
            sloth_slo: delivery
            team: payments-core
            owner: payments-core-oncall
            layer: application
        - record: slo:sli_error:ratio_rate30d
          expr: sum_over_time(slo:sli_error:ratio_rate5m{sloth_id="payments-webhooks-delivery",sloth_service="payments-webhooks",sloth_slo="delivery"}[30d]) / count_over_time(slo:sli_error:ratio_rate5m{sloth_id="payments-webhooks-delivery",sloth_service="payments-webhooks",sloth_slo="delivery"}[30d])
          labels:
            sloth_id: payments-webhooks-delivery
            sloth_service: payments-webhooks
            sloth_slo: delivery
            team: payments-core
