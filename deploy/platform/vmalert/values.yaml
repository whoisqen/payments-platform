        rules:
        - alert: PaymentsWebhookDeliveryBurnTicket
          keep_firing_for: 30m
          expr: slo:sli_error:ratio_rate3d{sloth_id="payments-webhooks-delivery",sloth_service="payments-webhooks",sloth_slo="delivery"} > (1 * 0.001) and slo:sli_error:ratio_rate6h{sloth_id="payments-webhooks-delivery",sloth_service="payments-webhooks",sloth_slo="delivery"} > (1 * 0.001)
