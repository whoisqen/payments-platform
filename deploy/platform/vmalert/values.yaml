        - record: slo:period_burn_rate:ratio
          expr: slo:sli_error:ratio_rate30d{sloth_id="payments-webhooks-delivery",sloth_service="payments-webhooks",sloth_slo="delivery"} / on(sloth_id, sloth_slo, sloth_service) group_left() slo:error_budget:ratio{sloth_id="payments-webhooks-delivery",sloth_service="payments-webhooks",sloth_slo="delivery"}
