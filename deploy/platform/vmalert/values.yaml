          expr: 1 - slo:period_burn_rate:ratio{sloth_id="payments-webhooks-delivery",sloth_service="payments-webhooks",sloth_slo="delivery"}
          labels:
            sloth_id: payments-webhooks-delivery
            sloth_service: payments-webhooks
            sloth_slo: delivery
            team: payments-core
            owner: payments-core-oncall
