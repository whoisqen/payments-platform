# Client certificate and CA of the mutual TLS to the central stack (remote write and Alertmanager); the same identity as the collector.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-central-tls
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: prometheus-central-tls
    creationPolicy: Owner
  data:
    - {secretKey: ca.crt, remoteRef: {key: pay/shared-services/otel-collector/tls, property: ca.crt}}
    - {secretKey: tls.crt, remoteRef: {key: pay/shared-services/otel-collector/tls, property: tls.crt}}
    - {secretKey: tls.key, remoteRef: {key: pay/shared-services/otel-collector/tls, property: tls.key}}
