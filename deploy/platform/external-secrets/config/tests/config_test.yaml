suite: external-secrets config
templates:
  - clustersecretstores.yaml
  - networkpolicy.yaml
tests:
  - it: renders both stores
    template: clustersecretstores.yaml
    asserts:
      - isKind:
          of: ClusterSecretStore
        documentIndex: 0
      - equal:
          path: spec.provider.aws.service
          value: SecretsManager
        documentIndex: 0
      - equal:
          path: spec.provider.vault.auth.kubernetes.role
          value: external-secrets
        documentIndex: 1
  - it: scopes a store to namespaces when a selector is set
    template: clustersecretstores.yaml
    set:
      vault.enabled: false
      awsSecretsManager.namespaceSelector:
        matchLabels:
          payments-platform/secrets: allowed
    asserts:
      - equal:
          path: spec.conditions[0].namespaceSelector.matchLabels["payments-platform/secrets"]
          value: allowed
  - it: omits the vault store when disabled
    template: clustersecretstores.yaml
    set:
      vault.enabled: false
    asserts:
      - hasDocuments:
          count: 1
  - it: starts from default deny
    template: networkpolicy.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]
  - it: fails on a placeholder once values must be resolved
    template: clustersecretstores.yaml
    set:
      requireResolved: true
    asserts:
      - failedTemplate: {}
  - it: rejects a malformed role ARN
    template: clustersecretstores.yaml
    set:
      awsSecretsManager.roleArn: nope
    asserts:
      - failedTemplate: {}
  - it: rejects a typo in a values key
    template: clustersecretstores.yaml
    set:
      vaults.enabled: true
    asserts:
      - failedTemplate: {}
  - it: omits the assumed role by default (Pod Identity)
    template: clustersecretstores.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.provider.aws.role
  - it: sets the assumed role when a role ARN is given
    template: clustersecretstores.yaml
    documentIndex: 0
    set:
      awsSecretsManager.roleArn: arn:aws:iam::111111111111:role/x
    asserts:
      - equal:
          path: spec.provider.aws.role
          value: arn:aws:iam::111111111111:role/x
  - it: waits for the CRDs of the upstream chart
    template: clustersecretstores.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
  - it: lets the operator reach a Vault outside the cluster
    template: networkpolicy.yaml
    documentIndex: 1
    set:
      networkPolicy.vaultCidrs: ["10.0.0.0/16"]
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.0.0.0/16
            ports:
              - port: 8200
                protocol: TCP
