# REPLACE_* defaults are rejected when requireResolved is true; the environment layer sets it
requireResolved: false

serviceAccount:
  name: external-secrets
  namespace: external-secrets

awsSecretsManager:
  enabled: true
  storeName: aws-secrets-manager
  region: REPLACE_AWS_REGION
  # Empty with EKS Pod Identity: the association on the service account gives the pod its role directly; set to assume a further role
  roleArn: ""
  # Empty means every namespace; set to restrict the store
  namespaceSelector: {}

vault:
  enabled: true
  storeName: vault
  server: http://vault-active.vault.svc:8200
  path: secret
  version: v2
  authMount: kubernetes
  authRole: external-secrets
  namespaceSelector: {}

networkPolicy:
  enabled: true
  apiServerCidrs: []
  awsEndpointCidrs: []
  # Vault reached outside the cluster (other clusters of the VPC call its load balancer)
  vaultCidrs: []
  vaultNamespace: vault
