{{- include "external-secrets-config.guard" . -}}
{{- $sa := .Values.serviceAccount }}
{{- with .Values.awsSecretsManager }}
{{- if .enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .storeName }}
  labels:
    {{- include "external-secrets-config.labels" $ | nindent 4 }}
spec:
  {{- with .namespaceSelector }}
  conditions:
    - namespaceSelector:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  provider:
    aws:
      service: SecretsManager
      region: {{ .region | quote }}
      role: {{ .roleArn | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ $sa.name }}
            namespace: {{ $sa.namespace }}
{{- end }}
{{- end }}
{{- with .Values.vault }}
{{- if .enabled }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .storeName }}
  labels:
    {{- include "external-secrets-config.labels" $ | nindent 4 }}
spec:
  {{- with .namespaceSelector }}
  conditions:
    - namespaceSelector:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  provider:
    vault:
      server: {{ .server | quote }}
      path: {{ .path | quote }}
      version: {{ .version }}
      auth:
        kubernetes:
          mountPath: {{ .authMount | quote }}
          role: {{ .authRole | quote }}
          serviceAccountRef:
            name: {{ $sa.name }}
            namespace: {{ $sa.namespace }}
{{- end }}
{{- end }}
