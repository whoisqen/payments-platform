# prod eu-central-1: the pod role comes from the Pod Identity association external-secrets/external-secrets
requireResolved: true

awsSecretsManager:
  region: eu-central-1

vault:
  # The one Vault in shared-services; the auth mount is k8s-<cluster name>, set per cluster by the add-on
  server: https://vault.payments.internal:443

networkPolicy:
  awsEndpointCidrs:
    - 10.150.255.0/24
  vaultCidrs:
    - 10.140.0.0/16
