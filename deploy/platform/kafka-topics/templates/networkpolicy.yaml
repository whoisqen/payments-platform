{{- if and (include "kafka-topics.enabled" .) .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-topics
  labels:
    {{- include "kafka-topics.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka-topics
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- with .Values.networkPolicy.brokerCidrs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - {port: 9098, protocol: TCP}
    {{- end }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.podIdentityAgentCidr }}
      ports:
        - {port: 80, protocol: TCP}
{{- end }}
