{{- if include "kafka-topics.enabled" . }}
# The Pod Identity association kafka-topics/kafka-topics gives kafka-cluster:Connect, DescribeTopic and CreateTopic on the MSK cluster
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  labels:
    {{- include "kafka-topics.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
