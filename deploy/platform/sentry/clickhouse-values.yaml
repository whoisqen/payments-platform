# Values of the bitnami clickhouse chart (release `sentry-clickhouse`), the event store of Snuba: one shard, three replicas, keeper for replication.
fullnameOverride: sentry-clickhouse
global:
  security:
    allowInsecureImages: true
image:
  repository: bitnamilegacy/clickhouse
keeper:
  image:
    repository: bitnamilegacy/clickhouse-keeper
  persistence:
    size: 8Gi
shards: 1
replicaCount: 3
clusterName: default
auth:
  username: default
  existingSecret: sentry-secrets
  existingSecretKey: clickhouse-password
persistence:
  size: 200Gi
podAntiAffinityPreset: hard
pdb:
  create: true
  maxUnavailable: 1
# Server log to the console only (the image links its log files to stdout, so a file logger would print every line twice); the
# growing system log tables keep 7 days.
# Only tables the default config already enables are listed: a section here would switch a disabled one on.
configdFiles:
  90-retention.xml: |
    <clickhouse>
        <logger>
            <console>1</console>
            <log remove="1"/>
            <errorlog remove="1"/>
        </logger>
        <query_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_log>
        <query_thread_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_thread_log>
        <query_views_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_views_log>
        <part_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></part_log>
        <trace_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></trace_log>
        <metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></metric_log>
        <asynchronous_metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></asynchronous_metric_log>
        <processors_profile_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></processors_profile_log>
        <text_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></text_log>
        <query_metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_metric_log>
        <error_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></error_log>
        <latency_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></latency_log>
    </clickhouse>
