# Generated by tools/config/render_sentry.py: the credentials of Sentry and its databases, from AWS Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentry-secrets
  namespace: sentry
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: sentry-secrets
    creationPolicy: Owner
  data:
  - secretKey: system-secret-key
    remoteRef:
      key: pay/shared-services/sentry/system-secret-key
  - secretKey: admin-password
    remoteRef:
      key: pay/shared-services/sentry/admin-password
  - secretKey: postgres-password
    remoteRef:
      key: pay/shared-services/sentry/postgres-password
  - secretKey: replication-password
    remoteRef:
      key: pay/shared-services/sentry/postgres-replication-password
  - secretKey: redis-password
    remoteRef:
      key: pay/shared-services/sentry/redis-password
  - secretKey: clickhouse-password
    remoteRef:
      key: pay/shared-services/sentry/clickhouse-password
  - secretKey: launchpad-rpc-secret
    remoteRef:
      key: pay/shared-services/sentry/launchpad-rpc-secret
