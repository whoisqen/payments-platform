# Client certificate and CA of the mutual TLS to the central stack, from AWS Secrets Manager (no value in git).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-collector-tls
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: otel-collector-tls
    creationPolicy: Owner
  data:
    - {secretKey: ca.crt, remoteRef: {key: pay/shared-services/otel-collector/tls, property: ca.crt}}
    - {secretKey: tls.crt, remoteRef: {key: pay/shared-services/otel-collector/tls, property: tls.crt}}
    - {secretKey: tls.key, remoteRef: {key: pay/shared-services/otel-collector/tls, property: tls.key}}
