# The collector receives OTLP only from the platform namespaces, and sends only to the central stack and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [payments, payments-edge, control-center, locker]}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {protocol: TCP, port: 8888}
        - {protocol: TCP, port: 13133}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # The central stack is outside the cluster; the firewall of the egress path allows only its endpoints
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
