# Generated by tools/config/render_otel.py from observability/otel/collector.yaml; edit that file, not this one.
# The environment variables PLATFORM_ENV, PLATFORM_REGION and CENTRAL_* come from the add-on parameters.
mode: daemonset
fullnameOverride: otel-collector
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
command:
  name: otelcol-contrib
presets: {}
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
service:
  enabled: true
  internalTrafficPolicy: Local
extraVolumes:
- name: tls
  secret:
    secretName: otel-collector-tls
extraVolumeMounts:
- name: tls
  mountPath: /etc/otel/tls
  readOnly: true
config:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 20
    attributes/drop-secret-keys:
      actions:
      - key: authorization
        action: delete
      - key: cookie
        action: delete
      - key: set-cookie
        action: delete
      - key: x-api-key
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: card_number
        action: delete
      - key: pan
        action: delete
      - key: cvv
        action: delete
      - key: cvc
        action: delete
      - key: card_expiry
        action: delete
      - key: password
        action: delete
    transform/redact:
      error_mode: ignore
      log_statements:
      - context: log
        statements:
        - replace_pattern(body, "\\b(?:\\d[ -]?){12,18}\\d\\b", "[REDACTED-PAN]")
        - replace_pattern(body, "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]{8,}", "[REDACTED-SECRET]")
        - replace_pattern(body, "(?i)\\bbasic\\s+[A-Za-z0-9+/=]{8,}", "[REDACTED-SECRET]")
        - replace_pattern(body, "\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b", "[REDACTED-SECRET]")
        - replace_pattern(body, "\\beyJ[A-Za-z0-9_-]{5,}\\.[A-Za-z0-9_-]{5,}\\.[A-Za-z0-9_-]*", "[REDACTED-SECRET]")
        - replace_pattern(body, "-----BEGIN [A-Z ]*PRIVATE KEY-----", "[REDACTED-SECRET]")
        - replace_pattern(body, "(?i)(password|passwd|secret|api[_-]?key|token|cvv|cvc)[\"']?\\s*[:=]\\s*[\"']?[^\\s\"',;&]+", "[REDACTED-SECRET]")
        - replace_all_patterns(attributes, "value", "\\b(?:\\d[ -]?){12,18}\\d\\b", "[REDACTED-PAN]")
      trace_statements:
      - context: span
        statements:
        - replace_all_patterns(attributes, "value", "\\b(?:\\d[ -]?){12,18}\\d\\b", "[REDACTED-PAN]")
        - replace_all_patterns(attributes, "value", "(?i)\\bbearer\\s+[A-Za-z0-9._~+/=-]{8,}", "[REDACTED-SECRET]")
    redaction:
      allow_all_keys: true
      blocked_values:
      - \b(?:\d[ -]?){12,18}\d\b
      - (?i)\bbearer\s+[A-Za-z0-9._~+/=-]{8,}
      - \b(?:AKIA|ASIA)[0-9A-Z]{16}\b
      - \beyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]*
      - \b(?:sk|pk|rk)_(?:live|test)_[A-Za-z0-9]{10,}\b
      summary: info
    transform/metric-labels:
      error_mode: ignore
      metric_statements:
      - context: datapoint
        statements:
        - delete_matching_keys(attributes, "(?i)^(payment_id|customer_id|merchant_id|idempotency_key|trace_id|card.*|pan|cvv|cvc|token|authorization)$")
    k8sattributes/cell:
      filter:
        node_from_env_var: OTEL_K8S_NODE_NAME
      passthrough: false
      pod_association:
      - sources:
        - from: connection
      extract:
        metadata:
        - k8s.pod.name
        - k8s.namespace.name
        labels:
        - tag_name: cell
          key: payments-platform/cell
          from: pod
    resource/env:
      attributes:
      - key: deployment.environment.name
        value: ${env:PLATFORM_ENV}
        action: upsert
      - key: cloud.region
        value: ${env:PLATFORM_REGION}
        action: upsert
    transform/slow:
      error_mode: ignore
      trace_statements:
      - context: span
        conditions:
        - kind == SPAN_KIND_SERVER and attributes["http.route"] != nil
        statements:
        - set(attributes["request.type"], "other")
        - set(attributes["request.type"], "status") where attributes["http.method"] == "GET" and (attributes["http.route"] == "/payments/{payment_id}" or attributes["http.route"] == "/refunds/{id}")
        - set(attributes["request.type"], "create") where attributes["http.method"] == "POST" and attributes["http.route"] == "/payments"
        - set(attributes["request.type"], "confirm") where attributes["http.method"] == "POST" and attributes["http.route"] == "/payments/{payment_id}/confirm"
        - set(attributes["request.type"], "capture") where attributes["http.method"] == "POST" and attributes["http.route"] == "/payments/{payment_id}/capture"
        - set(attributes["request.type"], "refund") where attributes["http.method"] == "POST" and attributes["http.route"] == "/refunds"
        - set(attributes["slow"], true) where attributes["request.type"] == "status" and end_time_unix_nano - start_time_unix_nano > 50000000
        - set(attributes["slow"], true) where attributes["request.type"] == "create" and end_time_unix_nano - start_time_unix_nano > 1150000000
        - set(attributes["slow"], true) where attributes["request.type"] == "confirm" and end_time_unix_nano - start_time_unix_nano > 1150000000
        - set(attributes["slow"], true) where attributes["request.type"] == "capture" and end_time_unix_nano - start_time_unix_nano > 1150000000
        - set(attributes["slow"], true) where attributes["request.type"] == "refund" and end_time_unix_nano - start_time_unix_nano > 1150000000
        - set(attributes["slow"], true) where attributes["request.type"] == "other" and end_time_unix_nano - start_time_unix_nano > 300000000
    filter/route-spans:
      error_mode: ignore
      traces:
        span:
        - kind != SPAN_KIND_SERVER or attributes["http.route"] == nil
    transform/spanmetrics-labels:
      error_mode: ignore
      metric_statements:
      - context: resource
        statements:
        - keep_keys(attributes, ["service.name"])
      - context: datapoint
        statements:
        - set(attributes["service"], resource.attributes["service.name"])
        - set(attributes["route"], attributes["http.route"])
        - delete_key(attributes, "http.route")
        - delete_key(attributes, "service.name")
    tail_sampling:
      decision_wait: 10s
      num_traces: 200000
      policies:
      - name: errors
        type: status_code
        status_code:
          status_codes:
          - ERROR
      - name: slow-status
        type: and
        and:
          and_sub_policy:
          - name: route
            type: string_attribute
            string_attribute:
              key: http.route
              values:
              - /payments/{payment_id}
              - /refunds/{id}
          - name: method
            type: string_attribute
            string_attribute:
              key: http.method
              values:
              - GET
          - name: latency
            type: latency
            latency:
              threshold_ms: 50
      - name: slow-create
        type: and
        and:
          and_sub_policy:
          - name: route
            type: string_attribute
            string_attribute:
              key: http.route
              values:
              - /payments
          - name: method
            type: string_attribute
            string_attribute:
              key: http.method
              values:
              - POST
          - name: latency
            type: latency
            latency:
              threshold_ms: 1150
      - name: slow-confirm
        type: and
        and:
          and_sub_policy:
          - name: route
            type: string_attribute
            string_attribute:
              key: http.route
              values:
              - /payments/{payment_id}/confirm
          - name: method
            type: string_attribute
            string_attribute:
              key: http.method
              values:
              - POST
          - name: latency
            type: latency
            latency:
              threshold_ms: 1150
      - name: slow-capture
        type: and
        and:
          and_sub_policy:
          - name: route
            type: string_attribute
            string_attribute:
              key: http.route
              values:
              - /payments/{payment_id}/capture
          - name: method
            type: string_attribute
            string_attribute:
              key: http.method
              values:
              - POST
          - name: latency
            type: latency
            latency:
              threshold_ms: 1150
      - name: slow-refund
        type: and
        and:
          and_sub_policy:
          - name: route
            type: string_attribute
            string_attribute:
              key: http.route
              values:
              - /refunds
          - name: method
            type: string_attribute
            string_attribute:
              key: http.method
              values:
              - POST
          - name: latency
            type: latency
            latency:
              threshold_ms: 1150
      - name: slow-other
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
          - attributes["request.type"] == "other" and attributes["slow"] == true
      - name: rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 2
    batch:
      send_batch_size: 8192
      timeout: 5s
  connectors:
    forward/traces: {}
    span_metrics/slow:
      namespace: slow_requests
      histogram:
        unit: s
        explicit:
          buckets:
          - 25ms
          - 50ms
          - 100ms
          - 150ms
          - 200ms
          - 300ms
          - 500ms
          - 750ms
          - 1s
          - 1150ms
          - 1500ms
          - 2s
          - 3s
          - 5s
          - 10s
      dimensions:
      - name: http.route
      - name: cell
      - name: slow
        default: 'false'
      exclude_dimensions:
      - span.name
      - span.kind
      - status.code
      aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
      aggregation_cardinality_limit: 2000
      exemplars:
        enabled: true
        max_per_data_point: 5
      metrics_flush_interval: 15s
      metrics_expiration: 10m
    count/pan:
      logs:
        pan_detected:
          description: Log records that contained a PAN pattern before redaction
          conditions:
          - IsMatch(body, "\\b(?:\\d[ -]?){12,18}\\d\\b")
          attributes:
          - key: source
            default_value: logs
  exporters:
    otlphttp/central-logs:
      endpoint: ${env:CENTRAL_LOGS_OTLP_ENDPOINT}
      tls:
        ca_file: /etc/otel/tls/ca.crt
        cert_file: /etc/otel/tls/tls.crt
        key_file: /etc/otel/tls/tls.key
      sending_queue:
        enabled: true
        queue_size: 5000
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 30s
        max_elapsed_time: 120s
    otlp/central-traces:
      endpoint: ${env:CENTRAL_TRACES_OTLP_ENDPOINT}
      tls:
        ca_file: /etc/otel/tls/ca.crt
        cert_file: /etc/otel/tls/tls.crt
        key_file: /etc/otel/tls/tls.key
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 30s
        max_elapsed_time: 120s
    prometheusremotewrite/central:
      endpoint: ${env:CENTRAL_METRICS_REMOTE_WRITE_URL}
      tls:
        ca_file: /etc/otel/tls/ca.crt
        cert_file: /etc/otel/tls/tls.crt
        key_file: /etc/otel/tls/tls.key
      external_labels:
        env: ${env:PLATFORM_ENV}
        region: ${env:PLATFORM_REGION}
      resource_to_telemetry_conversion:
        enabled: false
    debug: null
  service:
    extensions:
    - health_check
    telemetry:
      metrics:
        level: detailed
    pipelines:
      logs/detect:
        receivers:
        - otlp
        processors:
        - memory_limiter
        exporters:
        - count/pan
      logs/ship:
        receivers:
        - otlp
        processors:
        - memory_limiter
        - attributes/drop-secret-keys
        - transform/redact
        - redaction
        - batch
        exporters:
        - otlphttp/central-logs
      traces:
        receivers:
        - otlp
        processors:
        - memory_limiter
        - k8sattributes/cell
        - resource/env
        - attributes/drop-secret-keys
        - transform/redact
        - redaction
        - transform/slow
        exporters:
        - forward/traces
      traces/sampling:
        receivers:
        - forward/traces
        processors:
        - tail_sampling
        - batch
        exporters:
        - otlp/central-traces
      traces/spanmetrics:
        receivers:
        - forward/traces
        processors:
        - filter/route-spans
        exporters:
        - span_metrics/slow
      metrics:
        receivers:
        - otlp
        - count/pan
        processors:
        - memory_limiter
        - attributes/drop-secret-keys
        - transform/metric-labels
        - redaction
        - batch
        exporters:
        - prometheusremotewrite/central
      metrics/spanmetrics:
        receivers:
        - span_metrics/slow
        processors:
        - memory_limiter
        - transform/spanmetrics-labels
        - transform/metric-labels
        - redaction
        - batch
        exporters:
        - prometheusremotewrite/central
      logs: null
