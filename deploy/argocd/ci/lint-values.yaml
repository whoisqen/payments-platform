# Offline lint and chart-testing only; real values come from tools/config/argocd-values.py
repo:
  url: https://git.example.test/acme/platform
  revision: main
cluster:
  namePrefix: acme
  region: eu-central-1
observability:
  grafanaUrl: https://grafana.example.test
central:
  metricsRemoteWriteUrl: https://metrics.example.test/insert/0/prometheus/api/v1/write
  alertmanagerHost: alertmanager.example.test
  sentryUrl: https://sentry.example.test
  dedupInterval: 30s
  logsOtlpEndpoint: https://logs.example.test:4318
  tracesOtlpEndpoint: tempo.example.test:4317
gated:
  revision: v1.0.0
pilotLight:
  - {environment: prod, region: us-east-1}
clusters:
  - {environment: shared-services, region: eu-central-1, component: central, eksName: acme-shared-services-euc1-central, inCluster: true, labels: {payments-platform/central: enabled, payments-platform/argocd: enabled, payments-platform/vpc-id: vpc-0123456789abcdef0}}
  - {environment: dev, region: eu-central-1, component: cell-0}
  - {environment: prod, region: us-east-1, component: spare, labels: {payments-platform/vault: enabled}}
