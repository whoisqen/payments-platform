apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  # Assumes add-on charts create only these cluster kinds; add a kind here when a sync reports it as not permitted
  description: Cluster add-ons from pinned upstream charts
  sourceRepos:
    - {{ .Values.repo.url }}
    - https://charts.jetstack.io
    - https://charts.external-secrets.io
    - https://kyverno.github.io/kyverno/
    - https://helm.releases.hashicorp.com
    - https://prometheus-community.github.io/helm-charts
    - https://victoriametrics.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://istio-release.storage.googleapis.com/charts
    - https://argoproj.github.io/argo-helm
    - public.ecr.aws/karpenter
    - ghcr.io/actions/actions-runner-controller-charts
  destinations:
    - server: '*'
      namespace: '*'
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding}
    - {group: scheduling.k8s.io, kind: PriorityClass}
    - {group: karpenter.sh, kind: NodePool}
    - {group: karpenter.k8s.aws, kind: EC2NodeClass}
    - {group: external-secrets.io, kind: ClusterSecretStore}
    - {group: cert-manager.io, kind: ClusterIssuer}
    - {group: kyverno.io, kind: ClusterPolicy}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: payments
  namespace: argocd
spec:
  description: Platform components; namespaced resources only, so a chart cannot create cluster roles or CRDs
  sourceRepos:
    - {{ .Values.repo.url }}
  destinations:
    - server: '*'
      namespace: payments
    - server: '*'
      namespace: payments-edge
    - server: '*'
      namespace: control-center
  clusterResourceWhitelist: []
