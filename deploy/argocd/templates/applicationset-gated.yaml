apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payments-control-center-gated
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: {{ .Values.repo.url }}
              revision: {{ $rev }}
              files:
{{- range .Values.gatedEnvironments }}
                - path: deploy/envs/{{ . }}/images.yaml
{{- end }}
          - list:
              elements:
                - region: {{ .Values.cluster.region }}
  template:
    metadata:
      name: 'payments-control-center-{{`{{ index .path.segments 2 }}`}}-{{`{{ .region }}`}}'
      labels:
        payments-platform/gated: "true"
    spec:
      project: payments
      destination:
        name: '{{ .Values.cluster.namePrefix }}-{{`{{ index .path.segments 2 }}`}}-{{`{{ regexReplaceAll "^([a-z]{2})-([a-z])[a-z]*-([0-9])$" .region "${1}${2}${3}" }}`}}-control-center'
        namespace: control-center
      sources:
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ $rev }}
          path: deploy/charts/control-center
          helm:
            valueFiles:
              - $values/deploy/envs/{{`{{ index .path.segments 2 }}`}}/{{`{{ .region }}`}}/control-center/values.yaml
            parameters:
              - name: image.digest
                value: '{{`{{ index . "control-center" "image" "digest" }}`}}'
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ $rev }}
          ref: values
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
{{- end }}
