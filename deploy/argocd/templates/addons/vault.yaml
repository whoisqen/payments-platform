apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-vault
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/vault: enabled
  template:
    metadata:
      name: 'vault-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: vault
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: vault
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://helm.releases.hashicorp.com
          chart: vault
          targetRevision: 0.34.1
          helm:
            valueFiles:
              - $values/deploy/platform/vault/values.yaml
              - $values/deploy/platform/vault/envs/{{`{{ index .metadata.labels "payments-platform/environment" }}`}}/{{`{{ index .metadata.labels "payments-platform/region" }}`}}.yaml
        # Companion chart: network policies and the objects the upstream chart cannot carry
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/vault/config
          helm:
            # A missing environment layer or digest must fail the render, not deploy placeholders
            parameters:
              - name: requireResolved
                value: "true"
            valueFiles:
              - $values/deploy/platform/vault/envs/{{`{{ index .metadata.labels "payments-platform/environment" }}`}}/{{`{{ index .metadata.labels "payments-platform/region" }}`}}.config.yaml
              - $values/deploy/envs/{{`{{ index .metadata.labels "payments-platform/environment" }}`}}/images.yaml
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
