apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-admin-gateway
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/central: enabled
  template:
    metadata:
      name: 'admin-gateway-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: admin-gateway
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: istio-ingress-admin
      source:
        # Generated by render_admin_gateway.py: Gateway, routes, grants, oauth2-proxy; objects carry their own namespaces
        repoURL: {{ .Values.repo.url }}
        targetRevision: {{ .Values.repo.revision }}
        path: deploy/platform/admin-gateway/manifests
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          # The Gateway API and cert-manager kinds may arrive in the same sync wave as their CRDs
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 5
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
