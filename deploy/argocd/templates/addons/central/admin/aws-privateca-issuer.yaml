apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-aws-privateca-issuer
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/central: enabled
  template:
    metadata:
      name: 'aws-privateca-issuer-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: aws-privateca-issuer
      annotations:
        argocd.argoproj.io/sync-wave: "-3"
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: aws-privateca-issuer
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://cert-manager.github.io/aws-privateca-issuer
          chart: aws-privateca-issuer
          targetRevision: v1.13.0
          helm:
            releaseName: aws-privateca-issuer
            valueFiles:
              - $values/deploy/platform/aws-privateca-issuer/values.yaml
        # The ClusterIssuer, generated by render_admin_gateway.py
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/aws-privateca-issuer/manifests
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # The issuer kind exists only after the chart CRDs are applied
          - SkipDryRunOnMissingResource=true
