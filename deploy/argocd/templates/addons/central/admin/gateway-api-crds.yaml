apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-gateway-api-crds
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/central: enabled
  template:
    metadata:
      name: 'gateway-api-crds-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: gateway-api-crds
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: kube-system
      source:
        # Standard channel v1.3.0, vendored unchanged; the GatewayClass istio comes from the istiod chart
        repoURL: {{ .Values.repo.url }}
        targetRevision: {{ .Values.repo.revision }}
        path: deploy/platform/gateway-api-crds
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          # The CRDs are larger than the annotation of client-side apply allows
          - ServerSideApply=true
