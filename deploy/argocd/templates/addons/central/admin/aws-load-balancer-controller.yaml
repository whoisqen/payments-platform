apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-aws-load-balancer-controller
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/central: enabled
          # The pods cannot reach the instance metadata (hop limit 1), so the VPC id must be on the cluster
          matchExpressions:
            - {key: payments-platform/vpc-id, operator: Exists}
  template:
    metadata:
      name: 'aws-load-balancer-controller-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: aws-load-balancer-controller
      annotations:
        argocd.argoproj.io/sync-wave: "-3"
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: kube-system
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://aws.github.io/eks-charts
          chart: aws-load-balancer-controller
          targetRevision: 3.6.3
          helm:
            releaseName: aws-load-balancer-controller
            valueFiles:
              - $values/deploy/platform/aws-load-balancer-controller/values.yaml
            parameters:
              - name: clusterName
                value: '{{`{{ .name }}`}}'
              - name: region
                value: {{ .Values.cluster.region | quote }}
              - name: vpcId
                value: '{{`{{ index .metadata.labels "payments-platform/vpc-id" }}`}}'
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
