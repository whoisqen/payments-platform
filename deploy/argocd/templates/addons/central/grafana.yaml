apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-grafana
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Runs once, in the central observability cluster outside the CDE
    - clusters:
        selector:
          matchLabels:
            payments-platform/central: enabled
  template:
    metadata:
      name: 'grafana-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: grafana
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: monitoring
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://grafana.github.io/helm-charts
          chart: grafana
          targetRevision: 10.5.15
          helm:
            # Fixed release name: the admin gateway routes to the Service grafana by name
            releaseName: grafana
            valueFiles:
              - $values/deploy/platform/grafana/values.yaml
              # Who may log in and with which role, generated from config access.grafana_groups
              - $values/deploy/platform/grafana/access.yaml
            parameters:
              # vmselect of the victoria-metrics add-on (release name vm); the alertmanager Service holds the cluster name
              - name: env.VM_URL
                value: 'http://vm-victoria-metrics-cluster-vmselect.victoria-metrics.svc:8481/select/0/prometheus'
              - name: env.ALERTMANAGER_URL
                value: 'http://alertmanager-{{`{{ .name }}`}}.monitoring.svc:9093'
              # The OpenSearch data source: VPC endpoint of the central domain, SigV4 in the region of the central cluster
              - name: env.OPENSEARCH_URL
                value: {{ printf "https://%s" ((.Values.central.opensearch | default dict).endpoint | default "") | quote }}
              - name: env.AWS_REGION
                value: {{ .Values.cluster.region | quote }}
              - name: grafana\.ini.server.root_url
                value: {{ .Values.observability.grafanaUrl | quote }}
        # The dashboards (one ConfigMap per folder) and the ExternalSecrets of the admin login and the OIDC client
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/grafana/manifests
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
