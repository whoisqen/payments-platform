apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-vmalert
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Runs once, in the central observability cluster outside the CDE
    - clusters:
        selector:
          matchLabels:
            payments-platform/central: enabled
  template:
    metadata:
      name: 'vmalert-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: vmalert
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: victoria-metrics
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://victoriametrics.github.io/helm-charts
          chart: victoria-metrics-alert
          targetRevision: 0.54.0
          helm:
            valueFiles:
              # Generated by tools/config/render/render_vmalert.py: the rules that look back further than the in-cluster Prometheus keeps
              - $values/deploy/platform/vmalert/values.yaml
            parameters:
              - name: server.notifier.url
                value: {{ printf "https://%s" .Values.central.alertmanagerHost | quote }}
              # Alert annotations build their links from these labels, as in the in-cluster Prometheus
              - name: server.extraArgs.external\.label[0]
                value: {{ printf "runbook_base_url=%s/blob/%s" .Values.repo.url .Values.repo.revision | quote }}
              - name: server.extraArgs.external\.label[1]
                value: {{ printf "grafana_url=%s" .Values.observability.grafanaUrl | quote }}
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
