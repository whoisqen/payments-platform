apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-alertmanager
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Runs once, in the central observability cluster outside the CDE
    - clusters:
        selector:
          matchLabels:
            payments-platform/central: enabled
  template:
    metadata:
      name: 'alertmanager-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: alertmanager
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: monitoring
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: alertmanager
          targetRevision: 2.5.1
          helm:
            valueFiles:
              # Generated by tools/config/render_central.py from observability/alertmanager
              - $values/deploy/platform/alertmanager/values.yaml
        # The ExternalSecret that provides the Slack webhook files
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/alertmanager/manifests
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
