apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-clickhouse-exporter
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # ClickHouse serves its own metrics, so only the ServiceMonitor is deployed, where a cluster is labelled for it
    - clusters:
        selector:
          matchLabels:
            payments-platform/clickhouse: enabled
  template:
    metadata:
      name: 'clickhouse-exporter-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: clickhouse-exporter
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: monitoring
      source:
        # ServiceMonitor generated by tools/config/render_exporters.py from observability/exporters/clickhouse.yaml
        repoURL: {{ .Values.repo.url }}
        targetRevision: {{ .Values.repo.revision }}
        path: deploy/platform/exporters/clickhouse/common
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
