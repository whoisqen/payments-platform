apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-postgres-exporter
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Aurora, one exporter per environment cluster
    - clusters:
        selector:
          matchLabels:
            payments-platform/addons: enabled
  template:
    metadata:
      name: 'postgres-exporter-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: postgres-exporter
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: monitoring
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: prometheus-postgres-exporter
          targetRevision: 8.3.0
          helm:
            releaseName: postgres-exporter
            valueFiles:
              - $values/observability/exporters/postgres.yaml
        # ServiceMonitor, PodMonitor and Probe generated by tools/config/render_exporters.py from the same file
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/exporters/postgres/common
        # The connection secret and the NetworkPolicy of this environment and region
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/exporters/postgres/envs/{{`{{ index .metadata.labels "payments-platform/environment" }}`}}/{{`{{ index .metadata.labels "payments-platform/region" }}`}}
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
