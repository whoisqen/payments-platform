apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-redis-exporter
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # MemoryDB
    - clusters:
        selector:
          matchLabels:
            payments-platform/addons: enabled
  template:
    metadata:
      name: 'redis-exporter-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: redis-exporter
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: monitoring
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: prometheus-redis-exporter
          targetRevision: 6.38.0
          helm:
            releaseName: redis-exporter
            valueFiles:
              - $values/observability/exporters/redis.yaml
              - $values/deploy/platform/exporters/redis/values.yaml
        # ServiceMonitor, PodMonitor and Probe generated by tools/config/render_exporters.py from the same file
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/exporters/redis/common
        # The connection secret and the NetworkPolicy of this environment and region
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/exporters/redis/envs/{{`{{ index .metadata.labels "payments-platform/environment" }}`}}/{{`{{ index .metadata.labels "payments-platform/region" }}`}}
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
