apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-blackbox-exporter
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Runs once, in the central observability cluster outside the CDE
    - clusters:
        selector:
          matchLabels:
            payments-platform/central: enabled
  template:
    metadata:
      name: 'blackbox-exporter-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: blackbox-exporter
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: monitoring
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: prometheus-blackbox-exporter
          targetRevision: 11.22.0
          helm:
            releaseName: blackbox-exporter
            valueFiles:
              - $values/observability/exporters/blackbox.yaml
              - $values/deploy/platform/exporters/blackbox/values.yaml
        # ServiceMonitor, PodMonitor and Probe generated by tools/config/render_exporters.py from the same file
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/exporters/blackbox/common
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
