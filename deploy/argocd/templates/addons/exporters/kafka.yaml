apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-kafka-exporter
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # MSK, only where a cluster is labelled for it
    - clusters:
        selector:
          matchLabels:
            payments-platform/kafka: enabled
  template:
    metadata:
      name: 'kafka-exporter-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: kafka-exporter
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: monitoring
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: prometheus-kafka-exporter
          targetRevision: 4.1.2
          helm:
            releaseName: kafka-exporter
            valueFiles:
              - $values/observability/exporters/kafka.yaml
              - $values/deploy/platform/exporters/kafka/values.yaml
            parameters:
              # The region the IAM signature is made for: the region of the cluster next to the MSK cluster
              - name: sasl.awsiam.awsRegion
                value: '{{`{{ index .metadata.labels "payments-platform/region" }}`}}'
        # ServiceMonitor, PodMonitor and Probe generated by tools/config/render_exporters.py from the same file
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/exporters/kafka/common
        # The connection secret and the NetworkPolicy of this environment and region
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/exporters/kafka/envs/{{`{{ index .metadata.labels "payments-platform/environment" }}`}}/{{`{{ index .metadata.labels "payments-platform/region" }}`}}
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
