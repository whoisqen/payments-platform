apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-otel-collector
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/addons: enabled
  template:
    metadata:
      name: 'otel-collector-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: otel-collector
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: monitoring
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
          chart: opentelemetry-collector
          targetRevision: 0.182.0
          helm:
            valueFiles:
              # Generated by tools/config/render_otel.py from observability/otel/collector.yaml
              - $values/deploy/platform/otel-collector/values.yaml
              # Container logs of the node and the Kubernetes events, through the same masking processors
              - $values/deploy/platform/otel-collector/values-logs.yaml
            parameters:
              - name: extraEnvs[0].name
                value: PLATFORM_ENV
              - name: extraEnvs[0].value
                value: '{{`{{ index .metadata.labels "payments-platform/environment" }}`}}'
              - name: extraEnvs[1].name
                value: PLATFORM_REGION
              - name: extraEnvs[1].value
                value: '{{`{{ index .metadata.labels "payments-platform/region" }}`}}'
              - name: extraEnvs[2].name
                value: CENTRAL_LOGS_OTLP_ENDPOINT
              - name: extraEnvs[2].value
                value: {{ .Values.central.logsOtlpEndpoint | quote }}
              - name: extraEnvs[3].name
                value: CENTRAL_TRACES_OTLP_ENDPOINT
              - name: extraEnvs[3].value
                value: {{ .Values.central.tracesOtlpEndpoint | quote }}
              - name: extraEnvs[4].name
                value: CENTRAL_METRICS_REMOTE_WRITE_URL
              - name: extraEnvs[4].value
                value: {{ .Values.central.metricsRemoteWriteUrl | quote }}
              - name: extraEnvs[5].name
                value: PLATFORM_CLUSTER
              - name: extraEnvs[5].value
                value: '{{`{{ .name }}`}}'
        # The NetworkPolicy of the node-local receiver
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/otel-collector/manifests
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
        # The client certificate Secret of the mutual TLS to the central stack
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/central-tls
          helm:
            parameters:
              - name: namePrefix
                value: {{ .Values.cluster.namePrefix | quote }}
              - name: secretName
                value: otel-collector-tls
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
