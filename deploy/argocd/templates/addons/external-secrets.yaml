apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/addons: enabled
  template:
    metadata:
      name: 'external-secrets-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: external-secrets
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: external-secrets
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 2.15.0
          helm:
            valueFiles:
              - $values/deploy/platform/external-secrets/values.yaml
        # Companion chart: network policies and the objects the upstream chart cannot carry
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/external-secrets/config
          helm:
            # A missing environment layer or digest must fail the render, not deploy placeholders
            parameters:
              - name: requireResolved
                value: "true"
              # Every cluster logs in to the central Vault on its own jwt mount; the central cluster runs Vault and uses its local mount
              - name: vault.authMount
                value: '{{`{{ if eq (index .metadata.labels "payments-platform/environment") "shared-services" }}kubernetes{{ else }}k8s-{{ .name }}{{ end }}`}}'

            valueFiles:
              - $values/deploy/platform/external-secrets/envs/{{`{{ index .metadata.labels "payments-platform/environment" }}`}}/{{`{{ index .metadata.labels "payments-platform/region" }}`}}.yaml
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
