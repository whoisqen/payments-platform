apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-aws-load-balancer-controller
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          # Every cluster that serves a Gateway: central, edge, control-center, cells and locker
          matchLabels:
            payments-platform/gateway: enabled
  template:
    metadata:
      name: 'aws-load-balancer-controller-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: aws-load-balancer-controller
      annotations:
        argocd.argoproj.io/sync-wave: "-3"
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: kube-system
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://aws.github.io/eks-charts
          chart: aws-load-balancer-controller
          targetRevision: 3.6.3
          helm:
            releaseName: aws-load-balancer-controller
            valueFiles:
              - $values/deploy/platform/aws-load-balancer-controller/values.yaml
            parameters:
              # The EKS name, which differs from the Argo CD name for the cells (eks-cell-0 against cell-0)
              - name: clusterName
                value: '{{`{{ or (index .metadata.annotations "payments-platform/eks-cluster-name") .name }}`}}'
              - name: region
                value: '{{`{{ index .metadata.labels "payments-platform/region" }}`}}'
              # The pods cannot reach the instance metadata (hop limit 1): the controller finds its VPC by the Name tag the vpc module
              # sets, <prefix>-<environment>-<region short>-vpc
              - name: vpcTags.Name
                value: '{{ .Values.cluster.namePrefix }}-{{`{{ index .metadata.labels "payments-platform/environment" }}-{{ regexReplaceAll "^([a-z]{2})-([a-z])[a-z]*-([0-9])$" (index .metadata.labels "payments-platform/region") "${1}${2}${3}" }}`}}-vpc'
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
