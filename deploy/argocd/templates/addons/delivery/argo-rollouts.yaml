apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-argo-rollouts
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/addons: enabled
  template:
    metadata:
      name: 'argo-rollouts-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: argo-rollouts
      annotations:
        # The Rollout CRDs exist before any service Application syncs a canary
        argocd.argoproj.io/sync-wave: "-3"
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: argo-rollouts
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://argoproj.github.io/argo-helm
          chart: argo-rollouts
          targetRevision: 2.43.12
          helm:
            valueFiles:
              - $values/deploy/platform/argo-rollouts/values.yaml
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
