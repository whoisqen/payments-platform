apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-argocd
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/argocd: enabled
  template:
    metadata:
      name: 'argocd-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: argocd
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: argocd
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://argoproj.github.io/argo-helm
          chart: argo-cd
          targetRevision: 10.18.2
          helm:
            valueFiles:
              - $values/deploy/platform/argocd/values.yaml
              # Hands the notifications config map and secret to the smoke notifications chart
              - $values/deploy/platform/smoke/notifications/argocd-values.yaml
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
        # Smoke notifications: GitHub dispatch on a green smoke (dev, stage), Alertmanager on a failed one
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/smoke/notifications
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
