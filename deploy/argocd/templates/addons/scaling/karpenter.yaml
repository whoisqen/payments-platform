apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-karpenter
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  payments-platform/addons: enabled
          # The CRD chart is separate so that CRDs follow the controller version on upgrade
          - list:
              elements:
                - chart: karpenter-crd
                  wave: "-1"
                - chart: karpenter
                  wave: "0"
  template:
    metadata:
      name: '{{`{{ .chart }}`}}-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: karpenter
      annotations:
        argocd.argoproj.io/sync-wave: '{{`{{ .wave }}`}}'
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: kube-system
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: public.ecr.aws/karpenter
          chart: '{{`{{ .chart }}`}}'
          targetRevision: 1.15.3
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/deploy/platform/karpenter/values-{{`{{ .chart }}`}}.yaml
            parameters:
              # The EKS name, which differs from the Argo CD name for the cells (eks-cell-0 against cell-0)
              - name: settings.clusterName
                value: '{{`{{ or (index .metadata.annotations "payments-platform/eks-cluster-name") .name }}`}}'
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
