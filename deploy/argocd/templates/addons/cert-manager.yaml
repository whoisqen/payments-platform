apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-cert-manager
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/addons: enabled
  template:
    metadata:
      name: 'cert-manager-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: cert-manager
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: cert-manager
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://charts.jetstack.io
          chart: cert-manager
          targetRevision: v1.21.3
          helm:
            valueFiles:
              - $values/deploy/platform/cert-manager/values.yaml
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
