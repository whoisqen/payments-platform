apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-kube-prometheus
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            payments-platform/addons: enabled
  template:
    metadata:
      name: 'kube-prometheus-{{`{{ .name }}`}}'
      labels:
        payments-platform/addon: kube-prometheus
    spec:
      project: platform
      destination:
        server: '{{`{{ .server }}`}}'
        namespace: monitoring
      sources:
        # The upstream chart version is pinned here and bumped by Renovate
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-prometheus-stack
          targetRevision: 93.6.1
          helm:
            valueFiles:
              - $values/deploy/platform/kube-prometheus/values.yaml
            # Alert annotations build their links from these labels, see observability/alerts
            parameters:
              - name: prometheus.prometheusSpec.externalLabels.runbook_base_url
                value: {{ printf "%s/blob/%s" .Values.repo.url .Values.repo.revision | quote }}
              # Which environment and region an alert comes from: inhibition by region and the grouping of the Alertmanager need them
              - name: prometheus.prometheusSpec.externalLabels.env
                value: '{{`{{ index .metadata.labels "payments-platform/environment" }}`}}'
              - name: prometheus.prometheusSpec.externalLabels.region
                value: '{{`{{ index .metadata.labels "payments-platform/region" }}`}}'
              - name: prometheus.prometheusSpec.externalLabels.grafana_url
                value: {{ .Values.observability.grafanaUrl | quote }}
              # Both replicas push every sample to the central store, which keeps one of each pair; their alerts go to its Alertmanager cluster.
              # Scalars rendered into the lists of the values file: a list index here would replace the queue and TLS settings of the entry
              - name: platform.remoteWriteUrl
                value: {{ .Values.central.metricsRemoteWriteUrl | quote }}
              - name: platform.alertmanagerHost
                value: {{ .Values.central.alertmanagerHost | quote }}
              # The EBS key of the cluster account, by alias: alias/<prefix>-<env>-<region-short>-ebs-nodes
              - name: platform.ebsKmsKeyId
                value: 'alias/{{ .Values.cluster.namePrefix }}-{{`{{ index .metadata.labels "payments-platform/environment" }}`}}-{{`{{ regexReplaceAll "^([a-z]{2})-([a-z])[a-z]*-([0-9])$" (index .metadata.labels "payments-platform/region") "${1}${2}${3}" }}`}}-ebs-nodes'
        # The alert rules and the SLO rules. The rules that look back further than this Prometheus keeps are not here: the long-lookback alerts
        # are evaluated twice (harmlessly empty here) and the SLO windows of 3 and 30 days are in slo/generated/central, run by vmalert
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: observability/alerts
          directory:
            recurse: true
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: observability/slo/generated
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
        # The client certificate Secret of the mutual TLS to the central stack
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/central-tls
          helm:
            parameters:
              - name: namePrefix
                value: {{ .Values.cluster.namePrefix | quote }}
              - name: secretName
                value: prometheus-central-tls
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # The CRDs exceed the client-side apply annotation limit
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # The rules arrive in the same sync as the CRDs of their kind
          - SkipDryRunOnMissingResource=true
