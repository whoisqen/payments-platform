apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payments-cells
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # One Application per environment x region x cell directory
    - git:
        repoURL: {{ .Values.repo.url }}
        revision: {{ .Values.repo.revision }}
        directories:
          - path: deploy/envs/*/*/cell-*
          - path: deploy/envs/*/*/spare
{{- range .Values.gatedEnvironments }}
          - path: deploy/envs/{{ . }}/*/*
            exclude: true
{{- end }}
{{- range .Values.pilotLight }}
          - path: deploy/envs/{{ .environment }}/{{ .region }}/*
            exclude: true
{{- end }}
  # Migrations and rollouts go cell-0 first: a bad migration stops there (section 17)
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: payments-platform/cell
              operator: In
              values: [cell-0]
        - matchExpressions:
            - key: payments-platform/cell
              operator: In
              values: [cell-1]
        - matchExpressions:
            - key: payments-platform/cell
              operator: In
              values: [cell-2]
        - matchExpressions:
            - key: payments-platform/cell
              operator: In
              values: [cell-3]
        # The spare goes last on its own: its healthy sync dispatches the environment's smoke-green event
        - matchExpressions:
            - key: payments-platform/cell
              operator: In
              values: [spare]
  template:
    metadata:
      name: 'payments-cell-{{`{{ index .path.segments 2 }}`}}-{{`{{ index .path.segments 3 }}`}}-{{`{{ .path.basename }}`}}'
      labels:
        payments-platform/cell: '{{`{{ .path.basename }}`}}'
        payments-platform/environment: '{{`{{ index .path.segments 2 }}`}}'
    spec:
      project: payments
      destination:
        name: '{{ .Values.cluster.namePrefix }}-{{`{{ index .path.segments 2 }}`}}-{{`{{ regexReplaceAll "^([a-z]{2})-([a-z])[a-z]*-([0-9])$" (index .path.segments 3) "${1}${2}${3}" }}`}}-{{`{{ .path.basename }}`}}'
        namespace: payments
      sources:
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/charts/payments-cell
          helm:
            # Layers: environment, region, cell, then the digests written by CI
            valueFiles:
              - $values/deploy/envs/{{`{{ index .path.segments 2 }}`}}/values.yaml
              - $values/deploy/envs/{{`{{ index .path.segments 2 }}`}}/{{`{{ index .path.segments 3 }}`}}/values.yaml
              - $values/deploy/envs/{{`{{ index .path.segments 2 }}`}}/{{`{{ index .path.segments 3 }}`}}/{{`{{ .path.basename }}`}}/values.yaml
              - $values/deploy/envs/{{`{{ index .path.segments 2 }}`}}/images.yaml
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
        # The PostSync smoke Job of the cell; last so the indices above stay stable. The chart renders no object
        # (so no hook) until images.yaml carries a real images.smoke digest; the ApplicationSet cannot read file contents without a files generator
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/platform/smoke/job
          helm:
            valueFiles:
              - $values/deploy/envs/{{`{{ index .path.segments 2 }}`}}/values.yaml
              - $values/deploy/envs/{{`{{ index .path.segments 2 }}`}}/images.yaml
            parameters:
              - name: global.cell
                value: '{{`{{ .path.basename }}`}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
