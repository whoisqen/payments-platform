apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payments-control-center
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # The digest of a chart that is not an umbrella is read from images.yaml and passed as a parameter
    - matrix:
        generators:
          - git:
              repoURL: {{ .Values.repo.url }}
              revision: {{ .Values.repo.revision }}
              files:
                - path: deploy/envs/*/images.yaml
{{- range .Values.gatedEnvironments }}
                - path: deploy/envs/{{ . }}/images.yaml
                  exclude: true
{{- end }}
          - list:
              elements:
                - region: {{ .Values.cluster.region }}
  template:
    metadata:
      name: 'payments-control-center-{{`{{ index .path.segments 2 }}`}}-{{`{{ .region }}`}}'
    spec:
      project: payments
      destination:
        name: '{{ .Values.cluster.namePrefix }}-{{`{{ index .path.segments 2 }}`}}-{{`{{ regexReplaceAll "^([a-z]{2})-([a-z])[a-z]*-([0-9])$" (index .path.segments 3) "${1}${2}${3}" }}`}}-control-center'
        namespace: control-center
      sources:
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/charts/control-center
          helm:
            valueFiles:
              - $values/deploy/envs/{{`{{ index .path.segments 2 }}`}}/{{`{{ .region }}`}}/control-center/values.yaml
            parameters:
              - name: image.digest
                value: '{{`{{ index . "control-center" "image" "digest" }}`}}'
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
