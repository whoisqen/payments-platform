apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payments-locker
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ .Values.repo.url }}
        revision: {{ .Values.repo.revision }}
        directories:
          - path: deploy/envs/*/*/locker
{{- range .Values.gatedEnvironments }}
          - path: deploy/envs/{{ . }}/*/*
            exclude: true
{{- end }}
{{- range .Values.pilotLight }}
          - path: deploy/envs/{{ .environment }}/{{ .region }}/*
            exclude: true
{{- end }}
  template:
    metadata:
      name: 'payments-locker-{{`{{ index .path.segments 2 }}`}}-{{`{{ index .path.segments 3 }}`}}'
    spec:
      project: payments
      destination:
        name: '{{ .Values.cluster.namePrefix }}-{{`{{ index .path.segments 2 }}`}}-{{`{{ regexReplaceAll "^([a-z]{2})-([a-z])[a-z]*-([0-9])$" (index .path.segments 3) "${1}${2}${3}" }}`}}-locker'
        namespace: payments
      sources:
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: deploy/charts/payments-locker
          helm:
            valueFiles:
              - $values/deploy/envs/{{`{{ index .path.segments 2 }}`}}/{{`{{ index .path.segments 3 }}`}}/locker/values.yaml
              - $values/deploy/envs/{{`{{ index .path.segments 2 }}`}}/images.yaml
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
