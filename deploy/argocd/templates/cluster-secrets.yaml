{{- $cs := .Values.clusterSecrets }}
{{- $prefix := .Values.cluster.namePrefix }}
{{- range .Values.clusters }}
{{- $name := include "argocd-bootstrap.clusterName" (dict "prefix" $prefix "cluster" .) }}
{{- $eks := .eksName | default (include "argocd-bootstrap.clusterName" (dict "prefix" $prefix "cluster" (merge (dict "component" (printf "eks-%s" .component)) (omit . "component")))) }}
{{- $labels := merge (dict "argocd.argoproj.io/secret-type" "cluster" "payments-platform/environment" .environment "payments-platform/region" .region "payments-platform/component" .component) (.labels | default dict) (dict "payments-platform/addons" "enabled" "payments-platform/gateway" "enabled") }}
{{- $annotations := dict "payments-platform/eks-cluster-name" $eks }}
{{- if .inCluster }}
---
# Argo CD cluster Secret of {{ $name }}, the cluster Argo CD runs in: no credentials, so it exists before External Secrets does
apiVersion: v1
kind: Secret
metadata:
  name: cluster-{{ $name }}
  namespace: {{ $cs.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
type: Opaque
stringData:
  name: {{ $name }}
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
{{- else }}
---
# Argo CD cluster Secret of {{ $name }}: Terraform writes {name, server, caData, roleARN} to Secrets Manager of shared-services
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-{{ $name }}
  namespace: {{ $cs.namespace }}
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  refreshInterval: {{ $cs.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $cs.secretStore }}
  target:
    name: cluster-{{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          {{- toYaml $labels | nindent 10 }}
        # The add-ons that call AWS (Karpenter, the load balancer controller) need the EKS name
        annotations:
          {{- toYaml $annotations | nindent 10 }}
      data:
        # The name the ApplicationSets address; clusterName (EKS) and the rest come from the Terraform secret (infra/modules/argocd-registration)
        name: {{ $name }}
        server: '{{`{{ .server }}`}}'
        config: '{"awsAuthConfig":{"clusterName":"{{`{{ .clusterName }}`}}","roleARN":"{{`{{ .roleARN }}`}}"},"tlsClientConfig":{"insecure":false,"caData":"{{`{{ .caData }}`}}"}}'
  dataFrom:
    - extract:
        key: {{ $prefix }}/argocd/clusters/{{ $name }}
{{- end }}
{{- end }}
