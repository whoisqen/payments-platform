apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payments-locker
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/whoisqen/payments-platform
        revision: main
        directories:
          - path: deploy/envs/*/*/locker
  template:
    metadata:
      name: 'payments-locker-{{ index .path.segments 2 }}-{{ index .path.segments 3 }}'
    spec:
      project: payments
      destination:
        name: 'pay-{{ index .path.segments 2 }}-euc1-locker'
        namespace: payments
      sources:
        - repoURL: https://github.com/whoisqen/payments-platform
          targetRevision: main
          path: deploy/charts/payments-locker
          helm:
            valueFiles:
              - $values/deploy/envs/{{ index .path.segments 2 }}/{{ index .path.segments 3 }}/locker/values.yaml
              - $values/deploy/envs/{{ index .path.segments 2 }}/images.yaml
        - repoURL: https://github.com/whoisqen/payments-platform
          targetRevision: main
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
