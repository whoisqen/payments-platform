apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payments-control-center
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # The digest of a chart that is not an umbrella is read from images.yaml and passed as a parameter
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/whoisqen/payments-platform
              revision: main
              files:
                - path: deploy/envs/*/images.yaml
          - list:
              elements:
                - region: eu-central-1
  template:
    metadata:
      name: 'payments-control-center-{{ index .path.segments 2 }}-{{ .region }}'
    spec:
      project: payments
      destination:
        name: 'pay-{{ index .path.segments 2 }}-euc1-control-center'
        namespace: control-center
      sources:
        - repoURL: https://github.com/whoisqen/payments-platform
          targetRevision: main
          path: deploy/charts/control-center
          helm:
            valueFiles:
              - $values/deploy/envs/{{ index .path.segments 2 }}/{{ .region }}/control-center/values.yaml
            parameters:
              - name: image.digest
                value: '{{ index . "control-center" "image" "digest" }}'
        - repoURL: https://github.com/whoisqen/payments-platform
          targetRevision: main
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
