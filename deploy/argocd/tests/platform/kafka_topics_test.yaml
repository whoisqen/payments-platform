suite: the kafka-topics add-on runs next to the MSK cluster
templates:
  - addons/data/kafka-topics.yaml
set:
  repo.url: https://git.example.test/acme/platform
  repo.revision: main
  cluster.namePrefix: acme
  cluster.region: eu-central-1
  observability.grafanaUrl: https://grafana.example.test
  central.metricsRemoteWriteUrl: https://metrics.example.test/insert/0/prometheus/api/v1/write
  central.alertmanagerHost: alertmanager.example.test
  central.sentryUrl: https://sentry.example.test
  central.dedupInterval: 30s
  central.logsOtlpEndpoint: https://logs.example.test:4318
  central.tracesOtlpEndpoint: tempo.example.test:4317
tests:
  - it: selects the cluster labelled for Kafka and layers the environment file
    asserts:
      - equal:
          path: spec.generators[0].clusters.selector.matchLabels
          value: {payments-platform/kafka: enabled}
      - equal:
          path: spec.template.spec.sources[0].path
          value: deploy/platform/kafka-topics
      - equal:
          path: spec.template.spec.sources[0].helm.valueFiles[0]
          value: '$values/deploy/envs/{{ index .metadata.labels "payments-platform/environment" }}/images.yaml'
      - equal:
          path: spec.template.spec.sources[0].helm.valueFiles[1]
          value: '$values/deploy/platform/kafka-topics/envs/{{ index .metadata.labels "payments-platform/environment" }}/{{ index .metadata.labels "payments-platform/region" }}.yaml'
      - equal:
          path: spec.template.spec.syncPolicy.automated.prune
          value: false
