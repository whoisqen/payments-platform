suite: repository and cluster names come from values
templates:
  - applicationset-cells.yaml
  - addons/kube-prometheus.yaml
set:
  repo.url: https://git.example.test/acme/platform
  repo.revision: release
  cluster.namePrefix: acme
  cluster.region: us-east-1
  observability.grafanaUrl: https://grafana.example.test
  central.metricsRemoteWriteUrl: https://metrics.example.test/insert/0/prometheus/api/v1/write
  central.alertmanagerHost: alertmanager.example.test
  central.dedupInterval: 30s
  central.logsOtlpEndpoint: https://logs.example.test:4318
  central.tracesOtlpEndpoint: tempo.example.test:4317
tests:
  - it: reads the generator and chart repository and revision from values
    template: applicationset-cells.yaml
    asserts:
      - equal:
          path: spec.generators[0].git.repoURL
          value: https://git.example.test/acme/platform
      - equal:
          path: spec.generators[0].git.revision
          value: release
      - equal:
          path: spec.template.spec.sources[0].repoURL
          value: https://git.example.test/acme/platform
  - it: builds the destination cluster name from the prefix and the region directory
    template: applicationset-cells.yaml
    asserts:
      - equal:
          path: spec.template.spec.destination.name
          value: 'acme-{{ index .path.segments 2 }}-{{ regexReplaceAll "^([a-z]{2})-([a-z])[a-z]*-([0-9])$" (index .path.segments 3) "${1}${2}${3}" }}-{{ .path.basename }}'
  - it: gives Prometheus the runbook and Grafana bases as external labels
    template: addons/kube-prometheus.yaml
    asserts:
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: prometheus.prometheusSpec.externalLabels.runbook_base_url
            value: https://git.example.test/acme/platform/blob/release
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: prometheus.prometheusSpec.externalLabels.grafana_url
            value: https://grafana.example.test
  - it: tells every alert which environment and region it comes from
    template: addons/kube-prometheus.yaml
    asserts:
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: prometheus.prometheusSpec.externalLabels.env
            value: '{{ index .metadata.labels "payments-platform/environment" }}'
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: prometheus.prometheusSpec.externalLabels.region
            value: '{{ index .metadata.labels "payments-platform/region" }}'
  - it: fails when the repository is not set
    template: applicationset-cells.yaml
    set:
      repo.url: ""
    asserts:
      - failedTemplate: {}
