suite: repository and cluster names come from values
templates:
  - applicationset-cells.yaml
  - addons/kube-prometheus.yaml
  - addons/arc.yaml
set:
  repo.url: https://git.example.test/acme/platform
  repo.revision: release
  cluster.namePrefix: acme
  cluster.regionShort: use1
  cluster.region: us-east-1
  github.configUrl: https://git.example.test/acme
  observability.grafanaUrl: https://grafana.example.test
  arc.scaleSets: [ci-build, ci-test]
tests:
  - it: reads the generator and chart repository and revision from values
    template: applicationset-cells.yaml
    asserts:
      - equal:
          path: spec.generators[0].git.repoURL
          value: https://git.example.test/acme/platform
      - equal:
          path: spec.generators[0].git.revision
          value: release
      - equal:
          path: spec.template.spec.sources[0].repoURL
          value: https://git.example.test/acme/platform
  - it: builds the destination cluster name from the prefix and region short
    template: applicationset-cells.yaml
    asserts:
      - equal:
          path: spec.template.spec.destination.name
          value: "acme-{{ index .path.segments 2 }}-use1-{{ .path.basename }}"
  - it: gives Prometheus the runbook and Grafana bases as external labels
    template: addons/kube-prometheus.yaml
    asserts:
      - equal:
          path: spec.template.spec.sources[0].helm.parameters[0].value
          value: https://git.example.test/acme/platform/blob/release
      - equal:
          path: spec.template.spec.sources[0].helm.parameters[1].value
          value: https://grafana.example.test
  - it: fails when the repository is not set
    template: applicationset-cells.yaml
    set:
      repo.url: ""
    asserts:
      - failedTemplate: {}
  - it: creates one runner Application per scale set from values
    template: addons/arc.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: spec.generators[0].matrix.generators[1].list.elements
          value:
            - scaleSet: ci-build
            - scaleSet: ci-test
