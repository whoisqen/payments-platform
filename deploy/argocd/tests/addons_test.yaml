suite: vault and external-secrets add-ons
set:
  repo.url: https://git.example.test/acme/platform
  repo.revision: release
  cluster.namePrefix: acme
  cluster.region: us-east-1
  observability.grafanaUrl: https://grafana.example.test
  central.metricsRemoteWriteUrl: https://metrics.example.test/insert/0/prometheus/api/v1/write
  central.alertmanagerHost: alertmanager.example.test
  central.dedupInterval: 30s
  central.logsOtlpEndpoint: https://logs.example.test:4318
  central.tracesOtlpEndpoint: tempo.example.test:4317
tests:
  - it: layers the vault values by environment and region from the cluster labels
    template: addons/vault.yaml
    asserts:
      - equal:
          path: spec.template.spec.sources[0].helm.valueFiles[1]
          value: '$values/deploy/platform/vault/envs/{{ index .metadata.labels "payments-platform/environment" }}/{{ index .metadata.labels "payments-platform/region" }}.yaml'
  - it: adds the vault config chart as its own source with the digest file and strict resolution
    template: addons/vault.yaml
    asserts:
      - equal:
          path: spec.template.spec.sources[1].path
          value: deploy/platform/vault/config
      - equal:
          path: spec.template.spec.sources[1].helm.valueFiles[0]
          value: '$values/deploy/platform/vault/envs/{{ index .metadata.labels "payments-platform/environment" }}/{{ index .metadata.labels "payments-platform/region" }}.config.yaml'
      - equal:
          path: spec.template.spec.sources[1].helm.valueFiles[1]
          value: '$values/deploy/envs/{{ index .metadata.labels "payments-platform/environment" }}/images.yaml'
      - equal:
          path: spec.template.spec.sources[1].helm.parameters[0].value
          value: "true"
      - equal:
          path: spec.template.spec.sources[2].ref
          value: values
  - it: adds the external-secrets config chart with the environment layer
    template: addons/external-secrets.yaml
    asserts:
      - equal:
          path: spec.template.spec.sources[1].path
          value: deploy/platform/external-secrets/config
      - equal:
          path: spec.template.spec.sources[1].helm.valueFiles[0]
          value: '$values/deploy/platform/external-secrets/envs/{{ index .metadata.labels "payments-platform/environment" }}/{{ index .metadata.labels "payments-platform/region" }}.yaml'
      - equal:
          path: spec.template.spec.sources[2].ref
          value: values
