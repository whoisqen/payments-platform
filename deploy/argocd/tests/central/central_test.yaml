suite: the central stack deduplicates, replicates and receives what the clusters send
templates:
  - addons/kube-prometheus.yaml
  - addons/central/victoria-metrics.yaml
  - addons/central/alertmanager.yaml
  - addons/central/vmalert.yaml
  - addons/central/sentry.yaml
set:
  repo.url: https://git.example.test/acme/platform
  repo.revision: main
  cluster.namePrefix: acme
  cluster.region: eu-central-1
  cluster.regionShort: euc1
  observability.grafanaUrl: https://grafana.example.test
  central.metricsRemoteWriteUrl: https://metrics.example.test/insert/0/prometheus/api/v1/write
  central.alertmanagerHost: alertmanager.example.test
  central.sentryUrl: https://sentry.example.test
  central.dedupInterval: 45s
  central.logsOtlpEndpoint: https://logs.example.test:4318
  central.tracesOtlpEndpoint: tempo.example.test:4317
tests:
  - it: sends every sample of Prometheus to the central store
    template: addons/kube-prometheus.yaml
    asserts:
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: platform.remoteWriteUrl
            value: https://metrics.example.test/insert/0/prometheus/api/v1/write
      - notContains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: prometheus.prometheusSpec.remoteWrite[0].url
            value: https://metrics.example.test/insert/0/prometheus/api/v1/write
  - it: sends the alerts of Prometheus to the central Alertmanager
    template: addons/kube-prometheus.yaml
    asserts:
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: platform.alertmanagerHost
            value: alertmanager.example.test
  - it: encrypts the Prometheus volumes with the EBS key alias of the cluster account
    template: addons/kube-prometheus.yaml
    asserts:
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: platform.ebsKmsKeyId
            value: 'alias/acme-{{ index .metadata.labels "payments-platform/environment" }}-{{ regexReplaceAll "^([a-z]{2})-([a-z])[a-z]*-([0-9])$" (index .metadata.labels "payments-platform/region") "${1}${2}${3}" }}-ebs-nodes'
  - it: adds the client certificate of the mutual TLS as the last source
    template: addons/kube-prometheus.yaml
    asserts:
      - equal:
          path: spec.template.spec.sources[4].path
          value: deploy/platform/kube-prometheus/manifests
  - it: switches deduplication on in the query and storage nodes with the configured interval
    template: addons/central/victoria-metrics.yaml
    asserts:
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: vmselect.extraArgs.dedup\.minScrapeInterval
            value: 45s
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: vmstorage.extraArgs.dedup\.minScrapeInterval
            value: 45s
  - it: runs the central add-ons only in the central cluster
    template: addons/central/victoria-metrics.yaml
    asserts:
      - equal:
          path: spec.generators[0].clusters.selector.matchLabels["payments-platform/central"]
          value: enabled
  - it: gives the Alertmanager its generated values and the secret manifests
    template: addons/central/alertmanager.yaml
    asserts:
      - equal:
          path: spec.template.spec.sources[0].helm.valueFiles[0]
          value: $values/deploy/platform/alertmanager/values.yaml
      - equal:
          path: spec.template.spec.sources[1].path
          value: deploy/platform/alertmanager/manifests
  - it: loads the alert and SLO rules into Prometheus
    template: addons/kube-prometheus.yaml
    asserts:
      - contains:
          path: spec.template.spec.sources
          content:
            repoURL: https://git.example.test/acme/platform
            targetRevision: main
            path: observability/slo/generated
      - contains:
          path: spec.template.spec.sources
          content:
            repoURL: https://git.example.test/acme/platform
            targetRevision: main
            path: observability/alerts
            directory:
              recurse: true
  - it: runs the long-lookback rules in vmalert against the central Alertmanager
    template: addons/central/vmalert.yaml
    asserts:
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: server.notifier.url
            value: https://alertmanager.example.test
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: server.extraArgs.external\.label[0]
            value: runbook_base_url=https://git.example.test/acme/platform/blob/main
  - it: runs Sentry in the central cluster only, from pinned charts, at the configured url
    template: addons/central/sentry.yaml
    asserts:
      - equal:
          path: spec.generators[0].clusters.selector.matchLabels["payments-platform/central"]
          value: enabled
      - equal:
          path: spec.template.spec.sources[0].targetRevision
          value: 36.1.0
      - equal:
          path: spec.template.spec.sources[1].chart
          value: clickhouse
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: system.url
            value: https://sentry.example.test
