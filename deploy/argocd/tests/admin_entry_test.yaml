suite: the admin entry add-ons run in the central cluster only
templates:
  - addons/central/gateway-api-crds.yaml
  - addons/central/aws-load-balancer-controller.yaml
  - addons/central/aws-privateca-issuer.yaml
  - addons/central/admin-gateway.yaml
set:
  repo.url: https://git.example.test/acme/platform
  repo.revision: main
  cluster.namePrefix: acme
  cluster.region: eu-central-1
  cluster.regionShort: euc1
  observability.grafanaUrl: https://grafana.example.test
  central.metricsRemoteWriteUrl: https://metrics.example.test/insert/0/prometheus/api/v1/write
  central.alertmanagerHost: alertmanager.example.test
  central.sentryUrl: https://sentry.example.test
  central.dedupInterval: 45s
  central.logsOtlpEndpoint: https://logs.example.test:4318
  central.tracesOtlpEndpoint: tempo.example.test:4317
tests:
  - it: selects the central cluster for every add-on
    asserts:
      - equal:
          path: spec.generators[0].clusters.selector.matchLabels["payments-platform/central"]
          value: enabled
  - it: applies the Gateway API CRDs from the vendored directory with server-side apply and never prunes them
    template: addons/central/gateway-api-crds.yaml
    asserts:
      - equal:
          path: spec.template.spec.source.path
          value: deploy/platform/gateway-api-crds
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: ServerSideApply=true
      - equal:
          path: spec.template.spec.syncPolicy.automated.prune
          value: false
  - it: orders the CRDs before the controller
    template: addons/central/gateway-api-crds.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-5"
  - it: gives the load balancer controller the cluster, region and VPC without an IRSA annotation
    template: addons/central/aws-load-balancer-controller.yaml
    asserts:
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: region
            value: eu-central-1
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: vpcId
            value: '{{ index .metadata.labels "payments-platform/vpc-id" }}'
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: {key: payments-platform/vpc-id, operator: Exists}
  - it: installs the private CA issuer chart with the generated ClusterIssuer
    template: addons/central/aws-privateca-issuer.yaml
    asserts:
      - equal:
          path: spec.template.spec.sources[1].path
          value: deploy/platform/aws-privateca-issuer/manifests
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: SkipDryRunOnMissingResource=true
  - it: syncs the admin gateway manifests into the gateway namespace
    template: addons/central/admin-gateway.yaml
    asserts:
      - equal:
          path: spec.template.spec.source.path
          value: deploy/platform/admin-gateway/manifests
      - equal:
          path: spec.template.spec.destination.namespace
          value: istio-ingress-admin
