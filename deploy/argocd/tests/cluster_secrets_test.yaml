suite: Argo CD cluster Secrets from Secrets Manager
templates:
  - cluster-secrets.yaml
set:
  repo.url: https://git.example.test/acme/platform
  repo.revision: main
  cluster.namePrefix: acme
  cluster.region: eu-central-1
  observability.grafanaUrl: https://grafana.example.test
  central.metricsRemoteWriteUrl: https://metrics.example.test/insert/0/prometheus/api/v1/write
  central.alertmanagerHost: alertmanager.example.test
  central.sentryUrl: https://sentry.example.test
  central.dedupInterval: 30s
  central.logsOtlpEndpoint: https://logs.example.test:4318
  central.tracesOtlpEndpoint: tempo.example.test:4317
  clusters:
    - {environment: dev, region: eu-central-1, component: cell-0}
    - {environment: stage, region: us-east-1, component: spare, labels: {payments-platform/vault: enabled}}
    - {environment: shared-services, region: eu-central-1, component: central, labels: {payments-platform/central: enabled, payments-platform/argocd: enabled}}
tests:
  - it: renders nothing without clusters
    set:
      clusters: []
    asserts:
      - hasDocuments:
          count: 0
  - it: renders one ExternalSecret per cluster in the Argo CD namespace
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.namespace
          value: argocd
      - equal:
          path: spec.secretStoreRef
          value: {kind: ClusterSecretStore, name: aws-secrets-manager}
  - it: names the cluster as the ApplicationSets address it, with the region short name
    asserts:
      - equal:
          path: spec.target.template.data.name
          value: acme-dev-euc1-cell-0
        documentIndex: 0
      - equal:
          path: spec.target.template.data.name
          value: acme-stage-use1-spare
        documentIndex: 1
      - equal:
          path: spec.target.name
          value: cluster-acme-stage-use1-spare
        documentIndex: 1
  - it: reads the Terraform secret of the cluster under the name prefix
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: acme/argocd/clusters/acme-dev-euc1-cell-0
        documentIndex: 0
      - equal:
          path: spec.dataFrom[0].extract.key
          value: acme/argocd/clusters/acme-shared-services-euc1-central
        documentIndex: 2
  - it: builds the Argo CD connection with IAM authentication and the cluster CA
    documentIndex: 0
    asserts:
      - equal:
          path: spec.target.template.engineVersion
          value: v2
      - equal:
          path: spec.target.template.data.server
          value: '{{ .server }}'
      - equal:
          path: spec.target.template.data.config
          value: '{"awsAuthConfig":{"clusterName":"{{ .clusterName }}","roleARN":"{{ .roleARN }}"},"tlsClientConfig":{"insecure":false,"caData":"{{ .caData }}"}}'
  - it: labels the Secret as an Argo CD cluster the add-on ApplicationSets select
    documentIndex: 0
    asserts:
      - equal:
          path: spec.target.template.metadata.labels
          value:
            argocd.argoproj.io/secret-type: cluster
            payments-platform/addons: enabled
            payments-platform/component: cell-0
            payments-platform/environment: dev
            payments-platform/gateway: enabled
            payments-platform/region: eu-central-1
  - it: adds the per-cluster labels and lets them switch the add-ons off but never the cluster type
    set:
      clusters:
        - environment: shared-services
          region: eu-central-1
          component: central
          labels:
            payments-platform/central: enabled
            payments-platform/addons: disabled
    asserts:
      - equal:
          path: spec.target.template.metadata.labels["payments-platform/central"]
          value: enabled
      - equal:
          path: spec.target.template.metadata.labels["payments-platform/addons"]
          value: disabled
      - equal:
          path: spec.target.template.metadata.labels["argocd.argoproj.io/secret-type"]
          value: cluster
  - it: rejects a label outside the platform namespace
    set:
      clusters:
        - environment: dev
          region: eu-central-1
          component: cell-0
          labels:
            argocd.argoproj.io/secret-type: repository
    asserts:
      - failedTemplate: {}
  - it: annotates the EKS name the AWS add-ons use, eks-<component> unless set
    asserts:
      - equal:
          path: spec.target.template.metadata.annotations["payments-platform/eks-cluster-name"]
          value: acme-dev-euc1-eks-cell-0
        documentIndex: 0
      - equal:
          path: spec.target.template.metadata.annotations["payments-platform/eks-cluster-name"]
          value: acme-stage-use1-eks-spare
        documentIndex: 1
  - it: registers the cluster Argo CD runs in as a plain Secret without credentials
    set:
      clusters:
        - {environment: shared-services, region: eu-central-1, component: central, eksName: acme-shared-services-euc1-central, inCluster: true, labels: {payments-platform/central: enabled}}
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.server
          value: https://kubernetes.default.svc
      - equal:
          path: stringData.name
          value: acme-shared-services-euc1-central
      - equal:
          path: metadata.labels["argocd.argoproj.io/secret-type"]
          value: cluster
      - equal:
          path: metadata.annotations["payments-platform/eks-cluster-name"]
          value: acme-shared-services-euc1-central
