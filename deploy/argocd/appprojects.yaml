apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster add-ons from pinned upstream charts
  sourceRepos:
    - https://github.com/whoisqen/payments-platform
    - https://charts.jetstack.io
    - https://charts.external-secrets.io
    - https://kyverno.github.io/kyverno/
    - https://helm.releases.hashicorp.com
    - https://prometheus-community.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://istio-release.storage.googleapis.com/charts
    - https://argoproj.github.io/argo-helm
    - public.ecr.aws/karpenter
    - ghcr.io/actions/actions-runner-controller-charts
  destinations:
    - server: '*'
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: payments
  namespace: argocd
spec:
  description: Platform components; namespaced resources only, so a chart cannot create cluster roles or CRDs
  sourceRepos:
    - https://github.com/whoisqen/payments-platform
  destinations:
    - server: '*'
      namespace: payments
    - server: '*'
      namespace: payments-edge
    - server: '*'
      namespace: control-center
  clusterResourceWhitelist: []
