# No individual defaults: generate the values with tools/config/argocd-values.py from config/platform.yaml.
repo:
  url: ""
  revision: main
cluster:
  namePrefix: ""
  region: ""
observability:
  grafanaUrl: ""
# The central observability stack outside the CDE: where Prometheus pushes samples and sends alerts
central:
  metricsRemoteWriteUrl: ""
  alertmanagerHost: ""
  sentryUrl: ""
  dedupInterval: 30s
  logsOtlpEndpoint: ""
  tracesOtlpEndpoint: ""
  # The central OpenSearch: infra outputs and central.opensearch of config/platform.yaml; the logs add-ons fail their render while empty
  opensearch:
    endpoint: ""
    dashboardsHost: ""
    caBundle: ""
    logstashRoleArn: ""
    awsCidrs: []
# ECR host and repository prefix of the images copied from upstream (registry.ecr_prefix/ecr_repo_prefix)
imageRegistry: ""
# Environments that are never synced from main: pinned to the release tag in gated.revision, no automated sync.
# Without a revision they get no Application at all.
gatedEnvironments:
  - prod
  - cde-prod
gated:
  revision: ""
# Recovery regions kept as a pilot light: no cluster runs there until the failover builds one, so their directories get no Application.
# Generated from standby.compute_enabled in config/environments; the switch sets it and regenerates these values.
pilotLight: []
# Argo CD cluster Secrets: one ExternalSecret per entry renders <cluster.namePrefix>/argocd/clusters/<name> of Secrets Manager (shared-services),
# where <name> is the destination.name of the ApplicationSets. One entry per cluster: environment, region, component (cell-0..3, spare, ...)
# and the labels the add-on ApplicationSets select on (payments-platform/addons and payments-platform/gateway: enabled by default).
# eksName overrides <namePrefix>-<env>-<region short>-eks-<component>; inCluster: true registers the cluster Argo CD runs in without credentials
clusters: []
clusterSecrets:
  namespace: argocd
  secretStore: aws-secrets-manager
  refreshInterval: 1h
