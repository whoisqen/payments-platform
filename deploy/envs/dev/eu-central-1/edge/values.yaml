# Edge routing; one file holds everything because this release has no cell layer
global:
  environment: dev
  region: eu-central-1

gateway:
  hosts:
    - api.dev.payments.example.com

routing:
  cells:
    - name: cell-0
      host: router.payments.svc.cell-0.dev.example.internal
    - name: spare
      host: router.payments.svc.spare.dev.example.internal
