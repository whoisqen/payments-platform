# Cell spare: its own Aurora (through RDS Proxy) and MemoryDB; endpoints are placeholders until infra/live exports them
global:
  cell: spare
  hyperswitch:
    database:
      # aurora-global output proxy_endpoint; the proxy has no read-only endpoint, so replica reads use it too
      host: pay-dev-euc1-aurora-spare.proxy-example.eu-central-1.rds.amazonaws.com
    redis:
      host: clustercfg.pay-dev-euc1-memorydb-spare.example.memorydb.eu-central-1.amazonaws.com

migrations:
  database:
    host: pay-dev-euc1-aurora-spare.cluster-example.eu-central-1.rds.amazonaws.com

# The spare keeps three pods of each workload, so it takes traffic right after a failover; the scalers grow it from there
router:
  autoscaling:
    minReplicas: 3

drainer:
  autoscaling:
    minReplicas: 3
  container:
    env:
      REDIS_ADDRESS: clustercfg.pay-dev-euc1-memorydb-spare.example.memorydb.eu-central-1.amazonaws.com:6379

scheduler:
  consumer:
    container:
      env:
        REDIS_ADDRESS: clustercfg.pay-dev-euc1-memorydb-spare.example.memorydb.eu-central-1.amazonaws.com:6379
    autoscaling:
      minReplicas: 3
