# Differences of dev from the chart defaults; sizes are far below the production numbers of section 8
global:
  registry: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments
  environment: dev
  # Working window of the dev Aurora schedule (aurora-schedule: 08:00-20:00 Mon-Fri, Europe/Berlin); outside it KEDA scales the workloads to zero
  workingHours:
    timezone: Europe/Berlin
    start: "0 8 * * 1-5"
    end: "0 20 * * 1-5"
  hyperswitch:
    # PSP test endpoints
    configFile: sandbox.toml
    logLevel: DEBUG
    tenant:
      baseUrl: https://api.dev.payments.example.com
      controlCenterUrl: https://panel.dev.payments.example.com

router:
  container:
    env:
      ROUTER__CORS__ORIGINS: https://panel.dev.payments.example.com
      RUN_ENV: development
  autoscaling:
    minReplicas: 3
    maxReplicas: 6

drainer:
  container:
    env:
      RUN_ENV: development
  autoscaling:
    minReplicas: 3
    maxReplicas: 3

scheduler:
  producer:
    container:
      env:
        RUN_ENV: development
  consumer:
    container:
      env:
        RUN_ENV: development
    autoscaling:
      minReplicas: 3
      maxReplicas: 6
