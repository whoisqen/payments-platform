# Differences of prod from the chart defaults. The chart defaults are the production sizes, so prod runs at production size.
global:
  registry: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments
  environment: prod
  # Account of the environment (accounts.prod of config/platform.yaml), for the ARNs the charts derive
  accountId: "444444444444"
  # The internal NLB of the locker cluster of each region (infra/modules/locker-endpoint), private subnets cidrsubnet(vpc, 3, 0..2)
  lockerCidrs:
    - 10.150.0.0/19
    - 10.150.32.0/19
    - 10.150.64.0/19
    - 10.151.0.0/19
    - 10.151.32.0/19
    - 10.151.64.0/19
  egress:
    # dns.psp_domains of config/platform.yaml: the PSP domains the egress firewall allows
    pspHosts: ["*.psp-sandbox.example.com"]
    # central.sentry_url and the shared-services VPC (network.shared_services) it runs in
    sentryHosts: [sentry.payments.internal]
    sentryCidrs: [10.140.0.0/16]
  hyperswitch:
    # The locker cluster of the region (deploy.prod.cluster_domain of config/platform.yaml), named as the edge names the cells
    locker:
      clusterDomain: prod.example.internal
    # live PSP endpoints
    configFile: production.toml
    logLevel: INFO
    tenant:
      baseUrl: https://api.payments.example.com
      controlCenterUrl: https://panel.payments.example.com

router:
  # The central Vault (vault.host of config/platform.yaml), which issues the client certificate of the cross-cluster locker path
  lockerClient:
    vaultServer: https://vault.payments.internal
  container:
    env:
      ROUTER__CORS__ORIGINS: https://panel.payments.example.com
      RUN_ENV: production

drainer:
  container:
    env:
      RUN_ENV: production

scheduler:
  producer:
    container:
      env:
        RUN_ENV: production
  consumer:
    container:
      env:
        RUN_ENV: production

# Locker release (payments-locker), both regions: the cross-cluster entry of the cells (deploy.prod.cluster_domain) and the central Vault (vault.host)
gateway:
  clusterDomain: prod.example.internal
  pki:
    vaultServer: https://vault.payments.internal
