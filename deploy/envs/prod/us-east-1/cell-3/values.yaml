# Cell cell-3 in the standby region: local Aurora secondary and MemoryDB, ready to become the writer on promotion; endpoints are placeholders until infra/live exports them
global:
  cell: cell-3

migrations:
  enabled: false
  database:
    host: pay-prod-use1-aurora-cell-3.cluster-example.us-east-1.rds.amazonaws.com

router:
  container:
    env:
      ROUTER__MASTER_DATABASE__HOST: pay-prod-use1-aurora-cell-3.cluster-example.us-east-1.rds.amazonaws.com
      ROUTER__REPLICA_DATABASE__HOST: pay-prod-use1-aurora-cell-3.cluster-ro-example.us-east-1.rds.amazonaws.com
      ROUTER__REDIS__HOST: clustercfg.pay-prod-use1-memorydb-cell-3.example.memorydb.us-east-1.amazonaws.com

drainer:
  container:
    env:
      DRAINER__MASTER_DATABASE__HOST: pay-prod-use1-aurora-cell-3.cluster-example.us-east-1.rds.amazonaws.com
      DRAINER__REDIS__HOST: clustercfg.pay-prod-use1-memorydb-cell-3.example.memorydb.us-east-1.amazonaws.com
      REDIS_ADDRESS: clustercfg.pay-prod-use1-memorydb-cell-3.example.memorydb.us-east-1.amazonaws.com:6379

scheduler:
  producer:
    container:
      env:
        ROUTER__MASTER_DATABASE__HOST: pay-prod-use1-aurora-cell-3.cluster-example.us-east-1.rds.amazonaws.com
        ROUTER__REDIS__HOST: clustercfg.pay-prod-use1-memorydb-cell-3.example.memorydb.us-east-1.amazonaws.com
  consumer:
    container:
      env:
        ROUTER__MASTER_DATABASE__HOST: pay-prod-use1-aurora-cell-3.cluster-example.us-east-1.rds.amazonaws.com
        ROUTER__REDIS__HOST: clustercfg.pay-prod-use1-memorydb-cell-3.example.memorydb.us-east-1.amazonaws.com
        REDIS_ADDRESS: clustercfg.pay-prod-use1-memorydb-cell-3.example.memorydb.us-east-1.amazonaws.com:6379
