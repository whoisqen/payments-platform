# Cell cell-2 in the standby region: local Aurora secondary (through RDS Proxy) and MemoryDB, ready to become the writer on promotion; endpoints are placeholders until infra/live exports them
global:
  cell: cell-2
  hyperswitch:
    database:
      # aurora-global output proxy_endpoint; the proxy has no read-only endpoint, so replica reads use it too
      host: pay-prod-use1-aurora-cell-2.proxy-example.us-east-1.rds.amazonaws.com
    redis:
      host: clustercfg.pay-prod-use1-memorydb-cell-2.example.memorydb.us-east-1.amazonaws.com
    kms:
      # Cell key of the kms-set stack in this region
      keyAlias: alias/pay-prod-use1-cell-2
      region: us-east-1

# Migrations run only where the writer is; enable after promotion
migrations:
  enabled: false
  database:
    host: pay-prod-use1-aurora-cell-2.cluster-example.us-east-1.rds.amazonaws.com

drainer:
  container:
    env:
      REDIS_ADDRESS: clustercfg.pay-prod-use1-memorydb-cell-2.example.memorydb.us-east-1.amazonaws.com:6379

scheduler:
  consumer:
    container:
      env:
        REDIS_ADDRESS: clustercfg.pay-prod-use1-memorydb-cell-2.example.memorydb.us-east-1.amazonaws.com:6379
