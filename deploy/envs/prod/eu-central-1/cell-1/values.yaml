# Cell cell-1: its own Aurora writer, reader and MemoryDB; endpoints are placeholders until infra/live exports them
global:
  cell: cell-1

migrations:
  database:
    host: pay-prod-euc1-aurora-cell-1.cluster-example.eu-central-1.rds.amazonaws.com

router:
  container:
    env:
      ROUTER__MASTER_DATABASE__HOST: pay-prod-euc1-aurora-cell-1.cluster-example.eu-central-1.rds.amazonaws.com
      ROUTER__REPLICA_DATABASE__HOST: pay-prod-euc1-aurora-cell-1.cluster-ro-example.eu-central-1.rds.amazonaws.com
      ROUTER__REDIS__HOST: clustercfg.pay-prod-euc1-memorydb-cell-1.example.memorydb.eu-central-1.amazonaws.com

drainer:
  container:
    env:
      DRAINER__MASTER_DATABASE__HOST: pay-prod-euc1-aurora-cell-1.cluster-example.eu-central-1.rds.amazonaws.com
      DRAINER__REDIS__HOST: clustercfg.pay-prod-euc1-memorydb-cell-1.example.memorydb.eu-central-1.amazonaws.com
      REDIS_ADDRESS: clustercfg.pay-prod-euc1-memorydb-cell-1.example.memorydb.eu-central-1.amazonaws.com:6379

scheduler:
  producer:
    container:
      env:
        ROUTER__MASTER_DATABASE__HOST: pay-prod-euc1-aurora-cell-1.cluster-example.eu-central-1.rds.amazonaws.com
        ROUTER__REDIS__HOST: clustercfg.pay-prod-euc1-memorydb-cell-1.example.memorydb.eu-central-1.amazonaws.com
  consumer:
    container:
      env:
        ROUTER__MASTER_DATABASE__HOST: pay-prod-euc1-aurora-cell-1.cluster-example.eu-central-1.rds.amazonaws.com
        ROUTER__REDIS__HOST: clustercfg.pay-prod-euc1-memorydb-cell-1.example.memorydb.eu-central-1.amazonaws.com
        REDIS_ADDRESS: clustercfg.pay-prod-euc1-memorydb-cell-1.example.memorydb.eu-central-1.amazonaws.com:6379
