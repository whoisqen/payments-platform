# Not layered: the digest comes from images.yaml through the ApplicationSet, the rest is here
global:
  environment: stage

container:
  env:
    default__endpoints__api_url: https://api.stage.payments.example.com
    default__features__is_live_mode: "false"

panel:
  # CloudFront serves this name; the VPC origin reaches the internal NLB of the Gateway
  hostname: panel.stage.payments.example.com
