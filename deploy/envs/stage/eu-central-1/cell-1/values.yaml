# Cell cell-1: its own Aurora (through RDS Proxy) and MemoryDB; endpoints are placeholders until infra/live exports them
global:
  cell: cell-1
  hyperswitch:
    database:
      # aurora-global output proxy_endpoint; the proxy has no read-only endpoint, so replica reads use it too
      host: pay-stage-euc1-aurora-cell-1.proxy-example.eu-central-1.rds.amazonaws.com
    redis:
      host: clustercfg.pay-stage-euc1-memorydb-cell-1.example.memorydb.eu-central-1.amazonaws.com

migrations:
  database:
    host: pay-stage-euc1-aurora-cell-1.cluster-example.eu-central-1.rds.amazonaws.com

drainer:
  container:
    env:
      REDIS_ADDRESS: clustercfg.pay-stage-euc1-memorydb-cell-1.example.memorydb.eu-central-1.amazonaws.com:6379

scheduler:
  consumer:
    container:
      env:
        REDIS_ADDRESS: clustercfg.pay-stage-euc1-memorydb-cell-1.example.memorydb.eu-central-1.amazonaws.com:6379
