# Edge routing; one file holds everything because this release has no cell layer
global:
  environment: stage
  region: eu-central-1

gateway:
  hosts:
    - api.stage.payments.example.com

# Client certificate of the edge for the router gateways of the cells, from the central Vault (vault.host of config/platform.yaml)
edgeClient:
  pki:
    vaultServer: https://vault.payments.internal

routing:
  cells:
    - name: cell-0
      host: router.payments.svc.cell-0.stage.example.internal
    - name: cell-1
      host: router.payments.svc.cell-1.stage.example.internal
    - name: cell-2
      host: router.payments.svc.cell-2.stage.example.internal
    - name: cell-3
      host: router.payments.svc.cell-3.stage.example.internal
    - name: spare
      host: router.payments.svc.spare.stage.example.internal
