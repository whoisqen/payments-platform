# Locker shared by all cells of the region, with its own database
global:
  environment: stage
  region: eu-central-1
  # Working window of the dev Aurora schedule (aurora-schedule: 08:00-20:00 Mon-Fri, Europe/Berlin); outside it KEDA scales the workloads to zero
  workingHours:
    timezone: Europe/Berlin
    start: "0 8 * * 1-5"
    end: "0 20 * * 1-5"
  dataCidrs:
    - 10.130.8.0/22
  endpointCidrs:
    - 10.130.255.0/24

locker:
  # Set after the eks stack of the cluster that runs the locker is applied: output locker_pod_security_group_id.
  securityGroupPolicy:
    securityGroupIds:
      - REPLACE_LOCKER_POD_SG_ID
  container:
    env:
      RUN_ENV: sandbox
  # The proxy endpoint is a placeholder until the aurora stack outputs it; the KMS alias is the locker key of this region
  config:
    database:
      host: pay-stage-euc1-aurora-locker.proxy-example.eu-central-1.rds.amazonaws.com
    secrets_management:
      aws_kms:
        key_id: alias/pay-stage-euc1-locker
        region: eu-central-1

locker-migrations:
  database:
    host: pay-stage-euc1-aurora-locker.cluster-example.eu-central-1.rds.amazonaws.com
    name: locker
