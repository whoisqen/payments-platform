# Locker shared by all cells of the region, with its own database
global:
  environment: stage
  region: eu-central-1
  dataCidrs:
    - 10.130.8.0/22
  endpointCidrs:
    - 10.130.255.0/24

locker:
  container:
    env:
      RUN_ENV: sandbox
  autoscaling:
    minReplicas: 3
    maxReplicas: 12

locker-migrations:
  database:
    host: pay-stage-euc1-aurora-locker.cluster-example.eu-central-1.rds.amazonaws.com
    name: locker
