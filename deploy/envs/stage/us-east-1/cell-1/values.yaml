# Cell cell-1 in the standby region: local Aurora reader and MemoryDB, writes to the working region writer; endpoints are placeholders until infra/live exports them
global:
  cell: cell-1

migrations:
  enabled: false
  database:
    host: pay-stage-euc1-aurora-cell-1.cluster-example.eu-central-1.rds.amazonaws.com

router:
  container:
    env:
      ROUTER__MASTER_DATABASE__HOST: pay-stage-euc1-aurora-cell-1.cluster-example.eu-central-1.rds.amazonaws.com
      ROUTER__REPLICA_DATABASE__HOST: pay-stage-use1-aurora-cell-1.cluster-ro-example.us-east-1.rds.amazonaws.com
      ROUTER__REDIS__HOST: clustercfg.pay-stage-use1-memorydb-cell-1.example.memorydb.us-east-1.amazonaws.com

drainer:
  container:
    env:
      DRAINER__MASTER_DATABASE__HOST: pay-stage-euc1-aurora-cell-1.cluster-example.eu-central-1.rds.amazonaws.com
      DRAINER__REDIS__HOST: clustercfg.pay-stage-use1-memorydb-cell-1.example.memorydb.us-east-1.amazonaws.com
      REDIS_ADDRESS: clustercfg.pay-stage-use1-memorydb-cell-1.example.memorydb.us-east-1.amazonaws.com:6379

scheduler:
  producer:
    container:
      env:
        ROUTER__MASTER_DATABASE__HOST: pay-stage-euc1-aurora-cell-1.cluster-example.eu-central-1.rds.amazonaws.com
        ROUTER__REDIS__HOST: clustercfg.pay-stage-use1-memorydb-cell-1.example.memorydb.us-east-1.amazonaws.com
  consumer:
    container:
      env:
        ROUTER__MASTER_DATABASE__HOST: pay-stage-euc1-aurora-cell-1.cluster-example.eu-central-1.rds.amazonaws.com
        ROUTER__REDIS__HOST: clustercfg.pay-stage-use1-memorydb-cell-1.example.memorydb.us-east-1.amazonaws.com
        REDIS_ADDRESS: clustercfg.pay-stage-use1-memorydb-cell-1.example.memorydb.us-east-1.amazonaws.com:6379
