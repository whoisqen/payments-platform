# Differences of stage from the chart defaults; sizes are below the production numbers of section 8
global:
  registry: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/payments
  environment: stage

router:
  container:
    env:
      RUN_ENV: sandbox
  autoscaling:
    minReplicas: 3
    maxReplicas: 12

drainer:
  container:
    env:
      RUN_ENV: sandbox
  autoscaling:
    minReplicas: 3
    maxReplicas: 6

scheduler:
  producer:
    container:
      env:
        RUN_ENV: sandbox
  consumer:
    container:
      env:
        RUN_ENV: sandbox
    autoscaling:
      minReplicas: 3
      maxReplicas: 12
