name: tag

# The only creator of v* tags; it runs after a prod rollout finished in all cells and builds nothing.
# The first tag is the exception: prod pins gated.revision to a tag before its first rollout, so while no v* tag exists
# the merge of the first prod promotion (digests that passed stage) gets v0.1.0; see tools/ci/promote/first_release.py.
# After the tag it publishes multi-arch images of the tagged commit to GitHub Packages (ghcr.io), the source of `make up` on a
# laptop; a dispatch with the sha of an existing tag only completes a missing GHCR publication.
on:
  repository_dispatch:
    types: [prod-rollout-complete]
  push:
    branches: [main]
    paths: ["deploy/envs/prod/images.yaml"]
  workflow_dispatch:
    inputs:
      sha:
        description: commit that runs in prod in all cells, or for first-release the commit whose prod digests stage verified
        type: string
        required: true
      first-release:
        description: cut v0.1.0 (fails when any v* tag exists)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  version:
    runs-on: ${{ vars.RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.next.outputs.version }}
      bump: ${{ steps.next.outputs.bump }}
    steps:
      - id: sha
        env:
          DISPATCHED: ${{ github.event.client_payload.sha }}
          INPUT: ${{ inputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          sha=${INPUT:-$DISPATCHED}
          [ "$EVENT" = push ] && sha=$GITHUB_SHA
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a commit sha"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: the commit is on main or on a release branch
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if git merge-base --is-ancestor "$SHA" origin/main; then exit 0; fi
          for b in $(git branch -r --list 'origin/release/*' --format='%(refname:short)'); do
            if git merge-base --is-ancestor "$SHA" "$b"; then exit 0; fi
          done
          echo "::error::${SHA} is not on main or release/*"
          exit 1
      - id: next
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT: ${{ github.event_name }}
          FIRST: ${{ inputs.first-release }}
        run: |
          if [ "$EVENT" = push ] || [ "$FIRST" = true ]; then
            # a push only bootstraps; once a v* tag exists it is a no-op and prod-rollout-complete takes over
            flag=(); [ "$EVENT" = push ] && flag=(--if-first)
            out=$(python3 tools/ci/promote/first_release.py --sha "$SHA" --main origin/main "${flag[@]}" --changelog-out changelog.md)
            echo "version=$(jq -r '.version // empty' <<<"$out")" >>"$GITHUB_OUTPUT"
            echo "bump=$(jq -r .bump <<<"$out")" >>"$GITHUB_OUTPUT"
            git show "${SHA}:deploy/envs/prod/images.yaml" >images.yaml
            exit 0
          fi
          existing=$(git tag --points-at "$SHA" --list 'v*' | head -n1)
          if [ -n "$existing" ]; then
            echo "version=$existing" >>"$GITHUB_OUTPUT"; echo "bump=none" >>"$GITHUB_OUTPUT"; exit 0
          fi
          out=$(python3 tools/ci/next_version.py --head "$SHA" --changelog-out changelog.md)
          echo "version=$(jq -r .version <<<"$out")" >>"$GITHUB_OUTPUT"
          echo "bump=$(jq -r .bump <<<"$out")" >>"$GITHUB_OUTPUT"
          # the prod digests of this commit are what the release attaches evidence for
          git show "${SHA}:deploy/envs/prod/images.yaml" >images.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.next.outputs.bump != 'none'
        with:
          name: release-notes
          path: |
            changelog.md
            images.yaml
          retention-days: 14

  evidence:
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ${{ vars.RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install_args: cosign
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ECR_READ }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - name: sbom and provenance of every prod digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          PREFIX: ${{ vars.ECR_REPO_PREFIX }}
        run: |
          mkdir -p evidence
          grep -oP '^  \K[a-z-]+: sha256:[a-f0-9]{64}$' images.yaml | while IFS=': ' read -r svc digest; do
            ref="${REGISTRY}/${PREFIX}/${svc}@${digest}"
            cosign download attestation "$ref" |
              jq -c 'select((.payload | @base64d | fromjson).predicateType | test("cyclonedx")) | .payload | @base64d | fromjson | .predicate' \
                >"evidence/sbom-${svc}.cdx.json"
            gh attestation download "oci://${ref}" --repo "$REPO"
            mv "${digest}.jsonl" "evidence/provenance-${svc}.jsonl"
          done
          [ -n "$(ls evidence)" ] || { echo "::error::no evidence found"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: evidence
          retention-days: 14

  publish:
    needs: [version, evidence]
    runs-on: ${{ vars.RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.TAGGING_APP_ID }}
          private-key: ${{ secrets.TAGGING_APP_PRIVATE_KEY }}
          permission-contents: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: evidence
      - name: tag and release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.version.outputs.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version"; exit 1; }
          current=$(gh api "repos/${REPO}/git/ref/tags/${VERSION}" --jq .object.sha 2>/dev/null || true)
          if [ -z "$current" ]; then
            gh api "repos/${REPO}/git/refs" -f "ref=refs/tags/${VERSION}" -f "sha=${SHA}" >/dev/null
          elif [ "$current" != "$SHA" ]; then
            echo "::error::${VERSION} already points at ${current}, tags are never moved"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then echo "release ${VERSION} exists"; exit 0; fi
          gh release create "$VERSION" --repo "$REPO" --verify-tag --title "$VERSION" --notes-file changelog.md images.yaml evidence/*

  # one native runner per architecture: hyperswitch release builds under QEMU do not fit any timeout
  ghcr-build:
    needs: [version, publish]
    # a skipped publish counts only when the tag already existed, never when evidence failed
    if: always() && needs.version.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.version.outputs.bump == 'none'))
    runs-on: ${{ matrix.arch == 'arm64' && (vars.RUNNER_GHCR_ARM64 || 'ubuntu-24.04-arm') || (vars.RUNNER_GHCR_AMD64 || 'ubuntu-latest') }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [router, drainer, scheduler, locker, control-center, vault-snapshot, smoke]
        arch: [amd64, arm64]
    env:
      SERVICE: ${{ matrix.service }}
      ARCH: ${{ matrix.arch }}
      SHA: ${{ needs.version.outputs.sha }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: free disk for the Rust release build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: build the same reproducible image as images.yml
        run: |
          # the last commit that touched the image inputs fixes timestamps, as in images.yml
          mapfile -t paths < <(python3 tools/ci/changed_images.py --paths "$SERVICE")
          input_sha=$(git log -1 --format=%H "$SHA" -- "${paths[@]}")
          epoch=$(git log -1 --format=%ct "$input_sha")
          mapfile -t common < <(sed 's/^/--build-arg=/' docker/_common/build-args.env)
          # anonymous pulls from Docker Hub share the runner IP limit: retry a 429 with a growing pause
          for attempt in 1 2 3 4 5; do
          if docker buildx build "${common[@]}" \
            --file "docker/${SERVICE}/Dockerfile" \
            --platform "linux/${ARCH}" \
            --provenance=false --sbom=false \
            --build-arg "SOURCE_DATE_EPOCH=${epoch}" \
            --build-arg "REVISION=${input_sha}" \
            --build-arg "CREATED=$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "SOURCE_URL=${REPO_URL}" \
            --output "type=oci,dest=${RUNNER_TEMP}/oci,tar=false,rewrite-timestamp=true,oci-mediatypes=true" \
            . 2>&1 | tee "$RUNNER_TEMP/build.log"; [ "${PIPESTATUS[0]}" -eq 0 ]; then exit 0; fi
          grep -q "429 Too Many Requests" "$RUNNER_TEMP/build.log" || exit 1
          echo "::warning::registry rate limit, attempt ${attempt}; retrying"
          sleep $((attempt * 90))
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghcr-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/oci
          retention-days: 1

  # the only job that writes packages: it pushes both architectures, joins them in one index, signs and attests
  ghcr-publish:
    needs: [version, ghcr-build]
    if: always() && needs.ghcr-build.result == 'success'
    runs-on: ${{ vars.RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [router, drainer, scheduler, locker, control-center, vault-snapshot, smoke]
    env:
      SERVICE: ${{ matrix.service }}
      VERSION: ${{ needs.version.outputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install_args: cosign syft crane
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ghcr-${{ matrix.service }}-*
          path: ${{ runner.temp }}/oci
      - name: push both architectures and the index
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version"; exit 1; }
          image="ghcr.io/${REPO,,}/${SERVICE}"
          crane auth login ghcr.io -u "$ACTOR" --password-stdin <<<"$GH_TOKEN"
          # a published version is never overwritten; a re-run only completes signing and attestation
          if digest=$(crane digest "${image}:${VERSION}" 2>/dev/null); then
            echo "${image}:${VERSION} exists"
          else
            refs=()
            for arch in amd64 arm64; do
              crane push "${RUNNER_TEMP}/oci/ghcr-${SERVICE}-${arch}" "${image}:${VERSION}-${arch}"
              refs+=(--manifest "${image}@$(crane digest "${image}:${VERSION}-${arch}")")
            done
            crane index append "${refs[@]}" --tag "${image}:${VERSION}"
            digest=$(crane digest "${image}:${VERSION}")
          fi
          echo "IMAGE=${image}" >>"$GITHUB_ENV"
          echo "DIGEST=${digest}" >>"$GITHUB_ENV"
      - name: already signed by this workflow
        id: signed
        run: |
          if cosign verify --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/tag.yml@.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${DIGEST}" >/dev/null 2>&1; then
            echo "done=true" >>"$GITHUB_OUTPUT"
          fi
      - name: sbom of each architecture
        if: steps.signed.outputs.done != 'true'
        run: |
          for arch in amd64 arm64; do
            platform_digest=$(crane digest --platform "linux/${arch}" "${IMAGE}@${DIGEST}")
            syft "registry:${IMAGE}@${platform_digest}" -o "cyclonedx-json=${RUNNER_TEMP}/sbom-${arch}.cdx.json"
            cosign attest --yes --type cyclonedx --predicate "${RUNNER_TEMP}/sbom-${arch}.cdx.json" "${IMAGE}@${platform_digest}"
          done
      - name: sign the index and both images
        if: steps.signed.outputs.done != 'true'
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
