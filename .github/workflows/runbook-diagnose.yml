name: runbook-diagnose

# Step 1 of every runbook in docs/runbooks: the read-only diagnose mode of the alert's SSM document, under a read-only execution role.
# No approval: diagnostics change nothing and are needed at once during an incident.
on:
  workflow_dispatch:
    inputs:
      alert:
        description: alert name as written in the runbook, for example PSPDegraded
        type: string
        required: true
      environment:
        type: choice
        options: [prod, stage, dev]
        required: true
      region:
        type: choice
        options: [eu-central-1, us-east-1]
        default: eu-central-1

permissions: {}

concurrency:
  group: runbook-diagnose-${{ inputs.environment }}-${{ inputs.alert }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ${{ vars.RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: main only
        run: '[ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::runbooks run from main only"; exit 1; }'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install_args: python
      - run: python3 -m pip install --quiet pyyaml==6.0.2
      - id: request
        env:
          ALERT: ${{ inputs.alert }}
          TARGET_ENV: ${{ inputs.environment }}
          REGION: ${{ inputs.region }}
        run: |
          python3 tools/ci/runbook/runbook.py diagnose --alert "$ALERT" --env "$TARGET_ENV" --region "$REGION" >"$RUNNER_TEMP/request.json"
          echo "role=$(jq -r .role "$RUNNER_TEMP/request.json")" >>"$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ steps.request.outputs.role }}
          aws-region: ${{ inputs.region }}
      - name: run the diagnose mode
        run: tools/ci/runbook/ssm-run.sh "$RUNNER_TEMP/request.json"
