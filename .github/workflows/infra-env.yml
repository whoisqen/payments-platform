name: infra-env

# One environment of infra-apply: plan the changed stacks in dependency order, then apply. dev applies in the same job;
# a gated environment applies the reviewed plan artifact after its GitHub Environment approval.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      gated:
        type: boolean
        required: true
      stack:
        description: one stack (workflow_dispatch); empty plans every stack changed since the last converged run
        type: string
        default: ""
    outputs:
      changes:
        value: ${{ jobs.plan.outputs.changes }}

permissions: {}

jobs:
  plan:
    runs-on: ${{ vars.RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      changes: ${{ steps.run.outputs.changes }}
      deferred: ${{ steps.run.outputs.deferred }}
    env:
      ENV_NAME: ${{ inputs.environment }}
      GATED: ${{ inputs.gated }}
      STACK: ${{ inputs.stack }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install_args: python terraform terragrunt
      - run: python3 -m pip install --quiet pyyaml==6.0.2
      - id: stacks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$STACK" ]; then
            python3 tools/ci/infra/stacks.py --env "$ENV_NAME" --stack "$STACK" >"$RUNNER_TEMP/stacks.json"
          else
            # the diff starts at the last converged run, so a pending run that GitHub replaced loses nothing
            base=$(python3 tools/ci/infra/applied_base.py --env "$ENV_NAME" --repo "$REPO")
            echo "base commit of ${ENV_NAME}: ${base}"
            python3 tools/ci/infra/stacks.py --env "$ENV_NAME" --base "$base" --head "$GITHUB_SHA" >"$RUNNER_TEMP/stacks.json"
          fi
          removed=$(jq -r '.removed | join(" ")' "$RUNNER_TEMP/stacks.json")
          if [ -n "$removed" ]; then echo "::warning::stacks removed from the code are not destroyed here: ${removed}"; fi
          echo "count=$(jq '[.levels[][]] | length' "$RUNNER_TEMP/stacks.json")" >>"$GITHUB_OUTPUT"
      - id: run
        if: steps.stacks.outputs.count != '0'
        run: |
          args=(plan --stacks "$RUNNER_TEMP/stacks.json" --out "$RUNNER_TEMP/plan" --sha "$GITHUB_SHA")
          [ "$GATED" = true ] || args+=(--apply-now)
          python3 tools/ci/infra/run.py "${args[@]}"
      # plans hold sensitive values in clear text: the artifact lives one day, an approval after that needs a new run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && inputs.gated && steps.run.outcome == 'success'
        with:
          name: infra-plan-${{ inputs.environment }}
          path: ${{ runner.temp }}/plan
          retention-days: 1
          if-no-files-found: error

  apply:
    needs: plan
    if: inputs.gated && (needs.plan.outputs.changes == 'true' || needs.plan.outputs.deferred == 'true')
    runs-on: ${{ vars.RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 300
    # the approval of the GitHub Environment is the review of the plan artifact; the OIDC subject is environment:<name>
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install_args: python terraform terragrunt
      - run: python3 -m pip install --quiet pyyaml==6.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: infra-plan-${{ inputs.environment }}
          path: ${{ runner.temp }}/plan
      - name: apply the reviewed plan
        run: python3 tools/ci/infra/run.py apply --bundle "$RUNNER_TEMP/plan" --sha "$GITHUB_SHA"
