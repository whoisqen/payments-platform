name: images

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      services:
        description: JSON list of services to build; empty means the changed ones
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      services:
        description: JSON list of services to build; empty means the changed ones
        type: string
        default: ""

permissions: {}

# publication and signing are never cancelled half way
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  PLATFORMS: linux/arm64

jobs:
  select:
    runs-on: ${{ vars.RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      services: ${{ steps.pick.outputs.services }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        env:
          REQUESTED: ${{ inputs.services }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$REQUESTED" ]; then
            services=$(jq -c --argjson all '["router","drainer","scheduler","locker","control-center","vault-snapshot","smoke","migrator","kafka-admin","cell-copy"]' '[.[] | select(. as $s | $all | index($s))]' <<<"$REQUESTED")
          else
            # the concurrency group can drop a pending run, so the base is the last green run and not the previous push
            base=$(gh run list --repo "$REPO" --workflow images.yml --branch "$BRANCH" --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
            if [ -z "$base" ] && [ -n "$BEFORE_SHA" ] && [[ ! $BEFORE_SHA =~ ^0+$ ]]; then base=$BEFORE_SHA; fi
            if [ -z "$base" ] && [ "$BRANCH" != main ]; then base=$(git merge-base "$AFTER_SHA" origin/main); fi
            args=(--head "$AFTER_SHA")
            if [ -n "$base" ]; then args+=(--base "$base"); fi
            services=$(python3 tools/ci/changed_images.py "${args[@]}" | jq -c .images)
          fi
          echo "services=$services" >>"$GITHUB_OUTPUT"
          echo "any=$(jq 'length > 0' <<<"$services")" >>"$GITHUB_OUTPUT"

  build:
    needs: select
    # Pushes to ECR: it needs the push role of the account (repository variable AWS_ROLE_ECR_PUSH) and the rootless BuildKit namespace (BUILDKIT_NAMESPACE); both exist only after the account is set up.
    if: vars.AWS_ROLE_ECR_PUSH != '' && vars.BUILDKIT_NAMESPACE != '' && needs.select.outputs.any == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ${{ vars.RUNNER_BUILD || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install_args: cosign syft trivy container-structure-test crane python
      # before the AWS role is assumed: the runner identity, not the ECR push role, reaches the build cluster
      - uses: ./.github/actions/setup-buildkit
        with:
          name: buildkit-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service }}
          namespace: ${{ vars.BUILDKIT_NAMESPACE }}
          node-selector: ${{ vars.BUILDKIT_NODE_SELECTOR || 'kubernetes.io/arch=arm64,pay.io/pool=ci-build' }}
          eks-cluster: ${{ vars.BUILDKIT_EKS_CLUSTER }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ECR_PUSH }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - name: inputs of this image
        run: |
          # the last commit that touched the image inputs fixes timestamps, so unchanged code gives the same digest
          mapfile -t paths < <(python3 tools/ci/changed_images.py --paths "$SERVICE")
          sha=$(git log -1 --format=%H -- "${paths[@]}")
          {
            echo "INPUT_SHA=$sha"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$sha")"
            echo "IMAGE=${REGISTRY}/${PREFIX}/${SERVICE}"
            echo "CACHE=${REGISTRY}/${PREFIX}-cache/${SERVICE}:buildcache"
          } >>"$GITHUB_ENV"
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          PREFIX: ${{ vars.ECR_REPO_PREFIX }}
      - name: reuse an image already built from these inputs
        id: exists
        env:
          REPOSITORY: ${{ vars.ECR_REPO_PREFIX }}/${{ matrix.service }}
        run: |
          # ECR tags are immutable, so a re-run of the same inputs must reuse the digest
          digest=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$INPUT_SHA" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [[ $digest == sha256:* ]]; then echo "digest=$digest" >>"$GITHUB_OUTPUT"; fi
      - name: build and push
        id: build
        if: steps.exists.outputs.digest == ''
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/aws"
          printf '[default]\naws_access_key_id=%s\naws_secret_access_key=%s\naws_session_token=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" >"$RUNNER_TEMP/aws/credentials"
          mapfile -t common < <(sed 's/^/--build-arg=/' docker/_common/build-args.env)
          docker buildx build "${common[@]}" \
            --file "docker/${SERVICE}/Dockerfile" \
            --platform "$PLATFORMS" \
            --provenance=false --sbom=false \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --build-arg "REVISION=${INPUT_SHA}" \
            --build-arg "CREATED=$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "SOURCE_URL=${REPO_URL}" \
            --build-arg "SCCACHE_BUCKET=${SCCACHE_BUCKET}" \
            --build-arg "SCCACHE_REGION=${AWS_REGION}" \
            --secret "id=aws,src=${RUNNER_TEMP}/aws/credentials" \
            --cache-from "type=registry,ref=${CACHE}" \
            --cache-to "type=registry,ref=${CACHE},mode=max,image-manifest=true,oci-mediatypes=true" \
            --output "type=image,name=${IMAGE}:${INPUT_SHA},push=true,rewrite-timestamp=true,oci-mediatypes=true" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            .
          rm -rf "$RUNNER_TEMP/aws"
          echo "digest=$(python3 tools/ci/digest_compare.py metadata "$RUNNER_TEMP/meta.json")" >>"$GITHUB_OUTPUT"
        env:
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      - name: digest of this image
        run: echo "DIGEST=${BUILT:-$REUSED}" >>"$GITHUB_ENV"
        env:
          BUILT: ${{ steps.build.outputs.digest }}
          REUSED: ${{ steps.exists.outputs.digest }}
      - name: trivy blocks on critical findings
        run: trivy image --image-src remote --exit-code 1 --severity CRITICAL --ignore-unfixed --format sarif --output "$RUNNER_TEMP/trivy.sarif" "${IMAGE}@${DIGEST}"
      - name: structure test
        if: matrix.service != 'control-center'
        run: |
          config=docker/_common/structure-test.yaml
          if [ -f "docker/${SERVICE}/structure-test.yaml" ]; then config="docker/${SERVICE}/structure-test.yaml"; fi
          sed "s|\${SERVICE}|${SERVICE}|" "$config" >"$RUNNER_TEMP/structure-test.yaml"
          # no Docker daemon on the runner: test the image from a tarball pulled from the registry
          crane pull "${IMAGE}@${DIGEST}" "$RUNNER_TEMP/image.tar"
          container-structure-test test --driver tar --image "$RUNNER_TEMP/image.tar" --config "$RUNNER_TEMP/structure-test.yaml"
      - name: sbom
        run: syft "registry:${IMAGE}@${DIGEST}" -o "cyclonedx-json=$RUNNER_TEMP/sbom.cdx.json"
      - name: already signed by this workflow
        id: signed
        env:
          REPO: ${{ github.repository }}
        run: |
          # the signature is pushed last, so its presence means sbom and provenance were attached by an earlier run
          ref="${IMAGE}@${DIGEST}"
          if cosign verify --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/images.yml@.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" >/dev/null 2>&1; then
            echo "done=true" >>"$GITHUB_OUTPUT"
          fi
      - name: attach the sbom
        if: steps.signed.outputs.done != 'true'
        run: cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/sbom.cdx.json" "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: steps.signed.outputs.done != 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: sign
        if: steps.signed.outputs.done != 'true'
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: record the digest
        run: |
          jq -n --arg s "$SERVICE" --arg d "$DIGEST" '{($s): $d}' >"$RUNNER_TEMP/digest-${SERVICE}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.service }}
          path: ${{ runner.temp }}/digest-${{ matrix.service }}.json
          retention-days: 14

  collect:
    needs: build
    runs-on: ${{ vars.RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: one file with every digest of this run
        run: jq -s 'add' digests/*.json >digests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests
          path: digests.json
          retention-days: 14

  # ---- stage 2 (commit): on the digests of this run; a red job makes the run red, so promote.yml
  # (workflow_run on a green images run) never writes deploy/envs/dev/images.yaml for these digests ----

  integration:
    # image smoke, API scenarios and contract tests on a kind cluster (scripts/kind/cluster.yaml) installed by
    # deploy/local; pulls the arm64 images from ECR with the read role, so it needs an arm64 Docker host (RUNNER_COMMIT)
    needs: collect
    if: vars.AWS_ROLE_ECR_READ != '' && vars.ECR_REPO_PREFIX != ''
    runs-on: ${{ vars.RUNNER_COMMIT || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      KIND_CLUSTER: pay-local
      HELM_DIFF_VERSION: 3.15.15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: digests
          path: ${{ runner.temp }}/digests
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ECR_READ }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - name: images by digest
        id: env
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          PREFIX: ${{ vars.ECR_REPO_PREFIX }}
        run: |
          if [ ! -f deploy/local/helmfile.yaml ]; then
            echo "::notice::deploy/local/helmfile.yaml does not exist; the commit stage is skipped"
            echo "ready=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--registry "${REGISTRY}/${PREFIX}" --digests "$RUNNER_TEMP/digests/digests.json" --images deploy/envs/dev/images.yaml)
          if ! python3 tools/ci/kind/kind_images.py "${args[@]}" >"$RUNNER_TEMP/images.txt"; then
            echo "::notice::not every service has a digest yet; the commit stage is skipped"
            echo "ready=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/ci/kind/kind_images.py "${args[@]}" --values >"$RUNNER_TEMP/values.txt"
          echo "ready=true" >>"$GITHUB_OUTPUT"
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        if: steps.env.outputs.ready == 'true'
        with:
          install_args: kubectl helm helmfile
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        if: steps.env.outputs.ready == 'true'
        with:
          version: v0.33.0
          config: scripts/kind/cluster.yaml
          cluster_name: ${{ env.KIND_CLUSTER }}
          kubectl_version: v1.37.3
          wait: 180s
      - name: load the images into the nodes
        if: steps.env.outputs.ready == 'true'
        run: |
          # kind load goes through docker save, so pods name a local tag and never pull from ECR
          while read -r svc ref repo tag; do
            echo "::group::${svc}"
            docker pull --quiet "$ref"
            docker tag "$ref" "${repo}:${tag}"
            kind load docker-image --name "$KIND_CLUSTER" "${repo}:${tag}"
            echo "::endgroup::"
          done <"$RUNNER_TEMP/images.txt"
      - name: install deploy/local (environment ci)
        if: steps.env.outputs.ready == 'true'
        run: |
          helm plugin install https://github.com/databus23/helm-diff --version "v${HELM_DIFF_VERSION}"
          helmfile --kube-context "kind-${KIND_CLUSTER}" -f deploy/local/helmfile.yaml -e ci apply --wait --suppress-diff \
            --state-values-set "$(cat "$RUNNER_TEMP/values.txt")"
      - name: image smoke, every pod ready and the edge answers /health
        if: steps.env.outputs.ready == 'true'
        run: |
          kubectl --context "kind-${KIND_CLUSTER}" wait pods --all --all-namespaces --for=condition=Ready \
            --field-selector=status.phase!=Succeeded --timeout=300s
          scripts/kind/status.sh
      - name: API scenarios through the edge with the dummy connector
        if: steps.env.outputs.ready == 'true'
        run: scripts/kind/demo.sh
      - name: contract tests
        if: steps.env.outputs.ready == 'true'
        run: |
          python3 -m pip install --quiet pyyaml==6.0.2
          python3 -m unittest discover -s tests/contracts
      - name: cluster logs
        if: failure() && steps.env.outputs.ready == 'true'
        run: scripts/kind/logs.sh --export "$RUNNER_TEMP/kind-logs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.env.outputs.ready == 'true'
        with:
          name: kind-logs
          path: ${{ runner.temp }}/kind-logs
          retention-days: 7

  terraform-plan:
    # read-only plan of the stacks this push changed; cde-* stacks are planned by their own Atlantis
    if: vars.AWS_ROLE_TF_PLAN != ''
    runs-on: ${{ vars.RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: stacks
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          dirs=()
          if [ -n "$BEFORE" ] && [[ ! $BEFORE =~ ^0+$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            mapfile -t dirs < <(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- infra/live \
              | grep -vE '^infra/live/cde-|/_envcommon/' | cut -d/ -f1-5 | sort -u \
              | while read -r d; do [ -f "$d/terragrunt.hcl" ] && echo "$d"; done)
          fi
          echo "dirs=${dirs[*]}" >>"$GITHUB_OUTPUT"
          echo "changed stacks: ${#dirs[@]}"
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        if: steps.stacks.outputs.dirs != ''
        with:
          install_args: terraform terragrunt
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        if: steps.stacks.outputs.dirs != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TF_PLAN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: plan
        if: steps.stacks.outputs.dirs != ''
        env:
          DIRS: ${{ steps.stacks.outputs.dirs }}
        run: |
          status=0
          for d in $DIRS; do
            echo "::group::${d}"
            terragrunt run --non-interactive --working-dir "$d" -- plan -input=false -lock=false || status=1
            echo "::endgroup::"
          done
          exit "$status"
