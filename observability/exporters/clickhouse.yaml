# ClickHouse serves Prometheus metrics itself (port 9363), so only a ServiceMonitor is needed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clickhouse
  namespace: monitoring
  labels: {app.kubernetes.io/part-of: payments-platform, prometheus: platform}
spec:
  selector:
    matchLabels: {clickhouse.altinity.com/chi: analytics}
  endpoints:
    - port: prometheus
      interval: 30s
      relabelings:
        - {action: replace, targetLabel: cluster, replacement: analytics}
      metricRelabelings:
        - action: keep
          sourceLabels: [__name__]
          regex: ClickHouseAsyncMetrics_(ReplicasMaxAbsoluteDelay|MaxPartCountForPartition|DiskAvailable_default|DiskTotal_default)
        - action: labeldrop
          regex: (payment_id|customer_id|token|pan|card_number|cvv)
