# kafka-exporter for consumer lag, then a PodMonitor for the MSK Open Monitoring JMX endpoint.
# MSK accepts only TLS with IAM auth on 9098 (infra/modules/msk): SASL awsiam, credentials from the Pod Identity association
# monitoring/kafka-exporter, no client certificate
kafkaServer:
  - msk-bootstrap.kafka.internal:9098
tls:
  enabled: true
sasl:
  enabled: true
  awsiam:
    enabled: true
    mechanism: awsiam
serviceAccount:
  create: true
  name: kafka-exporter
extraArgs:
  # The router topics hyperswitch-<event>-events (deploy/platform/kafka-topics) and the consumer groups of the upstream ClickHouse Kafka tables
  - --topic.filter=^hyperswitch-[a-z-]+-events$
  - --group.filter=^(hyper|hyper-ckh|s3-sink)$
serviceMonitor:
  enabled: false
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 128Mi}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-exporter
  namespace: monitoring
  labels: {app.kubernetes.io/part-of: payments-platform, prometheus: platform}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus-kafka-exporter}
  endpoints:
    - port: kafka-exporter
      interval: 30s
      relabelings:
        - {action: replace, targetLabel: cluster, replacement: msk-main}
      metricRelabelings:
        - action: keep
          sourceLabels: [__name__]
          regex: kafka_(consumergroup_lag|brokers|topic_partitions)
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: msk-jmx
  namespace: monitoring
  labels: {app.kubernetes.io/part-of: payments-platform, prometheus: platform}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: msk-jmx-proxy}
  podMetricsEndpoints:
    - port: jmx
      interval: 60s
      relabelings:
        - {action: replace, targetLabel: cluster, replacement: msk-main}
      metricRelabelings:
        - action: keep
          sourceLabels: [__name__]
          regex: kafka_server_replicamanager_underreplicatedpartitions
