apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alerts-security-pci-posture
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: payments-platform
    prometheus: platform
spec:
  groups:
  - name: security-pci-posture
    rules:
    - alert: KmsKeyRotationOverdue
      expr: max by (key_alias) (kms_key_rotation_overdue_seconds) > 0
      for: 30m
      labels:
        severity: warning
        team: security
        service: kms
        owner: security-oncall
        layer: security-pci
        failure_mode: security-pci-kms-key-rotation-overdue
      annotations:
        summary: A KMS key is past its rotation date
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/security-pci/warnings.md#kms-key-rotation-overdue
        dashboard_url: https://grafana.payments.internal/d/edge
    - alert: KyvernoAuditViolations
      expr: sum by (policy_name) (increase(kyverno_policy_results_total{rule_result="fail",policy_validation_mode="audit"}[1h])) > 0
      for: 10m
      labels:
        severity: warning
        team: security
        service: kyverno
        owner: security-oncall
        layer: security-pci
        failure_mode: security-pci-kyverno-audit-violations
      annotations:
        summary: Kyverno audit policies report violations
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/security-pci/warnings.md#kyverno-audit-violations
        dashboard_url: https://grafana.payments.internal/d/edge
