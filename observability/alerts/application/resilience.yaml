# Generated by observability/lib/gen_resilience.py from policy/resilience/policy.yaml; do not edit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alerts-application-resilience
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: payments-platform
    prometheus: platform
spec:
  groups:
  - name: application-resilience
    rules:
    - alert: RetryStorm
      expr: sum by (dependency) (rate(retry_total[5m])) / sum by (dependency) (rate(dependency_requests_total[5m])) > 0.1
      for: 5m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: payments-core
        service: resilience
        owner: payments-core-oncall
        layer: application
        failure_mode: application-retry-storm
      annotations:
        summary: Retries exceed 10% of the traffic to a dependency
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/application/warnings.md#retry-storm'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/payments'
    - alert: RetryBudgetExhausted
      expr: sum by (dependency) (rate(retry_budget_exhausted_total{dependency=~"psp-sync|router-locker"}[5m])) > 0
      for: 2m
      keep_firing_for: 5m
      labels:
        severity: critical
        team: payments-core
        service: resilience
        owner: payments-core-oncall
        layer: application
        failure_mode: application-retry-budget-exhausted
      annotations:
        summary: The retry budget of the locker or PSP sync is exhausted
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/application/retry-budget-exhausted.md'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/payments'
    - alert: RetryBudgetExhaustedNonCritical
      expr: sum by (dependency) (rate(retry_budget_exhausted_total{dependency!~"psp-sync|router-locker"}[5m])) > 0
      for: 10m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: payments-core
        service: resilience
        owner: payments-core-oncall
        layer: application
        failure_mode: application-retry-budget-exhausted-non-critical
      annotations:
        summary: The retry budget of a dependency is exhausted
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/application/warnings.md#retry-budget-exhausted-non-critical'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/payments'
