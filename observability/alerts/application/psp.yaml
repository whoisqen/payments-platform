apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alerts-application-psp
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: payments-platform
    prometheus: platform
spec:
  groups:
  - name: application-psp
    rules:
    - alert: PSPDegraded
      expr: sum by (psp) (rate(psp_requests_total{outcome="technical_error"}[5m])) / sum by (psp) (rate(psp_requests_total[5m])) > 0.05
      for: 5m
      keep_firing_for: 5m
      labels:
        severity: critical
        team: payments-core
        service: router
        owner: payments-core-oncall
        layer: application
        failure_mode: application-psp-degraded
      annotations:
        summary: PSP technical errors exceed 5% of its calls
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/application/psp-degraded.md'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/payments'
    - alert: PspLatencyP99High
      expr: histogram_quantile(0.99, sum by (psp, le) (rate(psp_request_duration_seconds_bucket[5m]))) > 3
      for: 5m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: payments-core
        service: router
        owner: payments-core-oncall
        layer: application
        failure_mode: application-psp-latency-p99-high
      annotations:
        summary: PSP p99 latency above 3 seconds
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/application/warnings.md#psp-latency-p99-high'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/payments'
    - alert: PspCircuitBreakerOpen
      expr: max by (psp) (circuit_breaker_state{dependency="psp-authorize"}) == 2
      for: 5m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: payments-core
        service: router
        owner: payments-core-oncall
        layer: application
        failure_mode: application-psp-circuit-breaker-open
      annotations:
        summary: The circuit breaker of a PSP is open
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/application/warnings.md#psp-circuit-breaker-open'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/payments'
    - alert: AuthorizationRateDrop
      expr: sum by (psp) (rate(payment_attempts_total{outcome="authorized"}[15m])) / sum by (psp) (rate(payment_attempts_total[15m])) < (sum by (psp) (rate(payment_attempts_total{outcome="authorized"}[15m] offset 1w)) / sum by (psp) (rate(payment_attempts_total[15m] offset 1w))) - 0.05
      for: 15m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: payments-core
        service: router
        owner: payments-core-oncall
        layer: application
        failure_mode: application-authorization-rate-drop
      annotations:
        summary: Authorization rate is 5 points lower than the same time a week ago
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/application/warnings.md#authorization-rate-drop'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/payments'
