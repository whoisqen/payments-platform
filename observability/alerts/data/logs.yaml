apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alerts-data-logs
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: payments-platform
    prometheus: platform
spec:
  groups:
  - name: logs-opensearch
    rules:
    - alert: LogsOpenSearchClusterRed
      expr: max by (domain_name) (aws_es_cluster_statusred_maximum) >= 1
      for: 5m
      keep_firing_for: 5m
      labels:
        severity: critical
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-cluster-red
      annotations:
        summary: 'The central OpenSearch is red: at least one primary shard is unassigned'
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-open-search-cluster-red'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsOpenSearchClusterYellow
      expr: max by (domain_name) (aws_es_cluster_statusyellow_maximum) >= 1
      for: 15m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-cluster-yellow
      annotations:
        summary: 'The central OpenSearch is yellow: replica shards are unassigned'
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-open-search-cluster-yellow'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsOpenSearchUnassignedShards
      expr: max by (domain_name) (aws_es_shards_unassigned_maximum) > 0
      for: 15m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-unassigned-shards
      annotations:
        summary: The central OpenSearch has unassigned shards for 15 minutes
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/opensearch-shards.md'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsOpenSearchShardsPerNodeHigh
      expr: max by (node) (elasticsearch_node_shards_total) > 900
      for: 15m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-shards-per-node-high
      annotations:
        summary: A data node of the central OpenSearch holds more than 900 shards (limit 1000)
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/opensearch-shards.md'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsOpenSearchJvmPressureHigh
      expr: max by (domain_name) (aws_es_jvmmemory_pressure_maximum) > 80
      for: 15m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-jvm-pressure-high
      annotations:
        summary: JVM memory pressure of the central OpenSearch is above 80%
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-open-search-jvm-pressure-high'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsOpenSearchJvmPressureCritical
      expr: max by (domain_name) (aws_es_jvmmemory_pressure_maximum) > 92
      for: 5m
      keep_firing_for: 5m
      labels:
        severity: critical
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-jvm-pressure-critical
      annotations:
        summary: 'JVM memory pressure of the central OpenSearch is above 92%: writes are about to be blocked'
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-open-search-jvm-pressure-critical'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsOpenSearchCpuHigh
      expr: max by (domain_name) (aws_es_cpuutilization_maximum) > 80
      for: 30m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-cpu-high
      annotations:
        summary: CPU of the busiest central OpenSearch data node is above 80% for 30 minutes
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-open-search-cpu-high'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsOpenSearchStorageLow
      expr: 100 * sum by (domain_name) (aws_es_free_storage_space_sum) / (sum by (domain_name) (aws_es_free_storage_space_sum) + sum by (domain_name) (aws_es_cluster_used_space_maximum)) < 20
      for: 10m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-storage-low
      annotations:
        summary: The central OpenSearch has less than 20% free storage
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-open-search-storage-low'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsOpenSearchIsmFailing
      expr: time() - max by (stream) (label_replace(min_over_time(timestamp(elasticsearch_indices_docs_primary{index=~"[.]ds-logs-.+-[0-9]+"})[3d:10m]), "stream", "$1", "index", "[.]ds-(logs-.+)-[0-9]+")) > 2 * 86400 or time() - min by (stream) (label_replace(min_over_time(timestamp(elasticsearch_indices_docs_primary{index=~"[.]ds-logs-app-.+-[0-9]+"})[33d:1h]), "stream", "$1", "index", "[.]ds-(logs-app-.+)-[0-9]+")) > 32 * 86400
      for: 15m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-ism-failing
      annotations:
        summary: 'ISM of the central OpenSearch is stuck on {{ $labels.stream }}: no rollover for 2 days or a backing index outlived the 30-day delete'
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-open-search-ism-failing'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsOpenSearchIndexWritesBlocked
      expr: max by (domain_name) (aws_es_cluster_index_writes_blocked_maximum) >= 1
      for: 5m
      keep_firing_for: 5m
      labels:
        severity: critical
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-index-writes-blocked
      annotations:
        summary: 'The central OpenSearch blocks writes: log ingestion fails'
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-open-search-index-writes-blocked'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsOpenSearchServerErrors
      expr: 100 * sum by (domain_name) (aws_es_5xx_sum) / (sum by (domain_name) (aws_es_open_search_requests_sum) > 0) > 1
      for: 10m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-server-errors
      annotations:
        summary: More than 1% of the requests to the central OpenSearch end with 5xx
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-open-search-server-errors'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsOpenSearchThrottled
      expr: max by (domain_name) (delta(aws_es_threadpool_write_rejected_sum[10m])) > 0 or max by (domain_name) (max_over_time(aws_es_throughput_throttle_maximum[10m])) >= 1 or max by (domain_name) (max_over_time(aws_es_iops_throttle_maximum[10m])) >= 1
      for: 10m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-throttled
      annotations:
        summary: The central OpenSearch rejects writes or its EBS volumes are throttled
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-open-search-throttled'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsOpenSearchSnapshotFailing
      expr: max by (domain_name) (aws_es_automated_snapshot_failure_maximum) >= 1
      for: 15m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-snapshot-failing
      annotations:
        summary: The automated snapshot of the central OpenSearch failed
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-open-search-snapshot-failing'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsAuditIngestionErrors
      expr: sum by (pipeline_name) (max_over_time(aws_osis_opensearch_document_errors_count_sum[10m])) > 0 or sum by (pipeline_name) (max_over_time(aws_osis_opensearch_bulk_request_failed_count_sum[10m])) > 0 or sum by (pipeline_name) (max_over_time(aws_osis_s3_objects_failed_count_sum[10m])) > 0
      for: 10m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-audit-ingestion-errors
      annotations:
        summary: The audit ingestion pipeline {{ $labels.pipeline_name }} fails to read the log archive or to write to OpenSearch
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-audit-ingestion-errors'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogsIngestionStopped
      expr: sum by (environment) (label_replace(increase(elasticsearch_indices_indexing_index_total{index=~".*logs-app-.+-[0-9]+",index!~".*logs-app-unknown-[0-9]+"}[10m]), "environment", "$1", "index", ".*logs-app-(.+)-[0-9]+")) == 0
      for: 2m
      keep_firing_for: 5m
      labels:
        severity: critical
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-ingestion-stopped
      annotations:
        summary: No new documents reached logs-app-{{ $labels.environment }} for 10 minutes
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logs-opensearch.md#logs-ingestion-stopped'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
  - name: logs-pipeline
    rules:
    - alert: LogstashPipelineStalled
      expr: sum by (pod, pipeline) (rate(logstash_stats_pipeline_events_in[5m])) > 0 and sum by (pod, pipeline) (rate(logstash_stats_pipeline_events_out[5m])) == 0
      for: 5m
      keep_firing_for: 5m
      labels:
        severity: critical
        team: observability
        service: logstash
        owner: observability-oncall
        layer: data
        failure_mode: data-logstash-pipeline-stalled
      annotations:
        summary: Logstash pipeline {{ $labels.pipeline }} on {{ $labels.pod }} receives events but sends none
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logstash.md#logstash-pipeline-stalled'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogstashQueueBacklogHigh
      # logstash-exporter v1.x puts queue.queue_size_in_bytes into queue_events_queue_size: bytes over bytes
      expr: max by (pod, pipeline) (logstash_stats_pipeline_queue_events_queue_size / (logstash_stats_pipeline_queue_max_size_in_bytes > 0)) > 0.5
      for: 15m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: logstash
        owner: observability-oncall
        layer: data
        failure_mode: data-logstash-queue-backlog-high
      annotations:
        summary: The persistent queue of Logstash is more than half full
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logstash.md#logstash-queue-backlog-high'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogstashQueueNearlyFull
      # logstash-exporter v1.x puts queue.queue_size_in_bytes into queue_events_queue_size: bytes over bytes
      expr: max by (pod, pipeline) (logstash_stats_pipeline_queue_events_queue_size / (logstash_stats_pipeline_queue_max_size_in_bytes > 0)) > 0.8
      for: 5m
      keep_firing_for: 5m
      labels:
        severity: critical
        team: observability
        service: logstash
        owner: observability-oncall
        layer: data
        failure_mode: data-logstash-queue-nearly-full
      annotations:
        summary: 'The persistent queue of Logstash is more than 80% full: inputs are about to be blocked'
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logstash.md#logstash-queue-nearly-full'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogstashDeadLetterQueueEntries
      expr: max by (pod, pipeline) (delta(logstash_stats_pipeline_dead_letter_queue_size_in_bytes[15m])) > 0 or sum by (pod, pipeline) (increase(logstash_stats_pipeline_dead_letter_queue_dropped_events[15m])) > 0
      for: 5m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: logstash
        owner: observability-oncall
        layer: data
        failure_mode: data-logstash-dead-letter-queue-entries
      annotations:
        summary: Logstash writes events to its dead letter queue
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logstash.md#logstash-dead-letter-queue-entries'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogstashOutputErrors
      expr: sum by (pod, pipeline, plugin_id) (increase(logstash_stats_pipeline_plugin_bulk_requests_errors{plugin_type="output"}[10m])) > 0 or sum by (pod, pipeline, plugin_id) (increase(logstash_stats_pipeline_plugin_documents_non_retryable_failures{plugin_type="output"}[10m])) > 0
      for: 10m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: logstash
        owner: observability-oncall
        layer: data
        failure_mode: data-logstash-output-errors
      annotations:
        summary: The OpenSearch output of Logstash has bulk request errors or rejected documents
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logstash.md#logstash-output-errors'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogstashJvmHeapHigh
      expr: max by (pod) (logstash_stats_jvm_mem_heap_used_percent) > 85
      for: 15m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: logstash
        owner: observability-oncall
        layer: data
        failure_mode: data-logstash-jvm-heap-high
      annotations:
        summary: JVM heap of a Logstash pod is above 85%
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logstash.md#logstash-jvm-heap-high'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
    - alert: LogstashPodDown
      expr: max(kube_statefulset_replicas{namespace="monitoring",statefulset="logstash"}) - max(kube_statefulset_status_replicas_ready{namespace="monitoring",statefulset="logstash"}) > 0
      for: 5m
      keep_firing_for: 10m
      labels:
        severity: warning
        team: observability
        service: logstash
        owner: observability-oncall
        layer: data
        failure_mode: data-logstash-pod-down
      annotations:
        summary: At least one Logstash pod is not ready
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/data/logstash.md#logstash-pod-down'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/logs'
