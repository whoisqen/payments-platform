version: prometheus/v1
service: payments-status
labels: {team: payments-core, owner: payments-core-oncall, layer: application}
slos:
  - name: read
    objective: 99.95
    description: Share of GET /payments/{id} answered under 50 ms and without a 5xx.
    sli:
      events:
        error_query: sum(rate(http_server_requests_total{service="router",route="payments_retrieve"}[{{.window}}])) - sum(rate(http_server_request_duration_seconds_bucket{service="router",route="payments_retrieve",code!~"5..",le="0.05"}[{{.window}}]))
        total_query: sum(rate(http_server_requests_total{service="router",route="payments_retrieve"}[{{.window}}]))
    alerting:
      name: PaymentsStatusRead
      labels: {service: router}
      annotations:
        summary: Payment status reads slower than 50 ms or failing are burning the 99.95% error budget
        runbook_url: '{{ $externalLabels.runbook_base_url }}/docs/runbooks/slo/payment-status-read.md'
        dashboard_url: '{{ $externalLabels.grafana_url }}/d/slo-overview'
      page_alert: {labels: {severity: critical}}
      ticket_alert: {labels: {severity: warning}}
