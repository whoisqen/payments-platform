        team: payments-core
        owner: payments-core-oncall
        layer: application
        service: router
        severity: critical
        failure_mode: application-slo-authorization-availability
        slo: payments-authorization-availability
        sloth_id: payments-authorization-availability
        sloth_service: payments-authorization
        sloth_slo: availability
