rule_files:
- ../../slo/generated/payments-platform-overhead.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: slo:sli_error:ratio_rate1h{sloth_id="payments-platform-overhead-latency",sloth_service="payments-platform-overhead",sloth_slo="latency",team="payments-core",owner="payments-core-oncall",layer="application"}
    values: 0.0288x15
  - series: slo:sli_error:ratio_rate5m{sloth_id="payments-platform-overhead-latency",sloth_service="payments-platform-overhead",sloth_slo="latency",team="payments-core",owner="payments-core-oncall",layer="application"}
    values: 0.0288x15
  alert_rule_test:
  - eval_time: 10m
    alertname: PaymentsPlatformOverheadLatencyBurnFast
    exp_alerts:
    - exp_labels:
        team: payments-core
        owner: payments-core-oncall
        layer: application
        service: router
        severity: critical
        failure_mode: application-slo-platform-overhead-latency
        slo: payments-platform-overhead-latency
        sloth_id: payments-platform-overhead-latency
        sloth_service: payments-platform-overhead
        sloth_slo: latency
      exp_annotations:
        summary: Platform overhead above 150 ms is burning the 99.9% error budget (14.4x over 1h/5m)
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/slo/platform-overhead-latency.md
        dashboard_url: https://grafana.payments.internal/d/slo-overview
- interval: 1m
  input_series:
  - series: slo:sli_error:ratio_rate1h{sloth_id="payments-platform-overhead-latency",sloth_service="payments-platform-overhead",sloth_slo="latency",team="payments-core",owner="payments-core-oncall",layer="application"}
    values: 0.0288x15
  - series: slo:sli_error:ratio_rate5m{sloth_id="payments-platform-overhead-latency",sloth_service="payments-platform-overhead",sloth_slo="latency",team="payments-core",owner="payments-core-oncall",layer="application"}
    values: 0.00144x15
  alert_rule_test:
  - eval_time: 10m
    alertname: PaymentsPlatformOverheadLatencyBurnFast
    exp_alerts: []
- interval: 1m
  input_series:
  - series: slo:sli_error:ratio_rate6h{sloth_id="payments-platform-overhead-latency",sloth_service="payments-platform-overhead",sloth_slo="latency",team="payments-core",owner="payments-core-oncall",layer="application"}
