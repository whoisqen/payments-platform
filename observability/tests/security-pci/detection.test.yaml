rule_files:
- ../../alerts/security-pci/detection.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: guardduty_findings_total{severity="high",account="cde-prod"}
    values: 0+1x19
  alert_rule_test:
  - eval_time: 15m
    alertname: GuardDutyHighFinding
    exp_alerts:
    - exp_labels:
        severity: security
        team: security
        service: guardduty
        owner: security-oncall
        layer: security-pci
        failure_mode: security-pci-guard-duty-high-finding
        account: cde-prod
      exp_annotations:
        summary: GuardDuty reports a high-severity finding
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/security-pci/guard-duty-high-finding.md
        dashboard_url: https://grafana.payments.internal/d/edge
- interval: 1m
  input_series:
  - series: guardduty_findings_total{severity="high",account="cde-prod"}
    values: 0+0x19
  alert_rule_test:
  - eval_time: 15m
    alertname: GuardDutyHighFinding
    exp_alerts: []
- interval: 1m
  input_series:
  - series: guardduty_runtime_findings_total{cde="true",cluster="cde-prod-euc1"}
    values: 0+1x19
  alert_rule_test:
  - eval_time: 15m
    alertname: GuardDutyRuntimeCdeFinding
    exp_alerts:
    - exp_labels:
        severity: security
        team: security
        service: guardduty
        owner: security-oncall
        layer: security-pci
        failure_mode: security-pci-guard-duty-runtime-cde-finding
        cluster: cde-prod-euc1
      exp_annotations:
        summary: GuardDuty Runtime Monitoring raised a finding in the CDE
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/security-pci/guard-duty-runtime-cde-finding.md
        dashboard_url: https://grafana.payments.internal/d/edge
- interval: 1m
  input_series:
  - series: guardduty_runtime_findings_total{cde="true",cluster="cde-prod-euc1"}
    values: 0+0x19
  alert_rule_test:
  - eval_time: 15m
    alertname: GuardDutyRuntimeCdeFinding
    exp_alerts: []
- interval: 1m
  input_series:
  - series: pan_detected_total{source="logs"}
    values: 0+1x19
  alert_rule_test:
  - eval_time: 15m
    alertname: PanDetectedInLogs
    exp_alerts:
    - exp_labels:
        severity: security
        team: security
        service: otel-collector
        owner: security-oncall
        layer: security-pci
        failure_mode: security-pci-pan-detected-in-logs
        source: logs
      exp_annotations:
        summary: A PAN pattern was detected in telemetry or logs
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/security-pci/pan-detected-in-logs.md
        dashboard_url: https://grafana.payments.internal/d/edge
- interval: 1m
  input_series:
  - series: pan_detected_total{source="logs"}
    values: 0+0x19
  alert_rule_test:
  - eval_time: 15m
    alertname: PanDetectedInLogs
    exp_alerts: []
- interval: 1m
  input_series:
  - series: security_events_total{event="root_login"}
    values: 0+1x19
  alert_rule_test:
  - eval_time: 15m
    alertname: RootAccountLogin
    exp_alerts:
    - exp_labels:
        severity: security
        team: security
        service: cloudtrail
        owner: security-oncall
        layer: security-pci
        failure_mode: security-pci-root-account-login
      exp_annotations:
        summary: An AWS root account login happened
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/security-pci/root-account-login.md
        dashboard_url: https://grafana.payments.internal/d/edge
- interval: 1m
  input_series:
  - series: security_events_total{event="root_login"}
    values: 0+0x19
  alert_rule_test:
  - eval_time: 15m
    alertname: RootAccountLogin
    exp_alerts: []
- interval: 1m
  input_series:
  - series: security_events_total{event="break_glass"}
    values: 0+1x19
  alert_rule_test:
  - eval_time: 15m
    alertname: BreakGlassRoleUsed
    exp_alerts:
    - exp_labels:
        severity: security
        team: security
        service: cloudtrail
        owner: security-oncall
        layer: security-pci
        failure_mode: security-pci-break-glass-role-used
      exp_annotations:
        summary: The BreakGlass role was assumed
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/security-pci/break-glass-role-used.md
        dashboard_url: https://grafana.payments.internal/d/edge
- interval: 1m
  input_series:
  - series: security_events_total{event="break_glass"}
    values: 0+0x19
  alert_rule_test:
  - eval_time: 15m
    alertname: BreakGlassRoleUsed
    exp_alerts: []
- interval: 1m
  input_series:
  - series: security_events_total{event="scp_change"}
    values: 0+1x19
  alert_rule_test:
  - eval_time: 15m
    alertname: ScpChanged
    exp_alerts:
    - exp_labels:
        severity: security
        team: security
        service: cloudtrail
        owner: security-oncall
        layer: security-pci
        failure_mode: security-pci-scp-changed
      exp_annotations:
        summary: A service control policy changed
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/security-pci/scp-changed.md
        dashboard_url: https://grafana.payments.internal/d/edge
- interval: 1m
  input_series:
  - series: security_events_total{event="scp_change"}
    values: 0+0x19
  alert_rule_test:
  - eval_time: 15m
    alertname: ScpChanged
    exp_alerts: []
- interval: 1m
  input_series:
  - series: security_events_total{event="iam_change_outside_terraform"}
    values: 0+1x19
  alert_rule_test:
  - eval_time: 15m
    alertname: IamChangeOutsideTerraform
    exp_alerts:
    - exp_labels:
        severity: security
        team: security
        service: cloudtrail
        owner: security-oncall
        layer: security-pci
        failure_mode: security-pci-iam-change-outside-terraform
      exp_annotations:
        summary: An IAM change was made outside Terraform
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/security-pci/iam-change-outside-terraform.md
        dashboard_url: https://grafana.payments.internal/d/edge
- interval: 1m
  input_series:
  - series: security_events_total{event="iam_change_outside_terraform"}
    values: 0+0x19
  alert_rule_test:
  - eval_time: 15m
    alertname: IamChangeOutsideTerraform
    exp_alerts: []
- interval: 1m
  input_series:
  - series: vault_core_unsealed{cluster="vault-main"}
    values: '0x19'
  alert_rule_test:
  - eval_time: 15m
    alertname: VaultSealed
    exp_alerts:
    - exp_labels:
        severity: critical
        team: security
        service: vault
        owner: security-oncall
        layer: security-pci
        failure_mode: security-pci-vault-sealed
        cluster: vault-main
      exp_annotations:
        summary: Vault is sealed
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/security-pci/vault-sealed.md
        dashboard_url: https://grafana.payments.internal/d/edge
- interval: 1m
  input_series:
  - series: vault_core_unsealed{cluster="vault-main"}
    values: 1x19
  alert_rule_test:
  - eval_time: 15m
    alertname: VaultSealed
    exp_alerts: []
- interval: 1m
  input_series:
  - series: vault_audit_log_request_failure{cluster="vault-main"}
    values: 0+1x19
  alert_rule_test:
  - eval_time: 15m
    alertname: VaultAuditDeviceFailing
    exp_alerts:
    - exp_labels:
        severity: critical
        team: security
        service: vault
        owner: security-oncall
        layer: security-pci
        failure_mode: security-pci-vault-audit-device-failing
        cluster: vault-main
      exp_annotations:
        summary: Vault audit device fails
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/security-pci/vault-audit-device-failing.md
        dashboard_url: https://grafana.payments.internal/d/edge
- interval: 1m
  input_series:
  - series: vault_audit_log_request_failure{cluster="vault-main"}
    values: 0+0x19
  alert_rule_test:
  - eval_time: 15m
    alertname: VaultAuditDeviceFailing
    exp_alerts: []
- interval: 1m
  input_series:
  - series: security_events_total{event="cde_network_change"}
    values: 0+1x19
  alert_rule_test:
  - eval_time: 15m
    alertname: CdeNetworkPolicyChanged
    exp_alerts:
    - exp_labels:
        severity: warning
        team: security
        service: cloudtrail
        owner: security-oncall
        layer: security-pci
        failure_mode: security-pci-cde-network-policy-changed
      exp_annotations:
        summary: A CDE network control changed (security group, firewall or NACL)
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/security-pci/warnings.md#cde-network-policy-changed
