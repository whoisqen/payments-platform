rule_files:
- ../../alerts/backup-dr/backups.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  # YACE exports the failed-job count of one period, then nothing; there is no expired-job series at all
  input_series:
  - series: aws_backup_number_of_backup_jobs_failed_sum{backup_vault="gold"}
    values: _x3 1x2 _x14
  alert_rule_test:
  - eval_time: 15m
    alertname: BackupJobFailed
    exp_alerts:
    - exp_labels:
        severity: critical
        team: data-platform
        service: aws-backup
        owner: data-platform-oncall
        layer: backup-dr
        failure_mode: backup-dr-backup-job-failed
        backup_vault: gold
      exp_annotations:
        summary: An AWS Backup job failed or expired
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/backup-dr/backup-job-failed.md
        dashboard_url: https://grafana.example.test/d/backup
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: aws_backup_number_of_backup_jobs_expired_sum{backup_vault="gold"}
    values: _x3 2x2 _x14
  alert_rule_test:
  - eval_time: 15m
    alertname: BackupJobFailed
    exp_alerts:
    - exp_labels:
        severity: critical
        team: data-platform
        service: aws-backup
        owner: data-platform-oncall
        layer: backup-dr
        failure_mode: backup-dr-backup-job-failed
        backup_vault: gold
      exp_annotations:
        summary: An AWS Backup job failed or expired
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/backup-dr/backup-job-failed.md
        dashboard_url: https://grafana.example.test/d/backup
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  # a zero failed-job sample must not hide the expired jobs of the same vault
  input_series:
  - series: aws_backup_number_of_backup_jobs_failed_sum{backup_vault="gold"}
    values: 0x19
  - series: aws_backup_number_of_backup_jobs_expired_sum{backup_vault="gold"}
    values: _x3 2x2 _x14
  alert_rule_test:
  - eval_time: 15m
    alertname: BackupJobFailed
    exp_alerts:
    - exp_labels:
        severity: critical
        team: data-platform
        service: aws-backup
        owner: data-platform-oncall
        layer: backup-dr
        failure_mode: backup-dr-backup-job-failed
        backup_vault: gold
      exp_annotations:
        summary: An AWS Backup job failed or expired
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/backup-dr/backup-job-failed.md
        dashboard_url: https://grafana.example.test/d/backup
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: aws_backup_number_of_backup_jobs_failed_sum{backup_vault="gold"}
    values: 0+0x19
  - series: aws_backup_number_of_backup_jobs_expired_sum{backup_vault="gold"}
    values: 0+0x19
  alert_rule_test:
  - eval_time: 15m
    alertname: BackupJobFailed
    exp_alerts: []
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: backup_last_success_timestamp_seconds{store="memorydb-cell-1"}
    values: '0x21'
  - series: backup_interval_seconds{store="memorydb-cell-1"}
    values: 300x21
  alert_rule_test:
  - eval_time: 17m
    alertname: BackupMissing
    exp_alerts:
    - exp_labels:
        severity: critical
        team: data-platform
        service: aws-backup
        owner: data-platform-oncall
        layer: backup-dr
        failure_mode: backup-dr-backup-missing
        store: memorydb-cell-1
      exp_annotations:
        summary: The last successful backup of a store is older than twice its interval
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/backup-dr/backup-missing.md
        dashboard_url: https://grafana.example.test/d/backup
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: backup_last_success_timestamp_seconds{store="memorydb-cell-1"}
    values: 0+60x21
  - series: backup_interval_seconds{store="memorydb-cell-1"}
    values: 300x21
  alert_rule_test:
  - eval_time: 17m
    alertname: BackupMissing
    exp_alerts: []
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: aws_backup_number_of_copy_jobs_failed_sum{backup_vault="gold"}
    values: _x3 1x2 _x14
  alert_rule_test:
  - eval_time: 15m
    alertname: BackupCopyFailed
    exp_alerts:
    - exp_labels:
        severity: warning
        team: data-platform
        service: aws-backup
        owner: data-platform-oncall
        layer: backup-dr
        failure_mode: backup-dr-backup-copy-failed
        backup_vault: gold
      exp_annotations:
        summary: A backup copy to a recovery region or to the backup account failed
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/backup-dr/warnings.md#backup-copy-failed
        dashboard_url: https://grafana.example.test/d/backup
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: aws_backup_number_of_copy_jobs_failed_sum{backup_vault="gold"}
    values: 0+0x19
  alert_rule_test:
  - eval_time: 15m
    alertname: BackupCopyFailed
    exp_alerts: []
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: snapshot_copy_last_success_timestamp_seconds{store="memorydb-cell-1",region="us-east-1"}
    values: '0x134'
  alert_rule_test:
  - eval_time: 130m
    alertname: SnapshotCopyStale
    exp_alerts:
    - exp_labels:
        severity: warning
        team: data-platform
        service: aws-backup
        owner: data-platform-oncall
        layer: backup-dr
        failure_mode: backup-dr-snapshot-copy-stale
        store: memorydb-cell-1
        region: us-east-1
      exp_annotations:
        summary: The latest snapshot copy in a recovery region is older than 2 hours
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/backup-dr/warnings.md#snapshot-copy-stale
        dashboard_url: https://grafana.example.test/d/backup
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: snapshot_copy_last_success_timestamp_seconds{store="memorydb-cell-1",region="us-east-1"}
    values: 0+60x134
  alert_rule_test:
  - eval_time: 130m
    alertname: SnapshotCopyStale
    exp_alerts: []
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: kube_cronjob_status_last_successful_time{namespace="victoria-metrics",cronjob="vmbackup-1"}
    values: '0x300'
  alert_rule_test:
  - eval_time: 200m
    alertname: MetricsBackupStale
    exp_alerts:
    - exp_labels:
        severity: warning
        team: data-platform
        service: victoria-metrics
        owner: data-platform-oncall
        layer: backup-dr
        failure_mode: backup-dr-metrics-backup-stale
        cronjob: vmbackup-1
      exp_annotations:
        summary: A node of the central metrics store has no successful backup for 3 hours
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/backup-dr/warnings.md#metrics-backup-stale
        dashboard_url: https://grafana.example.test/d/backup
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: kube_cronjob_status_last_successful_time{namespace="victoria-metrics",cronjob="vmbackup-1"}
    values: 0+60x300
  alert_rule_test:
  - eval_time: 200m
    alertname: MetricsBackupStale
    exp_alerts: []
