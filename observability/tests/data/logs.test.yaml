        dashboard_url: https://grafana.example.test/d/logs
- interval: 1m
  external_labels: *id001
  input_series:
  - series: aws_es_jvmmemory_pressure_maximum{domain_name="pay-shared-services-euc1-logs"}
    values: 85x20
  alert_rule_test:
  - eval_time: 10m
    alertname: LogsOpenSearchJvmPressureCritical
