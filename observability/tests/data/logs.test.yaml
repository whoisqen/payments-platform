rule_files:
- ../../alerts/data/logs.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  external_labels: &id001
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: aws_es_cluster_statusred_maximum{domain_name="pay-shared-services-euc1-logs"}
    values: 1x20
  alert_rule_test:
  - eval_time: 10m
    alertname: LogsOpenSearchClusterRed
    exp_alerts:
    - exp_labels:
        severity: critical
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-cluster-red
        domain_name: pay-shared-services-euc1-logs
      exp_annotations:
        summary: 'The central OpenSearch is red: at least one primary shard is unassigned'
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/data/logs-opensearch.md#logs-open-search-cluster-red
        dashboard_url: https://grafana.example.test/d/logs
- interval: 1m
  external_labels: *id001
  input_series:
  - series: aws_es_cluster_statusred_maximum{domain_name="pay-shared-services-euc1-logs"}
    values: 0x9 1x3
  alert_rule_test:
  - eval_time: 12m
    alertname: LogsOpenSearchClusterRed
    exp_alerts: []
- interval: 1m
  external_labels: *id001
  input_series:
  - series: aws_es_cluster_statusyellow_maximum{domain_name="pay-shared-services-euc1-logs"}
    values: 1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: LogsOpenSearchClusterYellow
    exp_alerts:
    - exp_labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-cluster-yellow
        domain_name: pay-shared-services-euc1-logs
      exp_annotations:
        summary: 'The central OpenSearch is yellow: replica shards are unassigned'
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/data/logs-opensearch.md#logs-open-search-cluster-yellow
        dashboard_url: https://grafana.example.test/d/logs
- interval: 1m
  external_labels: *id001
  input_series:
  - series: aws_es_cluster_statusyellow_maximum{domain_name="pay-shared-services-euc1-logs"}
    values: 0x9 1x11
  alert_rule_test:
  - eval_time: 20m
    alertname: LogsOpenSearchClusterYellow
    exp_alerts: []
- interval: 1m
  external_labels: *id001
  input_series:
  - series: aws_es_shards_unassigned_maximum{domain_name="pay-shared-services-euc1-logs"}
    values: 3x30
  alert_rule_test:
  - eval_time: 20m
    alertname: LogsOpenSearchUnassignedShards
    exp_alerts:
    - exp_labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-unassigned-shards
        domain_name: pay-shared-services-euc1-logs
      exp_annotations:
        summary: The central OpenSearch has unassigned shards for 15 minutes
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/data/opensearch-shards.md
        dashboard_url: https://grafana.example.test/d/logs
- interval: 1m
  external_labels: *id001
  input_series:
  - series: aws_es_shards_unassigned_maximum{domain_name="pay-shared-services-euc1-logs"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: LogsOpenSearchUnassignedShards
    exp_alerts: []
- interval: 1m
  external_labels: *id001
  input_series:
  - series: elasticsearch_node_shards_total{cluster="logs",node="node-1"}
    values: 950x30
  alert_rule_test:
  - eval_time: 20m
    alertname: LogsOpenSearchShardsPerNodeHigh
    exp_alerts:
    - exp_labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-shards-per-node-high
        node: node-1
      exp_annotations:
        summary: A data node of the central OpenSearch holds more than 900 shards (limit 1000)
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/data/opensearch-shards.md
        dashboard_url: https://grafana.example.test/d/logs
- interval: 1m
  external_labels: *id001
  input_series:
  - series: elasticsearch_node_shards_total{cluster="logs",node="node-1"}
    values: 500x30
  alert_rule_test:
  - eval_time: 20m
    alertname: LogsOpenSearchShardsPerNodeHigh
    exp_alerts: []
- interval: 1m
  external_labels: *id001
  input_series:
