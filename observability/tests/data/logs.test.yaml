  alert_rule_test:
  - eval_time: 35m
    alertname: LogsOpenSearchCpuHigh
    exp_alerts:
    - exp_labels:
        severity: warning
        team: observability
        service: opensearch
        owner: observability-oncall
        layer: data
        failure_mode: data-logs-open-search-cpu-high
        domain_name: pay-shared-services-euc1-logs
      exp_annotations:
        summary: CPU of the busiest central OpenSearch data node is above 80% for 30 minutes
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/data/logs-opensearch.md#logs-open-search-cpu-high
        dashboard_url: https://grafana.example.test/d/logs
