        domain_name: pay-shared-services-euc1-logs
      exp_annotations:
        summary: JVM memory pressure of the central OpenSearch is above 80%
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/data/logs-opensearch.md#logs-open-search-jvm-pressure-high
        dashboard_url: https://grafana.example.test/d/logs
- interval: 1m
  external_labels: *id001
  input_series:
  - series: aws_es_jvmmemory_pressure_maximum{domain_name="pay-shared-services-euc1-logs"}
