rule_files:
- ../../alerts/data/memorydb.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: redis_memory_used_bytes{cell="cell-1",instance="shard-1"}
    values: 9x21
  - series: redis_memory_max_bytes{cell="cell-1",instance="shard-1"}
    values: 10x21
  alert_rule_test:
  - eval_time: 17m
    alertname: MemoryDbMemoryCritical
    exp_alerts:
    - exp_labels:
        severity: critical
        team: data-platform
        service: memorydb
        owner: data-platform-oncall
        layer: data
        failure_mode: data-memory-db-memory-critical
        cell: cell-1
        instance: shard-1
      exp_annotations:
        summary: MemoryDB memory above 85%, evictions are near
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/data/memory-db-memory-critical.md
        dashboard_url: https://grafana.example.test/d/data-stores
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: redis_memory_used_bytes{cell="cell-1",instance="shard-1"}
    values: 5x21
  - series: redis_memory_max_bytes{cell="cell-1",instance="shard-1"}
    values: 10x21
  alert_rule_test:
  - &id001
    eval_time: 17m
    alertname: MemoryDbMemoryCritical
    exp_alerts: []
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: redis_memory_used_bytes{cell="cell-1",instance="shard-1"}
    values: 5x9 9x1 5x9
  - series: redis_memory_max_bytes{cell="cell-1",instance="shard-1"}
    values: 10x9 10x1 10x9
  alert_rule_test:
  - *id001
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: redis_evicted_keys_total{cell="cell-1"}
    values: 0+5x21
  alert_rule_test:
  - eval_time: 17m
    alertname: MemoryDbEvictions
    exp_alerts:
    - exp_labels:
        severity: critical
        team: data-platform
        service: memorydb
        owner: data-platform-oncall
        layer: data
        failure_mode: data-memory-db-evictions
        cell: cell-1
      exp_annotations:
        summary: MemoryDB evicts keys
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/data/memory-db-evictions.md
        dashboard_url: https://grafana.example.test/d/data-stores
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: redis_evicted_keys_total{cell="cell-1"}
    values: 0+0x21
  alert_rule_test:
  - eval_time: 17m
    alertname: MemoryDbEvictions
    exp_alerts: []
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: memorydb_failover_events_total{cell="cell-1",shard="1"}
    values: 0+1x19
  alert_rule_test:
  - eval_time: 15m
    alertname: MemoryDbFailoverDetected
    exp_alerts:
    - exp_labels:
        severity: warning
        team: data-platform
        service: memorydb
        owner: data-platform-oncall
        layer: data
        failure_mode: data-memory-db-failover-detected
        cell: cell-1
        shard: '1'
      exp_annotations:
        summary: A MemoryDB shard failed over
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/data/warnings.md#memory-db-failover-detected
        dashboard_url: https://grafana.example.test/d/data-stores
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: memorydb_failover_events_total{cell="cell-1",shard="1"}
    values: 0+0x19
  alert_rule_test:
  - eval_time: 15m
    alertname: MemoryDbFailoverDetected
    exp_alerts: []
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: cache_warm_ratio{cell="cell-1"}
    values: 0.4x21
  alert_rule_test:
  - eval_time: 17m
    alertname: CacheWarmRatioLow
    exp_alerts:
    - exp_labels:
        severity: warning
        team: payments-core
        service: memorydb
        owner: payments-core-oncall
        layer: data
        failure_mode: data-cache-warm-ratio-low
        cell: cell-1
      exp_annotations:
        summary: Cache warm ratio stays below 75% five minutes after readiness (non-paging)
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/data/warnings.md#cache-warm-ratio-low
        dashboard_url: https://grafana.example.test/d/data-stores
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: cache_warm_ratio{cell="cell-1"}
    values: 0.95x21
  alert_rule_test:
  - &id002
    eval_time: 17m
    alertname: CacheWarmRatioLow
    exp_alerts: []
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: cache_warm_ratio{cell="cell-1"}
    values: 0.95x9 0.4x1 0.95x9
  alert_rule_test:
  - *id002
