rule_files:
- ../../alerts/application/components.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: http_server_requests_total{service="router",code="500",cell="cell-1"}
    values: 0+30x21
  - series: http_server_requests_total{service="router",code="200",cell="cell-1"}
    values: 0+100x21
  alert_rule_test:
  - eval_time: 17m
    alertname: Router5xxRateHigh
    exp_alerts:
    - exp_labels:
        severity: warning
        team: payments-core
        service: router
        owner: payments-core-oncall
        layer: application
        failure_mode: application-router5xx-rate-high
        cell: cell-1
      exp_annotations:
        summary: Router 5xx rate above 1% in a cell
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/application/warnings.md#router5xx-rate-high
        dashboard_url: https://grafana.example.test/d/router
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: http_server_requests_total{service="router",code="500",cell="cell-1"}
    values: 0+0x21
  - series: http_server_requests_total{service="router",code="200",cell="cell-1"}
    values: 0+100x21
  alert_rule_test:
  - eval_time: 17m
    alertname: Router5xxRateHigh
    exp_alerts: []
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
  - series: http_server_requests_total{service="locker",code="500"}
    values: 0+10x21
  - series: http_server_requests_total{service="locker",code="200"}
    values: 0+100x21
  alert_rule_test:
  - eval_time: 17m
    alertname: LockerErrorRateHigh
    exp_alerts:
    - exp_labels:
        severity: critical
        team: payments-core
        service: locker
        owner: payments-core-oncall
        layer: application
        failure_mode: application-locker-error-rate-high
      exp_annotations:
        summary: Locker 5xx rate above 1%
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/application/locker-error-rate-high.md
        dashboard_url: https://grafana.example.test/d/locker
- interval: 1m
  external_labels:
    runbook_base_url: https://git.example.test/acme/platform/blob/main
    grafana_url: https://grafana.example.test
  input_series:
