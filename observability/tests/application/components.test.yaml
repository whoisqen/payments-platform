    grafana_url: https://grafana.example.test
  input_series:
  - series: drain_lag_seconds{cell="cell-1"}
    values: 20x21
  alert_rule_test:
  - eval_time: 17m
    alertname: DrainLagHigh
    exp_alerts:
    - exp_labels:
        severity: critical
        team: payments-core
        service: drainer
        owner: payments-core-oncall
        layer: application
        failure_mode: application-drain-lag-high
        cell: cell-1
      exp_annotations:
        summary: Drain lag above 5 seconds
        runbook_url: https://git.example.test/acme/platform/blob/main/docs/runbooks/application/drain-lag-high.md
        dashboard_url: https://grafana.example.test/d/drainer
- interval: 1m
  external_labels:
