rule_files:
- ../../alerts/application/psp.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: psp_requests_total{psp="acme",outcome="technical_error"}
    values: 0+30x21
  - series: psp_requests_total{psp="acme",outcome="authorized"}
    values: 0+100x21
  alert_rule_test:
  - eval_time: 17m
    alertname: PSPDegraded
    exp_alerts:
    - exp_labels:
        severity: critical
        team: payments-core
        service: router
        owner: payments-core-oncall
        layer: application
        failure_mode: application-psp-degraded
        psp: acme
      exp_annotations:
        summary: PSP technical errors exceed 5% of its calls
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/application/psp-degraded.md
        dashboard_url: https://grafana.payments.internal/d/payments
- interval: 1m
  input_series:
  - series: psp_requests_total{psp="acme",outcome="technical_error"}
    values: 0+1x21
  - series: psp_requests_total{psp="acme",outcome="authorized"}
    values: 0+100x21
  alert_rule_test:
  - eval_time: 17m
    alertname: PSPDegraded
    exp_alerts: []
- interval: 1m
  input_series:
  - series: psp_request_duration_seconds_bucket{psp="acme",le="3"}
    values: 0+0x21
  - series: psp_request_duration_seconds_bucket{psp="acme",le="10"}
    values: 0+100x21
  - series: psp_request_duration_seconds_bucket{psp="acme",le="+Inf"}
    values: 0+100x21
  alert_rule_test:
  - eval_time: 17m
    alertname: PspLatencyP99High
    exp_alerts:
    - exp_labels:
        severity: warning
        team: payments-core
        service: router
        owner: payments-core-oncall
        layer: application
        failure_mode: application-psp-latency-p99-high
        psp: acme
      exp_annotations:
        summary: PSP p99 latency above 3 seconds
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/application/warnings.md#psp-latency-p99-high
        dashboard_url: https://grafana.payments.internal/d/payments
- interval: 1m
  input_series:
  - series: psp_request_duration_seconds_bucket{psp="acme",le="3"}
    values: 0+100x21
  - series: psp_request_duration_seconds_bucket{psp="acme",le="10"}
    values: 0+100x21
  - series: psp_request_duration_seconds_bucket{psp="acme",le="+Inf"}
    values: 0+100x21
  alert_rule_test:
  - eval_time: 17m
    alertname: PspLatencyP99High
    exp_alerts: []
- interval: 1m
  input_series:
  - series: circuit_breaker_state{dependency="psp-authorize",psp="acme"}
    values: 2x19
  alert_rule_test:
  - eval_time: 15m
    alertname: PspCircuitBreakerOpen
    exp_alerts:
    - exp_labels:
        severity: warning
        team: payments-core
        service: router
        owner: payments-core-oncall
        layer: application
        failure_mode: application-psp-circuit-breaker-open
        psp: acme
      exp_annotations:
        summary: The circuit breaker of a PSP is open
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/application/warnings.md#psp-circuit-breaker-open
        dashboard_url: https://grafana.payments.internal/d/payments
- interval: 1m
  input_series:
  - series: circuit_breaker_state{dependency="psp-authorize",psp="acme"}
    values: '0x19'
  alert_rule_test:
  - eval_time: 15m
    alertname: PspCircuitBreakerOpen
    exp_alerts: []
- interval: 5m
  input_series:
  - series: payment_attempts_total{psp="acme",outcome="authorized"}
    values: 0+95x2016 191520+70x200
  - series: payment_attempts_total{psp="acme"}
    values: 0+100x2200
  alert_rule_test:
  - eval_time: 10200m
    alertname: AuthorizationRateDrop
    exp_alerts:
    - exp_labels:
        severity: warning
        team: payments-core
        service: router
        owner: payments-core-oncall
        layer: application
        failure_mode: application-authorization-rate-drop
        psp: acme
      exp_annotations:
        summary: Authorization rate is 5 points lower than the same time a week ago
        runbook_url: https://github.com/whoisqen/payments-platform/blob/main/docs/runbooks/application/warnings.md#authorization-rate-drop
        dashboard_url: https://grafana.payments.internal/d/payments
- interval: 5m
  input_series:
  - series: payment_attempts_total{psp="acme",outcome="authorized"}
    values: 0+95x2200
  - series: payment_attempts_total{psp="acme"}
    values: 0+100x2200
  alert_rule_test:
  - eval_time: 10200m
    alertname: AuthorizationRateDrop
    exp_alerts: []
