# Single place where failure modes are added; a mode without alert stays a visible gap.
modes:
- layer: data
  id: data-aurora-writer-unavailable
  component: aurora
  failure: Aurora writer unavailable
  impact: drainer cannot write; the stream grows and the drain lag rises; reads of payment history fail
  severity: critical
  alert: AuroraWriterUnavailable
  signal: metric
  detect_within: 5m
- layer: data
  id: data-aurora-replication-slot-lag-high
  component: aurora
  failure: replication slot holds WAL
  impact: storage growth and a risk of write stop and of an unusable restore point
  severity: critical
  alert: AuroraReplicationSlotLagHigh
  signal: metric
  detect_within: 13m
- layer: data
  id: data-aurora-replica-lag-high
  component: aurora
  failure: reader replica lag
  impact: stale reads; reader promotion would lose recent rows
  severity: warning
  alert: AuroraReplicaLagHigh
  signal: metric
  detect_within: 8m
- layer: data
  id: data-aurora-connections-high
  component: aurora
  failure: connection exhaustion
  impact: new connections are refused and requests fail
  severity: warning
  alert: AuroraConnectionsHigh
  signal: metric
  detect_within: 8m
- layer: data
  id: data-aurora-cpu-high
  component: aurora
  failure: Aurora CPU saturation
  impact: latency growth in drainer batches and reads
  severity: warning
  alert: AuroraCpuHigh
  signal: metric
  detect_within: 18m
- layer: data
  id: data-aurora-deadlocks
  component: aurora
  failure: deadlocks
  impact: failed transactions; the drainer retries the batch
  severity: warning
  alert: AuroraDeadlocks
  signal: metric
  detect_within: 8m
- layer: data
  id: data-aurora-table-growth-fast
  component: aurora
  failure: fast table growth
  impact: capacity and restore time (D4 target 30 minutes) grow with data size
  severity: warning
  alert: AuroraTableGrowthFast
  signal: metric
  detect_within: 63m
- layer: data
  id: data-memory-db-memory-critical
  component: memorydb
  failure: MemoryDB memory exhaustion
  impact: payment state keys can be evicted or writes rejected; MemoryDB is the hot path
  severity: critical
  alert: MemoryDbMemoryCritical
  signal: metric
  detect_within: 8m
- layer: data
  id: data-memory-db-evictions
  component: memorydb
  failure: MemoryDB evicts keys
  impact: payment state or idempotency keys are lost before they are drained to Aurora
  severity: critical
  alert: MemoryDbEvictions
  signal: metric
  detect_within: 8m
- layer: data
  id: data-memory-db-failover-detected
  component: memorydb
  failure: MemoryDB shard failover
  impact: a short write pause; the cache warms again after a node replacement
  severity: warning
  alert: MemoryDbFailoverDetected
  signal: metric
  detect_within: 3m
- layer: data
  id: data-cache-warm-ratio-low
  component: cache
  failure: cache not warm after replacement
  impact: higher latency and Aurora load while the cell takes traffic anyway (D8)
  severity: warning
  alert: CacheWarmRatioLow
  signal: metric
  detect_within: 8m
- layer: data
  id: data-dynamo-db-throttling
  component: dynamodb
  failure: DynamoDB throttling
  impact: merchant-to-cell lookups slow down; router caches cover short throttling
  severity: warning
  alert: DynamoDbThrottling
  signal: metric
  detect_within: 8m
- layer: data
  id: data-click-house-replication-lag
  component: clickhouse
  failure: ClickHouse replica delay
  impact: stale analytics; a failover loses recent inserts
  severity: warning
  alert: ClickHouseReplicationLag
  signal: metric
  detect_within: 13m
- layer: data
  id: data-click-house-merge-backlog
  component: clickhouse
  failure: merge backlog
  impact: inserts are throttled and then rejected
  severity: warning
  alert: ClickHouseMergeBacklog
  signal: metric
  detect_within: 18m
- layer: data
  id: data-click-house-disk-low
  component: clickhouse
  failure: ClickHouse disk full
  impact: inserts stop; analytics are restored from the hourly backup if corrupted
  severity: warning
  alert: ClickHouseDiskLow
  signal: metric
  detect_within: 13m
- layer: data
  id: data-kafka-consumer-lag-high
  component: msk
  failure: consumer lag
  impact: analytics are late; the payment path is not affected (it accepts payments without MSK)
  severity: warning
  alert: KafkaConsumerLagHigh
  signal: metric
  detect_within: 13m
- layer: data
  id: data-kafka-under-replicated-partitions
  component: msk
  failure: under-replicated partitions
  impact: reduced durability of events with RF 3; the S3 sink keeps the archive
  severity: warning
  alert: KafkaUnderReplicatedPartitions
  signal: metric
  detect_within: 8m
- layer: data
  id: data-kafka-broker-disk-high
  component: msk
  failure: broker disk full
  impact: the broker stops accepting writes
  severity: warning
  alert: KafkaBrokerDiskHigh
  signal: metric
  detect_within: 13m
- layer: data
  id: data-memorydb-replica-lag
  component: memorydb
  failure: MemoryDB replica replication lag
  impact: failover loses the most recent writes of the shard
  severity: warning
  alert: null
  signal: metric
  reason: metric `redis_replication_lag` is not scraped yet
- layer: data
  id: data-logs-open-search-cluster-red
  component: opensearch
  failure: central OpenSearch red
  impact: logs of the affected indices are not searchable and writes to them fail; Logstash queues on disk, the audit trail stays in the S3 log archive
  severity: critical
  alert: LogsOpenSearchClusterRed
  signal: metric
  detect_within: 8m
- layer: data
  id: data-logs-open-search-cluster-yellow
  component: opensearch
  failure: central OpenSearch yellow
  impact: replicas are missing; one more node loss makes the cluster red
  severity: warning
  alert: LogsOpenSearchClusterYellow
  signal: metric
  detect_within: 18m
- layer: data
  id: data-logs-open-search-unassigned-shards
  component: opensearch
  failure: unassigned shards
  impact: data without a replica or not searchable; allocation is blocked by disk, shard limit or a lost node
  severity: warning
  alert: LogsOpenSearchUnassignedShards
  signal: metric
  detect_within: 18m
- layer: data
  id: data-logs-open-search-shards-per-node-high
  component: opensearch
  failure: shards per data node near the 1000 limit
  impact: new backing indices cannot be created at rollover, so ingestion stops
  severity: warning
  alert: LogsOpenSearchShardsPerNodeHigh
  signal: metric
  detect_within: 18m
- layer: data
  id: data-logs-open-search-jvm-pressure-high
  component: opensearch
  failure: JVM memory pressure high
  impact: slow search and indexing, long garbage collection pauses
  severity: warning
  alert: LogsOpenSearchJvmPressureHigh
  signal: metric
  detect_within: 18m
- layer: data
  id: data-logs-open-search-jvm-pressure-critical
  component: opensearch
  failure: JVM memory pressure critical
  impact: at 92% the service blocks writes and nodes may fail with out of memory
  severity: critical
  alert: LogsOpenSearchJvmPressureCritical
  signal: metric
  detect_within: 8m
- layer: data
  id: data-logs-open-search-cpu-high
  component: opensearch
  failure: CPU saturated
  impact: indexing falls behind, Logstash queues grow, searches time out
  severity: warning
  alert: LogsOpenSearchCpuHigh
  signal: metric
  detect_within: 33m
- layer: data
  id: data-logs-open-search-storage-low
  component: opensearch
  failure: free storage low
  impact: below the flood stage the indices become read-only and log ingestion stops
  severity: warning
  alert: LogsOpenSearchStorageLow
  signal: metric
  detect_within: 13m
- layer: data
  id: data-logs-open-search-ism-failing
  component: opensearch
  failure: Index State Management failing
  impact: rollover, warm migration or deletion stops; shards grow too large and storage fills
  severity: warning
  alert: LogsOpenSearchIsmFailing
  signal: metric
  detect_within: 18m
- layer: data
  id: data-logs-open-search-index-writes-blocked
  component: opensearch
  failure: index writes blocked
  impact: no log document is written; Logstash and the audit pipelines retry and buffer
  severity: critical
  alert: LogsOpenSearchIndexWritesBlocked
  signal: metric
  detect_within: 8m
- layer: data
  id: data-logs-open-search-server-errors
  component: opensearch
  failure: 5xx responses
  impact: Logstash and the audit pipelines retry; searches in OpenSearch Dashboards fail
  severity: warning
  alert: LogsOpenSearchServerErrors
  signal: metric
  detect_within: 13m
- layer: data
  id: data-logs-open-search-throttled
  component: opensearch
  failure: write rejections or EBS throttling
  impact: indexing slows down and writers retry; queues grow upstream
  severity: warning
  alert: LogsOpenSearchThrottled
  signal: metric
  detect_within: 13m
- layer: data
  id: data-logs-open-search-snapshot-failing
  component: opensearch
  failure: snapshot failing
  impact: a lost domain cannot be restored to the last day; the S3 log archive keeps the raw logs
  severity: warning
  alert: LogsOpenSearchSnapshotFailing
  signal: metric
  detect_within: 18m
- layer: data
  id: data-logs-audit-ingestion-errors
  component: opensearch-ingestion
  failure: audit ingestion pipeline errors
  impact: CloudTrail or EKS audit events are missing from logs-audit; the S3 log archive keeps them
  severity: warning
  alert: LogsAuditIngestionErrors
  signal: metric
  detect_within: 13m
- layer: data
  id: data-logs-ingestion-stopped
  component: opensearch
  failure: application log ingestion stopped
  impact: application logs of an environment are not searchable; incidents are diagnosed blind
  severity: critical
  alert: LogsIngestionStopped
  signal: metric
  detect_within: 15m
- layer: data
  id: data-logstash-pipeline-stalled
  component: logstash
  failure: Logstash pipeline stalled
  impact: events pile up in the persistent queue and no log reaches OpenSearch
  severity: critical
  alert: LogstashPipelineStalled
  signal: metric
  detect_within: 8m
- layer: data
  id: data-logstash-queue-backlog-high
  component: logstash
  failure: persistent queue backlog
  impact: logs reach OpenSearch late; a full queue blocks the collectors
  severity: warning
  alert: LogstashQueueBacklogHigh
  signal: metric
  detect_within: 18m
- layer: data
  id: data-logstash-queue-nearly-full
  component: logstash
  failure: persistent queue nearly full
  impact: inputs are blocked next and the collectors drop logs once their buffers fill
  severity: critical
  alert: LogstashQueueNearlyFull
  signal: metric
  detect_within: 8m
- layer: data
  id: data-logstash-dead-letter-queue-entries
  component: logstash
  failure: events in the dead letter queue
  impact: the rejected events are not searchable until they are fixed and replayed
  severity: warning
  alert: LogstashDeadLetterQueueEntries
  signal: metric
  detect_within: 8m
- layer: data
  id: data-logstash-output-errors
  component: logstash
  failure: OpenSearch output errors or retries
  impact: logs reach OpenSearch late or end in the dead letter queue
  severity: warning
  alert: LogstashOutputErrors
  signal: metric
  detect_within: 13m
- layer: data
  id: data-logstash-jvm-heap-high
  component: logstash
  failure: Logstash JVM heap high
  impact: long garbage collection pauses slow the pipeline; out of memory restarts the pod
  severity: warning
  alert: LogstashJvmHeapHigh
  signal: metric
  detect_within: 18m
- layer: data
  id: data-logstash-pod-down
  component: logstash
  failure: Logstash pod down
  impact: less ingest capacity; events in the queue of that pod wait until it returns
  severity: warning
  alert: LogstashPodDown
  signal: metric
  detect_within: 8m
