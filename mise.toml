# Single source of tool versions for laptops and CI (jdx/mise-action); Renovate keeps them current.
[tools]
python = "3.12"
node = "22"
terraform = "1.17.0"
terragrunt = "0.93.0"
helm = "3.22.0"
# local and commit-stage kind cluster (scripts/kind)
kind = "0.33.0"
kubectl = "1.37.3"
helmfile = "1.8.5"
kubeconform = "0.8.0"
opa = "1.22.4"
conftest = "0.62.0"
kyverno = "1.20.0"
actionlint = "1.7.12"
shellcheck = "0.9.0"
gitleaks = "8.21.2"
hadolint = "2.12.0"
"github:sbdchd/squawk" = "2.74.0"
trivy = "0.69.3"
syft = "1.28.0"
cosign = "2.5.3"
container-structure-test = "1.19.3"
crane = "0.20.6"
# linters in report mode (LINT_STRICT) and the test runners of the pull request stage
ruff = "0.17.6"
yamllint = "1.37.1"
tflint = "0.66.0"
kube-linter = "0.8.3"
cargo-nextest = "0.9.152"
promtool = "3.16.0"
# scanners of .github/workflows/security.yml
"pipx:semgrep" = "1.131.0"
"pipx:checkov" = "3.2.450"
"pipx:pip-audit" = "2.9.0"
"pipx:zizmor" = "1.11.0"
"github:EmbarkStudios/cargo-deny" = "0.18.3"

[settings]
experimental = true
