default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 43fae355e6fe4d99d2a7b240a224b85e2903aeb4 # v8.21.2
    hooks:
      - id: gitleaks
        args: [--config, .github/gitleaks.toml]

  - repo: local
    hooks:
      - id: spec-gate
        name: spec gate
        entry: python3 tools/lint/spec-gate --msg
        language: system
        stages: [commit-msg]
      - id: spec-lint
        name: spec-lint and srs-lint
        entry: bash -c 'tools/lint/spec-lint && tools/lint/srs-lint && tools/lint/orchestration-lint --strict'
        language: system
        pass_filenames: false
        files: ^(specs|docs/requirements|\.claude)/
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive
        language: system
        files: \.tf$
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'for d in vendor/hyperswitch vendor/card-vault; do (cd "$d" && cargo fmt --check) || exit 1; done'
        language: system
        pass_filenames: false
        files: ^vendor/(hyperswitch|card-vault)/.*\.rs$
