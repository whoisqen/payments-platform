ou: Infrastructure
accounts:
  - name: network
    email: aws-pay-network@example.com
    customizations: network
    sso_user: &sso { email: platform@example.com, first_name: Platform, last_name: Team }
    tags: &infra
      environment: prod
      team: platform
      owner: platform@example.com
      cost-center: cc-100
      cell: shared
      pci-scope: connected
      data-class: internal
      backup-tier: none
  - name: shared-services
    email: aws-pay-shared-services@example.com
    customizations: shared-services
    sso_user: *sso
    tags:
      <<: *infra
      backup-tier: gold
  - name: backup
    email: aws-pay-backup@example.com
    customizations: backup
    sso_user: *sso
    tags:
      <<: *infra
      data-class: card-data
      backup-tier: gold
